  #cam-video{

  #scene{
    position:fixed; inset:0; z-index:2;
    width:100%; height:100%;

    mix-blend-mode:screen;
  }
  #overlay{
    position:fixed; inset:0; z-index:3;

  #vignette{

</style>

<script type="module">
import * as THREE from 'three';

window.__APP_BOOTED__ = true;

/* =========================================================
   0. 工具
   ========================================================= */
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const damp = (c, t, l, dt) => c + (t - c) * (1 - Math.exp(-l * dt));
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const dampAngle = (c, t, l, dt) => c + angDiff(t, c) * (1 - Math.exp(-l * dt));   // 角度阻尼（走最短路径）

let _g2 = null;
function gauss() {
  if (_g2 !== null) { const v = _g2; _g2 = null; return v; }
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  const m = Math.sqrt(-2 * Math.log(u));
  _g2 = m * Math.sin(TAU * v);
  return m * Math.cos(TAU * v);
}

const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const MOBILE = IS_TOUCH && Math.min(innerWidth, innerHeight) < 820;
const TIER_HI = (navigator.hardwareConcurrency || 4) >= 8;   // 高端设备识别
const DEFAULT_COUNT = MOBILE ? (TIER_HI ? 150000 : 110000) : 250000;   // 15–25 万   // 移动端 120k 保帧率 / 桌面 360k
let DPR = Math.min(devicePixelRatio || 1, MOBILE ? 2 : 2.5);   // 移动端 2× 保帧率 / 桌面 2.5× 更锐利
/* 像素预算：超大视口（如横屏 / 桌面模式）自动降采样 —— 星系是填充率密集型，像素数才是关键 */
const MAX_PIXELS = MOBILE ? 1.7e6 : 2.8e6;
(function capPixels() {
  const px = innerWidth * DPR * innerHeight * DPR;
  if (px > MAX_PIXELS) DPR = Math.max(1, DPR * Math.sqrt(MAX_PIXELS / px));
})();

/* mix-blend-mode:screen 是否可用（不可用时隐藏视频，仍可运行） */
const SUPPORTS_SCREEN = !!(window.CSS && CSS.supports && CSS.supports('mix-blend-mode', 'screen'));

/* =========================================================
   1. 3D 银河几何
   ---------------------------------------------------------
   种群：核球 / 旋臂（含恒星团+盘面翘曲） / 盘面尘埃 / 外围晕
   ========================================================= */

const GALAXY_R = 4.0;    // 银河规模
let NARMS = 5;           // 旋臂数（面板可调 2–7）
const TWIST = 3.6;
const CORE_R = 0.55;   // 核球半径加大

/* 对数螺旋（真实星系旋臂形态）：theta = arm*2π/N + k*ln(r/r0) */
const ARM_R0 = 0.20;
const ARM_PITCH = 2.6;
function armAngle(arm, rn) {
  return arm * (TAU / NARMS) + ARM_PITCH * Math.log(Math.max(0.08, rn) / ARM_R0);
}

/* 核暖白 → 金黄 → 橙红 → 玫红 → 品红紫 → 紫 → 深蓝 → 青（哈勃/韦伯色调） */
const COLOR_STOPS = [
  [0.00, 1.000, 0.945, 0.788],   // #fff1c9 暖白（银核）
  [0.14, 1.000, 0.882, 0.686],   // #ffe1af 暖黄
  [0.34, 1.000, 0.918, 0.812],   // 黄白
  [0.52, 0.902, 0.902, 1.000],   // 白
  [0.70, 0.722, 0.800, 1.000],   // #b8ccff 蓝白（旋臂主体）
  [0.86, 0.560, 0.706, 1.000],   // #8fb4ff 蓝
  [1.00, 0.420, 0.820, 1.000],   // #6bd1ff 深青蓝
];

/* 恒星色温色板（蓝白 / 白 / 黄 / 橙红）—— 星点按色温着色 */
const TEMPS = [
  { c: [0.74, 0.83, 1.00], w: 0.08 },
  { c: [1.00, 1.00, 1.00], w: 0.14 },
  { c: [1.00, 0.91, 0.72], w: 0.42 },
  { c: [1.00, 0.72, 0.47], w: 0.26 },
  { c: [1.00, 0.54, 0.38], w: 0.10 },
];
function pickTemp(rgb) {
  let r = Math.random(), acc = 0;
  for (const s of TEMPS) { acc += s.w; if (r <= acc) { rgb[0] = s.c[0]; rgb[1] = s.c[1]; rgb[2] = s.c[2]; return; } }
  rgb[0] = 1; rgb[1] = 1; rgb[2] = 1;
}

/* 2D 值噪声 + FBM（暗尘带 / 旋臂断裂 / 扇形扭曲用） */
function vnoise2(x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const h = (a, b) => {
    let n = (a * 374761393 + b * 668265263 + seed * 1442695041) | 0;
    n = (n ^ (n >> 13)) * 1274126177 | 0;
    return ((n ^ (n >> 16)) >>> 0) / 4294967295;
  };
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm2(x, y, seed, oct) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let o = 0; o < oct; o++) { s += amp * vnoise2(x * f, y * f, seed + o * 17); norm += amp; amp *= 0.5; f *= 2.1; }
  return s / norm;
}

function rampColor(t, out) {
  t = clamp(t);
  for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
    const a = COLOR_STOPS[i], b = COLOR_STOPS[i + 1];
    if (t <= b[0]) {
      const k = (t - a[0]) / Math.max(1e-6, b[0] - a[0]);
      out[0] = a[1] + (b[1] - a[1]) * k;
      out[1] = a[2] + (b[2] - a[2]) * k;
      out[2] = a[3] + (b[3] - a[3]) * k;
      return;
    }
  }
  const b = COLOR_STOPS[COLOR_STOPS.length - 1];
  out[0] = b[1]; out[1] = b[2]; out[2] = b[3];
}

function corePos(out, i3) {
  const cr = CORE_R * Math.pow(Math.random(), 0.5);
  const ph = Math.random() * TAU;
  const ct = Math.random() * 2 - 1;
  const st = Math.sqrt(Math.max(0, 1 - ct * ct));
  out[i3]     = cr * st * Math.cos(ph);
  out[i3 + 1] = cr * st * Math.sin(ph);
  out[i3 + 2] = cr * ct * 0.60;
}

/* 色彩饱和度提升（+18%）：层次分明且过渡平滑 */
function saturate(rgb, s) {
  const l = 0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2];
  rgb[0] = Math.max(0, l + (rgb[0] - l) * s);
  rgb[1] = Math.max(0, l + (rgb[1] - l) * s);
  rgb[2] = Math.max(0, l + (rgb[2] - l) * s);
}

/* HII 粉红发射星云区（20–30 处，大小不一） */
let HII_REGIONS = [];
function buildHII() {
  HII_REGIONS = [];
  const n = 22 + ((Math.random() * 9) | 0);          // 22–30 处
  for (let i = 0; i < n; i++) {
    const arm = (Math.random() * NARMS) | 0;
    const rn = 0.20 + 0.74 * Math.pow(Math.random(), 0.9);
    HII_REGIONS.push({
      rn,
      theta: armAngle(arm, rn) + gauss() * 0.15,
      r: 0.028 + 0.075 * Math.random(),              // 尺寸不一
    });
  }
}

/* 旋臂脊线上的恒星团（亮结）—— 随旋臂数重建 */
let CLUSTERS = [];
function buildClusters() {
  CLUSTERS = [];
  for (let a = 0; a < NARMS; a++) {
    for (let k = 0; k < 14; k++) {
      const rn = ARM_R0 + (1 - ARM_R0) * (k + 0.5 + Math.random() * 0.5) / 14;
      CLUSTERS.push({ rn, theta: armAngle(a, rn) + (Math.random() - 0.5) * 0.12 });
    }
  }
  buildHII();
}
buildClusters();

/* 旋臂不对称：每条臂独立的相位 / 宽度 / 亮度抖动（禁止完美对称螺旋） */
const ARM_JIT = [];
(function () {
  for (let a = 0; a < 8; a++) {
    ARM_JIT.push({ ph: (Math.random() - 0.5) * 0.55, w: 0.72 + Math.random() * 0.6, br: 0.72 + Math.random() * 0.55 });
  }
})();

/* ---- 4 层粒子：尺寸分布 + 独立材质参数 ----
   星尘 70%（1–2px 雾状底色）/ 中等 22%（2–4px 旋臂轮廓）
   亮星 7%（5–10px 柔和光晕）/ 巨星 1%（12–24px 十字衍射光芒） */
const LAYERS = [
  { key: 'dust',   frac: 0.750, sMin: 1.0,  sMax: 2.0,  glow: 0.58, spread: 1.00, giant: false },
  { key: 'mid',    frac: 0.180, sMin: 2.0,  sMax: 4.0,  glow: 1.00, spread: 0.86, giant: false },
  { key: 'bright', frac: 0.055, sMin: 5.0,  sMax: 10.0, glow: 1.45, spread: 0.70, giant: false },
  { key: 'giant',  frac: 0.015, sMin: 12.0, sMax: 24.0, glow: 1.75, spread: 0.58, giant: true  },
];

/* 单层几何：核球 / 中心棒 / 旋臂 / 银晕 采样，尺寸落在该层区间 */
function buildLayerGeometry(layer, count) {
  const N = Math.max(1, count | 0);
  const pos  = new Float32Array(N * 3);
  const open = new Float32Array(N * 3);
  const col  = new Float32Array(N * 3);
  const rnd  = new Float32Array(N);
  const siz  = new Float32Array(N);
  const dly  = new Float32Array(N);
  const disk = new Float32Array(N);

  const rgb = [0, 0, 0];
  let i = 0;

  const nBulge = Math.round(N * 0.13);
  const nBar   = Math.round(N * 0.06);
  const nHalo  = Math.round(N * 0.20);
  const nArms  = N - nBulge - nBar - nHalo;

  const sOf = () => layer.sMin + (layer.sMax - layer.sMin) * Math.pow(Math.random(), 0.7);

  /* ---------- 核球（中心极亮且密集，核心更厚） ---------- */
  for (let k = 0; k < nBulge; k++, i++) {
    const rr = 0.62 * GALAXY_R * Math.pow(Math.random(), 1.75);
    const ct = Math.random() * 2 - 1;
    const st = Math.sqrt(Math.max(0, 1 - ct * ct));
    const ph = Math.random() * TAU;
    open[i * 3]     = rr * st * Math.cos(ph);
    open[i * 3 + 1] = rr * st * Math.sin(ph);
    open[i * 3 + 2] = rr * ct * 0.54;

    corePos(pos, i * 3);

    rampColor(0.02 + 0.20 * Math.random(), rgb);
    saturate(rgb, 1.16);
    const j = 1.05 + 0.35 * Math.random();
    col[i * 3] = rgb[0] * j; col[i * 3 + 1] = rgb[1] * j; col[i * 3 + 2] = rgb[2] * j;

    rnd[i] = Math.random();
    siz[i] = sOf() * (0.85 + 0.4 * Math.random());
    dly[i] = Math.random() * 0.30;
    disk[i] = 0.25;
  }

  /* ---------- 中心棒（棒旋星系） ---------- */
  const BAR_A = 0.72 * GALAXY_R, BAR_B = 0.19 * GALAXY_R, BAR_C = 0.070 * GALAXY_R;
  for (let k = 0; k < nBar; k++, i++) {
    const t = Math.pow(Math.random(), 0.7);
    const sgn = Math.random() < 0.5 ? -1 : 1;
    open[i * 3]     = sgn * t * BAR_A;
    open[i * 3 + 1] = gauss() * BAR_B * (1 - 0.35 * t);
    open[i * 3 + 2] = gauss() * BAR_C * (1 - 0.30 * t);

    corePos(pos, i * 3);
    rampColor(0.04 + 0.14 * Math.random(), rgb);
    saturate(rgb, 1.16);
    const d = 0.72 + Math.random() * 0.45;
    col[i * 3] = rgb[0] * d; col[i * 3 + 1] = rgb[1] * d; col[i * 3 + 2] = rgb[2] * d;

    rnd[i] = Math.random();
    siz[i] = sOf() * (0.7 + 0.35 * Math.random());
    dly[i] = Math.random() * 0.25;
    disk[i] = 0.55;
  }

  /* ---------- 旋臂：高斯散布 + 羽状分叉 + 蓝白年轻星 / 橙红红巨星 / 粉红 HII ---------- */
  for (let k = 0; k < nArms; k++, i++) {
    const rn = ARM_R0 + (1 - ARM_R0) * Math.pow(Math.random(), 0.62);
    const r  = rn * GALAXY_R;

    const arm  = (Math.random() * NARMS) | 0;
    const jit  = ARM_JIT[arm % ARM_JIT.length];
    const base = armAngle(arm, rn) + jit.ph;

    const tight = Math.random() < 0.58;
    const armW  = (tight ? (0.038 + 0.026 * rn) : (0.15 + 0.14 * rn)) * layer.spread * jit.w;

    let theta = base + gauss() * armW;
    let rj    = Math.max(0.06, r + gauss() * (tight ? 0.022 : 0.055) * GALAXY_R);

    /* 羽状分支（spur） */
    if (!tight && Math.random() < 0.10) {
      const s = Math.pow(Math.random(), 1.6);
      rj += s * 0.16 * GALAXY_R;
      theta += 0.60 * s / (0.35 + rn);
    }

    /* 噪声扭曲：旋臂被扭出自然的不规则感 */
    theta += (fbm2(rn * 2.4, arm * 3.7 + 0.5, 17, 3) - 0.5) * 0.42 * (0.35 + rn);

    /* 盘面翘曲 */
    const warp = 0.075 * GALAXY_R * Math.sin(theta - rn * 2.6) * smoothstep(0.45, 1, rn);

    open[i * 3]     = Math.cos(theta) * rj;
    open[i * 3 + 1] = Math.sin(theta) * rj;
    open[i * 3 + 2] = gauss() * (tight ? 0.036 : 0.066) * GALAXY_R * Math.exp(-rn * 1.1)
                    + gauss() * 0.016 * GALAXY_R + warp;

    corePos(pos, i * 3);

    /* 恒星团增亮 */
    let boost = 1;
    for (let c = 0; c < CLUSTERS.length; c++) {
      const cl = CLUSTERS[c];
      const dA = angDiff(theta, cl.theta) / 0.13;
      const dR = (rn - cl.rn) / 0.15;
      const d2 = dA * dA + dR * dR;
      if (d2 < 1) { const b = 1 + 3.0 * (1 - d2) * (1 - d2); if (b > boost) boost = b; }
    }

    /* HII 星云区（沿旋臂的粉红斑块，20–30 处、大小不一） */
    let hii = 0;
    for (let h = 0; h < HII_REGIONS.length; h++) {
      const hr = HII_REGIONS[h];
      const dA = angDiff(theta, hr.theta) / hr.r;
      const dR = (rn - hr.rn) / (hr.r * 1.7);
      const d2 = dA * dA + dR * dR;
      if (d2 < 1) { const v = 1 - d2; if (v > hii) hii = v; }
    }

    const roll = Math.random();
    const pHot = tight ? 0.13 : 0.030;                       // 蓝白年轻亮星（数量翻倍）
    const pRed = pHot + (tight ? 0.055 : 0.022);             // 橙红老年红巨星
    if (roll < pHot) {
      rgb[0] = 0.70; rgb[1] = 0.88; rgb[2] = 1.00;
    } else if (roll < pRed) {
      rgb[0] = 1.00; rgb[1] = 0.45; rgb[2] = 0.22;
    } else {
      rampColor(0.10 + 0.90 * rn, rgb);
      /* 按恒星色温着色（蓝白/白/黄/橙红），与旋臂底色混合 */
      const tmp = [0, 0, 0];
      pickTemp(tmp);
      rgb[0] = rgb[0] * 0.42 + tmp[0] * 0.58;
      rgb[1] = rgb[1] * 0.42 + tmp[1] * 0.58;
      rgb[2] = rgb[2] * 0.42 + tmp[2] * 0.58;
      /* 沿旋臂的噪声断裂（断续感） */
      const brk = smoothstep(0.30, 0.56, fbm2(theta * 1.7, rn * 4.2, 31, 3)) * 0.80 + 0.20;
      const j = ((tight ? 1.14 : 0.84) + Math.random() * 0.20) * Math.min(boost, 1.7) * brk * jit.br;
      rgb[0] *= j; rgb[1] *= j; rgb[2] *= j;
    }
    /* 落入 HII 区 → 染成粉红并增亮 */
    if (hii > 0) {
      const k = hii * 0.85;
      rgb[0] += (1.05 - rgb[0]) * k;
      rgb[1] += (0.34 - rgb[1]) * k;
      rgb[2] += (0.66 - rgb[2]) * k;
    }
    saturate(rgb, 1.18);
    col[i * 3] = rgb[0]; col[i * 3 + 1] = rgb[1]; col[i * 3 + 2] = rgb[2];

    rnd[i] = Math.random();
    siz[i] = sOf() * (roll < pHot ? 1.6 : roll < pRed ? 1.3 : Math.min(boost, 1.7)) * (1 + hii * 0.9);
    dly[i] = clamp(rn * 0.72 + Math.random() * 0.28);
    disk[i] = 1.0;
  }

  /* ---------- 外围银晕 ---------- */
  for (let k = 0; k < nHalo; k++, i++) {
    const rr = GALAXY_R * (0.30 + 1.05 * Math.pow(Math.random(), 0.6));
    const ct = Math.random() * 2 - 1;
    const st = Math.sqrt(Math.max(0, 1 - ct * ct));
    const ph = Math.random() * TAU;

    open[i * 3]     = rr * st * Math.cos(ph);
    open[i * 3 + 1] = rr * st * Math.sin(ph);
    open[i * 3 + 2] = rr * ct * 0.85;

    corePos(pos, i * 3);
    rampColor(0.08 + 0.26 * Math.random(), rgb);
    saturate(rgb, 1.12);
    const dim = 0.24 + Math.random() * 0.30;
    col[i * 3] = rgb[0] * dim; col[i * 3 + 1] = rgb[1] * dim; col[i * 3 + 2] = rgb[2] * dim;

    rnd[i] = Math.random();
    siz[i] = sOf() * (0.6 + 0.5 * Math.random());
    dly[i] = 0.62 + Math.random() * 0.38;
    disk[i] = 0.15;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aOpen',    new THREE.BufferAttribute(open, 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aRand',    new THREE.BufferAttribute(rnd, 1));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(siz, 1));
  geo.setAttribute('aDelay',   new THREE.BufferAttribute(dly, 1));
  geo.setAttribute('aDisk',    new THREE.BufferAttribute(disk, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), GALAXY_R * 3);
  return geo;
}

/* ---- 外围扇形扩散层：从旋臂末端沿切线方向呈扇面抛射 ----
   致密层（星点连续）→ 稀疏层（星点零落）→ 尘雾层（淡淡辉光）
   色彩由紫蓝渐变到深青，最外缘融入背景；每层有独立噪声扭曲 */
const FAN_CFG = { radius: 1.55, angle: 40, layers: 3 };

function buildFanGeometry(count, cfg) {
  const N = Math.max(1, count | 0);
  const pos  = new Float32Array(N * 3);
  const open = new Float32Array(N * 3);
  const col  = new Float32Array(N * 3);
  const rnd  = new Float32Array(N);
  const siz  = new Float32Array(N);
  const dly  = new Float32Array(N);
  const disk = new Float32Array(N);
  const fanS = new Float32Array(N);

  const fanLen = GALAXY_R * Math.max(0.4, cfg.radius);
  const fanAng = (Math.max(5, Math.min(90, cfg.angle)) * Math.PI) / 180;
  const nL = Math.max(1, Math.min(3, cfg.layers | 0));
  const per = Math.ceil(N / nL);
  const rgb = [0, 0, 0];
  let i = 0;

  for (let L = 0; L < nL; L++) {
    const lo = L / nL, hi = (L + 1) / nL;
    const cnt = (L === nL - 1) ? (N - i) : per;
    for (let k = 0; k < cnt && i < N; k++, i++) {
      const arm = (Math.random() * NARMS) | 0;
      const rE  = GALAXY_R * (0.90 + 0.06 * Math.random());
      const thE = armAngle(arm, 0.90) + (Math.random() - 0.5) * 0.20;
      const sgn = (arm % 2 === 0) ? 1 : -1;                 // 交替方向 → 不对称
      const s   = lo + (hi - lo) * Math.pow(Math.random(), 1.35);
      const spreadA = (Math.random() * 2 - 1) * fanAng * (0.22 + 0.78 * s);
      const dir = thE + Math.PI * 0.5 * sgn + spreadA;
      const dist = s * fanLen * (0.9 + 0.25 * Math.random());

      /* 每层独立噪声扭曲，避免规整 */
      const nz = fbm2(Math.cos(dir) * 1.6 + L * 3.1, Math.sin(dir) * 1.6, 41 + L * 7, 3) - 0.5;
      const dirW = dir + nz * 0.55;

      open[i * 3]     = Math.cos(thE) * rE + Math.cos(dirW) * dist;
      open[i * 3 + 1] = Math.sin(thE) * rE + Math.sin(dirW) * dist;
      open[i * 3 + 2] = gauss() * 0.10 * GALAXY_R * (1 + s * 1.6);

      corePos(pos, i * 3);

      /* 紫蓝 → 深青 */
      rgb[0] = 0.62 - 0.32 * s;
      rgb[1] = 0.52 + 0.33 * s;
      rgb[2] = 1.00 - 0.15 * s;
      const dens = (L === 0) ? 0.90 : (L === 1 ? 0.52 : 0.26);   // 致密 → 稀疏 → 尘雾
      const d = dens * (1 - 0.45 * s) * (0.65 + 0.6 * Math.random());
      col[i * 3] = rgb[0] * d; col[i * 3 + 1] = rgb[1] * d; col[i * 3 + 2] = rgb[2] * d;

      rnd[i] = Math.random();
      siz[i] = (L === 2 ? 3.2 : 1.1) + Math.random() * (L === 2 ? 4.6 : 2.2);
      dly[i] = 0.25 + 0.55 * Math.random();
      disk[i] = 0.40;
      fanS[i] = 0.12 + 0.88 * s;
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aOpen',    new THREE.BufferAttribute(open, 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aRand',    new THREE.BufferAttribute(rnd, 1));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(siz, 1));
  geo.setAttribute('aDelay',   new THREE.BufferAttribute(dly, 1));
  geo.setAttribute('aDisk',    new THREE.BufferAttribute(disk, 1));
  geo.setAttribute('aFanS',    new THREE.BufferAttribute(fanS, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), GALAXY_R * 6);
  return geo;
}

/* 尘埃带：沿旋臂内缘分布，用 normal 混合压暗 → 明暗交错的真实纹理 */
function buildDustGeometry(count) {
  const N = Math.max(1, count | 0);
  const pos  = new Float32Array(N * 3);
  const open = new Float32Array(N * 3);
  const col  = new Float32Array(N * 3);
  const rnd  = new Float32Array(N);
  const siz  = new Float32Array(N);
  const dly  = new Float32Array(N);
  const disk = new Float32Array(N);

  for (let i = 0; i < N; i++) {
    const rn = Math.pow(Math.random(), 0.5);
    const arm = (Math.random() * NARMS) | 0;
    /* 一半沿旋臂内缘，一半横切盘面 → 形成裂隙与切割纹理 */
    const cross = Math.random() < 0.18;
    const th  = cross
      ? Math.random() * TAU
      : armAngle(arm, rn) + 0.32 + gauss() * (0.06 + 0.08 * rn);
    const rj  = (0.10 + 0.90 * rn) * GALAXY_R + gauss() * 0.07 * GALAXY_R;

    open[i * 3]     = Math.cos(th) * rj;
    open[i * 3 + 1] = Math.sin(th) * rj;
    open[i * 3 + 2] = gauss() * 0.028 * GALAXY_R * Math.exp(-rn * 1.2);

    corePos(pos, i * 3);

    /* FBM 强对比暗尘带：只有噪声高值区才形成浓密暗带 */
    const n1 = fbm2(th * 2.4, rn * 3.2, 11, 4);
    const n2 = fbm2(th * 0.9 + 5.0, rn * 1.4, 23, 3);
    const mask = n1 * 0.65 + n2 * 0.35;
    const dark = smoothstep(0.40, 0.72, mask);

    const a = (0.22 + 0.55 * dark);
    col[i * 3] = 0.030 * a; col[i * 3 + 1] = 0.020 * a; col[i * 3 + 2] = 0.018 * a;

    rnd[i] = Math.random();
    siz[i] = (4.5 + Math.random() * 5.0) * (0.75 + dark * 0.9);
    dly[i] = 0.05 + Math.random() * 0.5;
    disk[i] = 1.0;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aOpen',    new THREE.BufferAttribute(open, 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aRand',    new THREE.BufferAttribute(rnd, 1));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(siz, 1));
  geo.setAttribute('aDelay',   new THREE.BufferAttribute(dly, 1));
  geo.setAttribute('aDisk',    new THREE.BufferAttribute(disk, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), GALAXY_R * 3);
  return geo;
}

/* =========================================================
   2. GLSL
   ========================================================= */
const VERT = /* glsl */`
uniform float uTime, uBloom, uSize, uPixelRatio, uOpacity, uSpin, uDiff, uGalR, uArms, uBH;
uniform float uFocusStrength, uFocusRadius, uShockT, uShockStr, uGlowMul, uSizeMul;
uniform vec3  uFocus, uHand, uHandVel, uHand2, uHand2Vel, uShock;
uniform float uHandStr, uHandRadius, uHand2Str, uHand2Radius;
uniform mat3  uHue;

attribute vec3  aOpen;
attribute vec3  aColor;
attribute float aRand;
attribute float aSize;
attribute float aDelay;
attribute float aDisk;
attribute float aFanS;

varying vec3  vColor;
varying float vGlow;
varying float vSoft;   /* 景深：近处星点大而虚 */

/* 手的扰动（软化版）：径向喷散 + 拖拽 + 涡旋 + 涟漪，平方衰减 */
vec3 handDisturb(vec3 p, vec3 hPos, vec3 hVel, float hStr, float hRadius, float seed) {
  vec3  toH  = p - hPos;
  float dH   = length(toH);
  float h2   = 1.0 - smoothstep(0.0, hRadius, dH);
  float hInf = h2 * h2 * hStr;
  vec3  hn   = toH / max(dH, 1e-4);
  p += hn * hInf * (0.22 + 0.30 * seed);
  p.xy += hVel.xy * hInf * (0.16 + 0.20 * seed);
  vec2 ht = vec2(-hn.y, hn.x);
  p.xy += ht * hInf * 0.38 * (0.55 + 0.45 * sin(uTime * 1.7 + seed * 37.0));
  p.z  += sin(dH * 4.2 - uTime * 2.2) * hInf * 0.11;
  return p;
}

void main() {
  float local = clamp(uBloom * 1.75 - aDelay * 0.75, 0.0, 1.0);
  float e = local * local * (3.0 - 2.0 * local);

  vec3 core = position;
  vec3 gal  = aOpen;
  float rad = length(gal.xy);
  float rn  = rad / uGalR;

  /* 差速自转：内圈快、外圈慢 */
  float rate = (1.0 + uDiff * (1.0 - smoothstep(0.0, uGalR, rad))) * (1.0 + 2.6 * uBH);   /* 坍缩时角速度加快 */
  float angM = uTime * uSpin * rate + 0.30 * sin(uTime * 0.28 + rad * 0.85);
  float angR = uTime * uSpin;
  float ca = cos(angM), sa = sin(angM);
  vec3 g = vec3(gal.x * ca - gal.y * sa, gal.x * sa + gal.y * ca, gal.z);

  /* 密度波图案（刚性旋转 → 旋臂不会被差速自转缠绕） */
  float thM = atan(g.y, g.x);
  float thP = thM - (angM - angR);
  float armPhase = 2.6 * log(max(0.08, rn) / 0.20);
  float pd = (thP - armPhase) * uArms / 6.2831853;
  pd = fract(pd + 0.5) - 0.5;
  float wk = exp(-pd * pd * 13.0) * aDisk;

  /* 沿旋臂切向星流 */
  vec2 tangDir = vec2(-sin(thM), cos(thM));
  g.xy += tangDir * (wk - 0.42) * 0.075 * e;

  /* 径向迁移 + 呼吸 */
  float mig = sin(uTime * 0.09 + aRand * 6.2831) * 0.5 + sin(uTime * 0.05 + rad * 1.7) * 0.5;
  float breath = 1.0 + 0.028 * mig * e + 0.016 * sin(uTime * 0.55 + rad * 1.35 + aRand * 2.0);
  g.xy *= breath;

  float t = uTime;
  vec3 turb = vec3(
    sin(g.y * 1.55 + t * 0.75 + aRand * 11.0),
    cos(g.x * 1.70 + t * 0.90 + aRand * 8.0),
    sin((g.x - g.y) * 1.30 + t * 0.60 + aRand * 13.0)
  );
  g += turb * (0.026 + 0.052 * e) * (0.35 + 0.65 * aRand);

  /* 外围扇形扩散层：缓慢外漂 + 回流 + 噪声扭曲 */
  if (aFanS > 0.0) {
    float dr = sin(uTime * 0.10 + aRand * 6.2831) * 0.5 + 0.5;
    g.xy *= (0.90 + 0.22 * dr);
    float nz = sin(g.x * 0.9 + uTime * 0.35 + aRand * 11.0) + cos(g.y * 1.1 - uTime * 0.28 + aRand * 7.0);
    g.xy += vec2(-g.y, g.x) * nz * 0.010;
  }

  float cAng = uTime * 0.45;
  float cc = cos(cAng), cs = sin(cAng);
  vec3 c = vec3(core.x * cc - core.y * cs, core.x * cs + core.y * cc, core.z);

  float uBHe = clamp(uBH * (1.0 + 0.7 * (1.0 - rn)), 0.0, 1.0);   /* 内圈先落，外圈后随 */
  vec3 p = mix(c, g, e * (1.0 - uBHe));   /* 黑洞坍缩：向核心收拢 */

  /* 点击冲击波：推开后弹性回归 */
  float sd = length(p.xy - uShock.xy);
  float st = max(uTime - uShockT, 0.0);
  float shockRing = exp(-pow(sd - st * 6.0, 2.0) * 1.6) * exp(-st * 1.8) * uShockStr;
  p.xy += normalize(p.xy - uShock.xy + vec2(1e-4)) * shockRing * 0.9;
  p.z  += sin(sd * 4.0 - st * 8.0) * shockRing * 0.5;

  vec4 wp = modelMatrix * vec4(p, 1.0);

  vec3  toF  = wp.xyz - uFocus;
  float dF   = length(toF);
  float infl = (1.0 - smoothstep(0.0, uFocusRadius, dF)) * uFocusStrength;
  vec3  nrm  = toF / max(dF, 1e-4);
  wp.xyz += nrm * infl * (0.45 + 0.55 * aRand);
  vec3 tang = normalize(cross(vec3(0.0, 0.0, 1.0), nrm + vec3(1e-4)));
  wp.xyz += tang * infl * 0.35;

  wp.xyz = handDisturb(wp.xyz, uHand, uHandVel, uHandStr, uHandRadius, aRand);
  wp.xyz = handDisturb(wp.xyz, uHand2, uHand2Vel, uHand2Str, uHand2Radius, aRand * 0.7 + 0.15);
  float stir = (1.0 - smoothstep(0.0, uHandRadius, length(wp.xyz - uHand))) * uHandStr
             + (1.0 - smoothstep(0.0, uHand2Radius, length(wp.xyz - uHand2))) * uHand2Str;

  vec4 mv = viewMatrix * wp;
  gl_Position = projectionMatrix * mv;

  float sizeMul = (0.30 + 0.70 * e) * uSizeMul;
  gl_PointSize = uSize * aSize * sizeMul * uPixelRatio / max(-mv.z, 0.1);
  gl_PointSize = clamp(gl_PointSize, 0.6, 44.0);
  vSoft = clamp(gl_PointSize / 26.0, 0.0, 1.0);

  /* 闪烁：亮星更明显 */
  float twAmp = clamp(aSize * 0.055, 0.12, 0.55);
  float tw = (1.0 - twAmp) + twAmp * (0.5 + 0.5 * sin(uTime * (1.2 + aRand * 3.5) + aRand * 41.0));

  vColor = uHue * aColor;
  /* 幂律 + 底噪提升：多数星点仍暗，但整体曝光抬高、旋臂主体清晰 */
  float gb = (0.42 + 0.70 * e) + wk * 0.95 * e + infl * 0.8 + stir * 0.32 + shockRing * 1.6;
  gb = pow(max(gb, 0.0), 1.85) * 2.45 + 0.010;   /* 幂律：多数极暗，仅少数明亮 */
  gb *= 1.0 + uBH * 1.8 * (1.0 - smoothstep(0.0, 0.55, rn));   /* 坍缩加热 */
  gb *= 1.0 + 1.8 * exp(-pow((uBH - 0.78) * 5.0, 2.0));        /* 视界形成前的闪光 */
  vGlow = gb * tw * uGlowMul;
}
`;

/* 普通星点：径向渐变柔边 */
const FRAG_GLOW = /* glsl */`
uniform float uOpacity;
varying vec3  vColor;
varying float vGlow;
varying float vSoft;

void main() {
  vec2  uv = gl_PointCoord - vec2(0.5);
  float d  = length(uv) * 2.0;
  if (d > 1.0) discard;
  float a   = pow(1.0 - d, 1.55);
  float hot = exp(-d * 7.0) * 0.55;
  float halo = exp(-d * d * (2.4 - vSoft)) * (0.08 + vSoft * 0.34);   /* 近处虚化光晕 */
  gl_FragColor = vec4(vColor * vGlow * (1.0 + hot), (a * 0.40 + halo * 0.55) * uOpacity);
}
`;

/* 巨星：十字衍射光芒 + 多层辉光 */
const FRAG_GIANT = /* glsl */`
uniform float uOpacity;
varying vec3  vColor;
varying float vGlow;

void main() {
  vec2 uv = (gl_PointCoord - vec2(0.5)) * 2.0;
  float d = length(uv);
  float core = exp(-d * d * 6.0);
  float halo = exp(-d * d * 1.7) * 0.42;
  float ax = abs(uv.x), ay = abs(uv.y);
  float sx = exp(-ax * 30.0) * exp(-ay * 3.4);
  float sy = exp(-ay * 30.0) * exp(-ax * 3.4);
  vec2 r45 = vec2(uv.x + uv.y, uv.x - uv.y) * 0.7071;
  float s2 = (exp(-abs(r45.x) * 34.0) * exp(-abs(r45.y) * 6.5)
            + exp(-abs(r45.y) * 34.0) * exp(-abs(r45.x) * 6.5)) * 0.20;
  float lum = core + halo + (sx + sy) * 0.60 + s2;
  if (lum < 0.004) discard;
  gl_FragColor = vec4(vColor * vGlow * lum, min(lum, 1.0) * uOpacity);
}
`;

/* 尘埃：normal 混合，压暗后方星点 */
const FRAG_DUST = /* glsl */`
uniform float uOpacity;
varying vec3  vColor;
varying float vGlow;

void main() {
  vec2  uv = gl_PointCoord - vec2(0.5);
  float d  = length(uv) * 2.0;
  if (d > 1.0) discard;
  float a = pow(1.0 - d, 1.5) * clamp(vGlow * 0.22, 0.0, 1.0) * uOpacity;
  gl_FragColor = vec4(vColor, a);
}
`;

/* =========================================================
   3. 星云光斑纹理
   ========================================================= */
function makeGlowTexture(size, stops) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [off, col] of stops) g.addColorStop(off, col);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* FBM 值噪声贴图（彩色星云雾气用） */
function makeFbmTexture(size, seed, octaves) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;
  const hash = (x, y) => {
    let n = (x * 374761393 + y * 668265263 + seed * 1442695041) | 0;
    n = (n ^ (n >> 13)) * 1274126177 | 0;
    return ((n ^ (n >> 16)) >>> 0) / 4294967295;
  };
  const vnoise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi), cc = hash(xi, yi + 1), dd = hash(xi + 1, yi + 1);
    return (a * (1 - u) + b * u) * (1 - v) + (cc * (1 - u) + dd * u) * v;
  };
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      let amp = 0.5, freq = 5 / size, sum = 0, norm = 0;
      for (let o = 0; o < octaves; o++) {
        sum += amp * vnoise(x * freq, y * freq);
        norm += amp;
        amp *= 0.5; freq *= 2.13;
      }
      const v = sum / norm;
      const nx = (x / size - 0.5) * 2, ny = (y / size - 0.5) * 2;
      const r = Math.sqrt(nx * nx + ny * ny);
      const fall = Math.max(0, 1 - r);
      const alpha = Math.pow(v, 1.5) * Math.pow(fall, 1.35);
      const idx = (y * size + x) * 4;
      d[idx] = d[idx + 1] = d[idx + 2] = 255;
      d[idx + 3] = Math.min(255, alpha * 620);
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* 流星拖尾贴图（右端亮 → 左端透明） */
function makeStreakTexture(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, w, 0);
  g.addColorStop(0.0, 'rgba(255,255,255,0)');
  g.addColorStop(0.72, 'rgba(220,236,255,0.55)');
  g.addColorStop(1.0, 'rgba(255,255,255,1)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  const g2 = ctx.createLinearGradient(0, 0, 0, h);
  g2.addColorStop(0.0, 'rgba(0,0,0,1)');
  g2.addColorStop(0.5, 'rgba(0,0,0,0)');
  g2.addColorStop(1.0, 'rgba(0,0,0,1)');
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const GLOW_TEX = {

  magenta: makeGlowTexture(256, [[0, 'rgba(255,120,190,0.80)'], [0.35, 'rgba(210,60,150,0.28)'], [1, 'rgba(0,0,0,0)']]),
  cyan:    makeGlowTexture(256, [[0, 'rgba(120,200,255,0.75)'], [0.35, 'rgba(50,110,240,0.26)'], [1, 'rgba(0,0,0,0)']]),
  gold:    makeGlowTexture(256, [[0, 'rgba(255,215,150,0.85)'], [0.35, 'rgba(255,150,70,0.30)'], [1, 'rgba(0,0,0,0)']]),
  core:    makeGlowTexture(256, [[0, 'rgba(255,244,230,0.95)'], [0.25, 'rgba(255,190,140,0.55)'], [0.6, 'rgba(200,90,160,0.18)'], [1, 'rgba(0,0,0,0)']]),
  neb:     makeFbmTexture(256, 7, 5),
  neb2:    makeFbmTexture(256, 23, 6),
  streak:  makeStreakTexture(128, 32),
};

/* =========================================================
   4. Galaxy 类（3D 倾斜盘面）
   ========================================================= */
class Galaxy {
  constructor(count) {
    this.count = count;
    this.group = new THREE.Group();
    this.group.rotation.order = 'YXZ';

    /* ---- 共享 uniforms：所有层引用同一批对象 → 一次更新全层生效 ---- */
    const shared = {
      uTime: { value: 0 }, uBloom: { value: 0 }, uOpacity: { value: 0 },
      uSize: { value: 5.5 }, uPixelRatio: { value: DPR }, uSpin: { value: 0.26 },
      uDiff: { value: 0.30 }, uGalR: { value: GALAXY_R }, uArms: { value: NARMS },
      uFocus: { value: new THREE.Vector3() }, uFocusStrength: { value: 0 }, uFocusRadius: { value: 1.5 },
      uHand: { value: new THREE.Vector3() }, uHandVel: { value: new THREE.Vector3() },
      uHandStr: { value: 0 }, uHandRadius: { value: 1.8 },
      uHand2: { value: new THREE.Vector3() }, uHand2Vel: { value: new THREE.Vector3() },
      uHand2Str: { value: 0 }, uHand2Radius: { value: 1.6 },
      uShock: { value: new THREE.Vector3() }, uShockT: { value: -99 }, uShockStr: { value: 0 },
      uBH: { value: 0 },
      uHue: { value: new THREE.Matrix3() },
    };
    this.shared = shared;

    /* ---- 4 层粒子（各自独立材质 / 尺寸分布） ---- */
    this.layers = [];
    let allocated = 0;
    for (let li = 0; li < LAYERS.length; li++) {
      const cfg = LAYERS[li];
      const n = (li === LAYERS.length - 1) ? Math.max(1, count - allocated) : Math.round(count * cfg.frac);
      allocated += n;
      const geo = buildLayerGeometry(cfg, n);
      const mat = new THREE.ShaderMaterial({
        uniforms: Object.assign({}, shared, { uGlowMul: { value: cfg.glow }, uSizeMul: { value: 1.0 } }),
        vertexShader: VERT,
        fragmentShader: cfg.giant ? FRAG_GIANT : FRAG_GLOW,
        transparent: true, depthWrite: false, depthTest: false,
        blending: THREE.AdditiveBlending,
      });
      const pts = new THREE.Points(geo, mat);
      pts.frustumCulled = false;
      pts.renderOrder = li;
      this.group.add(pts);
      this.layers.push({ points: pts, material: mat, geometry: geo, cfg, count: n });
    }

    /* ---- 尘埃带（normal 混合，压暗旋臂内侧） ---- */
    const dCount = Math.max(1, Math.round(count * 0.030));   // 更少更柔的尘埃（减少黑点）
    this.dust = new THREE.Points(buildDustGeometry(dCount), new THREE.ShaderMaterial({
      uniforms: Object.assign({}, shared, { uGlowMul: { value: 1.0 }, uSizeMul: { value: 1.0 } }),
      vertexShader: VERT,
      fragmentShader: FRAG_DUST,
      transparent: true, depthWrite: false, depthTest: false,
      blending: THREE.NormalBlending,
    }));
    this.dust.frustumCulled = false;
    this.dust.renderOrder = 20;
    this.group.add(this.dust);

    /* ---- 外围扇形扩散层（少量大面片 / 稀疏星流） ---- */
    const fCount = Math.max(1, Math.round(count * 0.14));
    this.fan = new THREE.Points(buildFanGeometry(fCount, FAN_CFG), new THREE.ShaderMaterial({
      uniforms: Object.assign({}, shared, { uGlowMul: { value: 0.72 }, uSizeMul: { value: 1.0 } }),
      vertexShader: VERT,
      fragmentShader: FRAG_GLOW,
      transparent: true, depthWrite: false, depthTest: false,
      blending: THREE.AdditiveBlending,
    }));
    this.fan.frustumCulled = false;
    this.fan.renderOrder = 2;
    this.group.add(this.fan);

    /* ---- 黑洞形态（握拳触发）：事件视界 + 光子环 + 吸积盘 + 相对论喷流 ---- */
    const bhDiskN = Math.max(3000, Math.round(count * 0.045));
    const bhJetN  = Math.max(1400, Math.round(count * 0.018));

    const dGeo = new THREE.BufferGeometry();
    {
      const dPos  = new Float32Array(bhDiskN * 3);
      const dR    = new Float32Array(bhDiskN);
      const dAng  = new Float32Array(bhDiskN);
      const dTh   = new Float32Array(bhDiskN);
      const dSeed = new Float32Array(bhDiskN);
      for (let i = 0; i < bhDiskN; i++) {
        const rn = Math.pow(Math.random(), 1.6);          /* 内圈更密 */
        const r  = 0.85 + 2.35 * rn;
        const ang = Math.random() * TAU;
        dR[i] = rn; dAng[i] = ang;
        dTh[i] = gauss() * (0.065 + 0.11 * rn);
        dSeed[i] = Math.random();
        dPos[i * 3] = Math.cos(ang) * r; dPos[i * 3 + 1] = Math.sin(ang) * r; dPos[i * 3 + 2] = 0;
      }
      dGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
      dGeo.setAttribute('aR',    new THREE.BufferAttribute(dR, 1));
      dGeo.setAttribute('aAng',  new THREE.BufferAttribute(dAng, 1));
      dGeo.setAttribute('aTh',   new THREE.BufferAttribute(dTh, 1));
      dGeo.setAttribute('aSeed', new THREE.BufferAttribute(dSeed, 1));
      dGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 9);
    }
    const BH_DISK_V = /* glsl */`
      attribute float aR, aAng, aTh, aSeed;
      uniform float uTime, uSize, uPixelRatio, uHalf, uSpinZ;
      varying vec3 vColor;
      varying float vA;
      void main() {
        float r = 0.85 + 2.35 * aR;
        float w = 1.35 / pow(r, 1.35);               /* 开普勒差速：内快外慢 */
        float ang = aAng + uTime * w;
        vec3 p = vec3(cos(ang) * r, sin(ang) * r, aTh);
        float dop = pow(0.5 + 0.5 * cos(ang), 2.7);  /* 多普勒增亮：迎向观察者一侧 */
        float heat = 1.0 - aR;
        vec3 hot = vec3(1.00, 0.94, 0.86);
        vec3 cool = vec3(1.00, 0.46, 0.18);
        vColor = mix(cool, hot, heat * heat) * (0.50 + 1.85 * dop) + vec3(0.0, 0.10, 0.32) * dop * heat;
        vA = (0.38 + 0.72 * dop) * (1.0 - 0.40 * aR);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(uSize * (0.75 + 0.5 * aSeed) * (1.25 - 0.65 * aR) * uPixelRatio / max(-mv.z, 0.1), 0.6, 22.0);
        /* 自旋后的纵深分量 → 近/远半分割（远半被视界遮挡，近半从阴影前方穿过） */
        float yn = p.x * sin(uSpinZ) + p.y * cos(uSpinZ);
        if (yn * uHalf < 0.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; }
      }`;
    const BH_FRAG = /* glsl */`
      varying vec3 vColor;
      varying float vA;
      uniform float uOpacity;
      void main() {
        vec2 uv = gl_PointCoord - vec2(0.5);
        float d = length(uv) * 2.0;
        if (d > 1.0) discard;
        float a = pow(1.0 - d, 1.7);
        gl_FragColor = vec4(vColor, a * vA * uOpacity);
      }`;

    const jGeo = new THREE.BufferGeometry();
    {
      const jPos  = new Float32Array(bhJetN * 3);
      const jSide = new Float32Array(bhJetN);
      const jOffR = new Float32Array(bhJetN);
      const jOffA = new Float32Array(bhJetN);
      const jPh   = new Float32Array(bhJetN);
      for (let i = 0; i < bhJetN; i++) {
        jSide[i] = Math.random() < 0.5 ? 1 : -1;
        jOffR[i] = Math.pow(Math.random(), 0.7);
        jOffA[i] = Math.random() * TAU;
        jPh[i] = Math.random();
      }
      jGeo.setAttribute('position', new THREE.BufferAttribute(jPos, 3));
      jGeo.setAttribute('aSide', new THREE.BufferAttribute(jSide, 1));
      jGeo.setAttribute('aOffR', new THREE.BufferAttribute(jOffR, 1));
      jGeo.setAttribute('aOffA', new THREE.BufferAttribute(jOffA, 1));
      jGeo.setAttribute('aPh',   new THREE.BufferAttribute(jPh, 1));
      jGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 9);
    }
    const BH_JET_V = /* glsl */`
      attribute float aSide, aOffR, aOffA, aPh;
      uniform float uTime, uSize, uPixelRatio;
      varying vec3 vColor;
      varying float vA;
      void main() {
        float pr = fract(aPh + uTime * 0.075);       /* 外流进度 */
        float z  = aSide * pr * 4.6;
        float rr = (0.055 + 0.55 * pr * pr) * aOffR;
        vec3 p = vec3(cos(aOffA) * rr, sin(aOffA) * rr, z);
        vA = smoothstep(0.0, 0.12, pr) * (1.0 - pr) * (0.35 + 0.65 * (1.0 - aOffR));
        vColor = mix(vec3(0.55, 0.75, 1.0), vec3(0.90, 0.96, 1.0), 1.0 - aOffR);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(uSize * (0.8 + 0.6 * aOffR) * uPixelRatio / max(-mv.z, 0.1), 0.6, 14.0);
      }`;

    const BH_QUAD_V = /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`;
    const BH_SHADOW_F = /* glsl */`
      varying vec2 vUv;
      uniform float uOpacity;
      void main() {
        vec2 uv = (vUv - 0.5) * 2.0;
        float d = length(uv);
        float a = 1.0 - smoothstep(0.86, 0.98, d);
        gl_FragColor = vec4(0.0, 0.0, 0.0, a * uOpacity);
      }`;
    /* 环绕光带（透镜化吸积盘二次像）：XZ 平面立体粒子环，随视角产生真实视差 */
    const bhBandN = Math.max(5000, Math.round(count * 0.055));
    const bGeo = new THREE.BufferGeometry();
    {
      const bPos  = new Float32Array(bhBandN * 3);
      const bT    = new Float32Array(bhBandN);
      const bR    = new Float32Array(bhBandN);
      const bY    = new Float32Array(bhBandN);
      const bSeed = new Float32Array(bhBandN);
      for (let i = 0; i < bhBandN; i++) {
        const t  = Math.random() * TAU;
        const rr = 0.88 + 0.50 * Math.pow(Math.random(), 1.55);   /* 内缘更密 → 亮环 */
        bT[i] = t; bR[i] = rr;
        bY[i] = gauss() * 0.055;
        bSeed[i] = Math.random();
        bPos[i * 3] = Math.cos(t) * rr; bPos[i * 3 + 1] = 0; bPos[i * 3 + 2] = Math.sin(t) * rr;
      }
      bGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
      bGeo.setAttribute('aT',    new THREE.BufferAttribute(bT, 1));
      bGeo.setAttribute('aR',    new THREE.BufferAttribute(bR, 1));
      bGeo.setAttribute('aY',    new THREE.BufferAttribute(bY, 1));
      bGeo.setAttribute('aSeed', new THREE.BufferAttribute(bSeed, 1));
      bGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 9);
    }
    const BH_BAND_V = /* glsl */`
      attribute float aT, aR, aY, aSeed;
      uniform float uTime, uSize, uPixelRatio;
      varying vec3 vColor;
      varying float vA;
      void main() {
        float ang = aT + uTime * (0.22 + 0.20 * aSeed);          /* 缓慢环绕流动 */
        vec3 p = vec3(cos(ang) * aR, aY, sin(ang) * aR);
        float inner = 1.0 - smoothstep(0.86, 1.30, aR);
        float flick = 0.80 + 0.20 * sin(uTime * (1.3 + aSeed * 2.2) + aSeed * 41.0);
        vColor = mix(vec3(1.00, 0.88, 0.66), vec3(1.00, 0.98, 0.94), inner) * (0.45 + 0.85 * inner);
        vA = flick * (0.28 + 0.68 * inner);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(uSize * (0.65 + 0.7 * aSeed) * uPixelRatio / max(-mv.z, 0.1), 0.6, 18.0);
      }`;

    this.bhFx = {};
    {
      const fx = this.bhFx;
      /* 远半：画在视界阴影之前（被遮挡）；近半：画在阴影之后（穿过前方） */
      fx.diskFarMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uSize: { value: 6.6 }, uPixelRatio: { value: DPR }, uOpacity: { value: 0 }, uHalf: { value: -1 }, uSpinZ: { value: 0 } },
        vertexShader: BH_DISK_V, fragmentShader: BH_FRAG,
        transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
      });
      fx.diskFar = new THREE.Points(dGeo, fx.diskFarMat);
      fx.diskFar.frustumCulled = false; fx.diskFar.renderOrder = 23; fx.diskFar.visible = false;
      this.group.add(fx.diskFar);

      fx.diskNearMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uSize: { value: 6.6 }, uPixelRatio: { value: DPR }, uOpacity: { value: 0 }, uHalf: { value: 1 }, uSpinZ: { value: 0 } },
        vertexShader: BH_DISK_V, fragmentShader: BH_FRAG,
        transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
      });
      fx.diskNear = new THREE.Points(dGeo, fx.diskNearMat);
      fx.diskNear.frustumCulled = false; fx.diskNear.renderOrder = 30; fx.diskNear.visible = false;
      this.group.add(fx.diskNear);

      fx.jetMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uSize: { value: 4.2 }, uPixelRatio: { value: DPR }, uOpacity: { value: 0 } },
        vertexShader: BH_JET_V, fragmentShader: BH_FRAG,
        transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
      });
      fx.jet = new THREE.Points(jGeo, fx.jetMat);
      fx.jet.frustumCulled = false; fx.jet.renderOrder = 26; fx.jet.visible = false;
      this.group.add(fx.jet);

      fx.shadowMat = new THREE.ShaderMaterial({
        uniforms: { uOpacity: { value: 0 } },
        vertexShader: BH_QUAD_V, fragmentShader: BH_SHADOW_F,
        transparent: true, depthWrite: false, depthTest: false, blending: THREE.NormalBlending,
      });
      fx.shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), fx.shadowMat);
      fx.shadow.frustumCulled = false; fx.shadow.renderOrder = 28; fx.shadow.visible = false;
      this.group.add(fx.shadow);

      fx.bandMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uSize: { value: 4.2 }, uPixelRatio: { value: DPR }, uOpacity: { value: 0 } },
        vertexShader: BH_BAND_V, fragmentShader: BH_FRAG,
        transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
      });
      fx.band = new THREE.Points(bGeo, fx.bandMat);
      fx.band.frustumCulled = false; fx.band.renderOrder = 31; fx.band.visible = false;
      this.group.add(fx.band);
    }

    /* ---- 星云雾气（FBM 噪声贴图，沿旋臂铺开，additive） ---- */
    this.sprites = [];
    const NEB = [
      { tex: 'neb',  color: 0xff5aa8, n: 9, op: 0.18, smin: 1.05, smax: 2.6 },
      { tex: 'neb',  color: 0x9a5cff, n: 8, op: 0.17, smin: 1.15, smax: 2.8 },
      { tex: 'neb2', color: 0x4fa8ff, n: 7, op: 0.15, smin: 1.15, smax: 2.6 },
      { tex: 'neb',  color: 0xffc47a, n: 5, op: 0.16, smin: 0.85, smax: 1.9 },
    ];
    for (const spec of NEB) {
      for (let s = 0; s < spec.n; s++) {
        const mat = new THREE.SpriteMaterial({
          map: GLOW_TEX[spec.tex], color: spec.color,
          transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
          depthWrite: false, depthTest: false,
        });
        const sp = new THREE.Sprite(mat);
        const arm = (Math.random() * NARMS) | 0;
        const rn = 0.15 + 0.85 * Math.pow(Math.random(), 0.85);
        const th = armAngle(arm, rn) + gauss() * 0.22;
        sp.position.set(Math.cos(th) * rn * GALAXY_R, Math.sin(th) * rn * GALAXY_R, gauss() * 0.22);
        const sc = spec.smin + (spec.smax - spec.smin) * Math.random();
        sp.scale.set(sc, sc, 1);
        sp.renderOrder = 5;
        sp.userData = {
          base: sc,
          op: spec.op * (0.6 + Math.random() * 0.7),
          rot: (Math.random() - 0.5) * 0.8,
          phase: Math.random() * TAU,
        };
        this.group.add(sp);
        this.sprites.push(sp);
      }
    }

    /* ---- 雾状辉光底色：大面积柔和渐变 + FBM 噪声 → 连续的乳白-暖金-蓝紫光带 ----
       星点之间不再出现大片黑洞；即使自适应降低粒子量，光带亮度依然保留 */
    const FOG = [
      { color: 0xfff0d8, n: 8, op: 0.115, smin: 2.6, smax: 5.6 },   // 乳白
      { color: 0xffd9a0, n: 5, op: 0.105, smin: 2.2, smax: 4.8 },   // 暖金
      { color: 0xb98cff, n: 5, op: 0.100, smin: 2.6, smax: 5.8 },   // 蓝紫
      { color: 0x7fb4ff, n: 3, op: 0.090, smin: 2.8, smax: 6.2 },   // 蓝
    ];
    for (const spec of FOG) {
      for (let s = 0; s < spec.n; s++) {
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({
          map: GLOW_TEX.neb, color: spec.color,
          transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
          depthWrite: false, depthTest: false,
        }));
        const arm = (Math.random() * NARMS) | 0;
        const rn = 0.12 + 0.88 * Math.pow(Math.random(), 0.85);
        const th = armAngle(arm, rn) + gauss() * 0.30;
        sp.position.set(Math.cos(th) * rn * GALAXY_R, Math.sin(th) * rn * GALAXY_R, gauss() * 0.30);
        const sc = spec.smin + (spec.smax - spec.smin) * Math.random();
        sp.scale.set(sc, sc, 1);
        sp.renderOrder = 4;
        sp.userData = { base: sc, op: spec.op * (0.65 + Math.random() * 0.7), rot: (Math.random() - 0.5) * 0.9, phase: Math.random() * TAU };
        this.group.add(sp);
        this.sprites.push(sp);
      }
    }

    /* ---- 外围星晕 / 稀疏漫射光：让银河边缘自然融入背景，无生硬边界 ---- */
    const OUTER = [
      { color: 0xcfd8ff, n: 3, op: 0.055, smin: 8.0, smax: 12.5 },
      { color: 0xffc9a0, n: 2, op: 0.050, smin: 7.0, smax: 10.5 },
    ];
    for (const spec of OUTER) {
      for (let s = 0; s < spec.n; s++) {
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({
          map: GLOW_TEX.neb, color: spec.color,
          transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
          depthWrite: false, depthTest: false,
        }));
        const th = Math.random() * TAU;
        const rr = GALAXY_R * (0.85 + 0.9 * Math.random());
        sp.position.set(Math.cos(th) * rr, Math.sin(th) * rr, gauss() * 0.5);
        const sc = spec.smin + (spec.smax - spec.smin) * Math.random();
        sp.scale.set(sc, sc, 1);
        sp.renderOrder = 3;
        sp.userData = { base: sc, op: spec.op * (0.7 + Math.random() * 0.6), rot: (Math.random() - 0.5) * 0.9, phase: Math.random() * TAU };
        this.group.add(sp);
        this.sprites.push(sp);
      }
    }

    /* ---- 银核：白金核心 + 橙色内晕 + 紫蓝外晕（多层辉光叠加） ---- */
    this.coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: GLOW_TEX.core, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
    }));
    this.coreGlow.scale.set(2.6, 2.6, 1);
    this.coreGlow.renderOrder = 16;
    this.group.add(this.coreGlow);

    this.coreGlow2 = new THREE.Sprite(new THREE.SpriteMaterial({
      map: GLOW_TEX.gold, color: 0xff9a50, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
    }));
    this.coreGlow2.scale.set(5.4, 5.4, 1);
    this.coreGlow2.renderOrder = 15;
    this.group.add(this.coreGlow2);

    this.coreHalo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: GLOW_TEX.neb, color: 0x8a6cff, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
    }));
    this.coreHalo.scale.set(9.5, 9.5, 1);
    this.coreHalo.renderOrder = 14;
    this.group.add(this.coreHalo);
  }

  dispose() {
    for (const L of this.layers) { L.geometry.dispose(); L.material.dispose(); }
    this.dust.geometry.dispose();
    this.dust.material.dispose();
    this.fan.geometry.dispose();
    this.fan.material.dispose();
    if (this.bhFx) {
      this.bhFx.diskFar.geometry.dispose();
      this.bhFx.diskFarMat.dispose(); this.bhFx.diskNearMat.dispose();
      this.bhFx.band.geometry.dispose();   this.bhFx.bandMat.dispose();
      this.bhFx.jet.geometry.dispose();    this.bhFx.jet.material.dispose();
      this.bhFx.shadow.geometry.dispose(); this.bhFx.shadow.material.dispose();
    }
    for (const sp of this.sprites) sp.material.dispose();
    this.coreGlow.material.dispose();
    this.coreGlow2.material.dispose();
    this.coreHalo.material.dispose();
  }
}

/* =========================================================
   5. 渲染器 / 场景
   ========================================================= */
const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: false,
  alpha: false,
  powerPreference: 'high-performance',
  stencil: false,
});
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(0x000000, 1);   // 黑底 + CSS screen 混合 → 视频透出

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 13.5);   // 开场：从远处缓缓推入
camera.lookAt(0, 0, 0);

/* ---- 背景星空 / 深空（远景星 + 星芒亮星 + 星云 + 河外星系 + 流星） ---- */
const bgGroup = new THREE.Group();
scene.add(bgGroup);
const bgClouds = [];
const bgGalaxies = [];
let bgStarsMat = null, bgBrightMat = null;

(function createBackground() {
  /* ① 3000+ 背景远景星（大小 / 亮度 / 色温各异，缓慢漂移 + 闪烁） */
  const N = MOBILE ? 5200 : 6600;   // 5000+ 背景星
  const BOX = 70;
  const p = new Float32Array(N * 3);
  const f = new Float32Array(N * 3);
  const s = new Float32Array(N);
  const c = new Float32Array(N * 3);
  const seed = new Float32Array(N);
  const rgb = [0, 0, 0];

  const LAYERS = [
    { z: -46, n: 0.45, size: 0.8, dim: 0.42, speed: 0.25 },
    { z: -28, n: 0.33, size: 1.2, dim: 0.62, speed: 0.6 },
    { z: -15, n: 0.22, size: 1.8, dim: 0.88, speed: 1.2 },
  ];

  let idx = 0, budget = N;
  for (let li = 0; li < LAYERS.length; li++) {
    const L = LAYERS[li];
    const cnt = li === LAYERS.length - 1 ? budget : Math.round(N * L.n);
    budget -= cnt;
    for (let k = 0; k < cnt; k++, idx++) {
      const th = Math.random() * TAU;
      p[idx * 3]     = Math.random() * BOX;
      p[idx * 3 + 1] = Math.random() * BOX;
      p[idx * 3 + 2] = L.z;
      f[idx * 3]     = Math.cos(th);
      f[idx * 3 + 1] = Math.sin(th);
      f[idx * 3 + 2] = L.speed * (0.5 + Math.random());
      s[idx] = L.size * (0.5 + Math.random());

      const t = Math.random();
      if (t < 0.30)      { rgb[0] = 0.62; rgb[1] = 0.72; rgb[2] = 1.00; }
      else if (t < 0.60) { rgb[0] = 0.86; rgb[1] = 0.90; rgb[2] = 1.00; }
      else if (t < 0.82) { rgb[0] = 1.00; rgb[1] = 0.95; rgb[2] = 0.88; }
      else               { rgb[0] = 1.00; rgb[1] = 0.72; rgb[2] = 0.45; }

      const d = L.dim * (0.35 + Math.random() * 0.65);
      c[idx * 3]     = rgb[0] * d;
      c[idx * 3 + 1] = rgb[1] * d;
      c[idx * 3 + 2] = rgb[2] * d;
      seed[idx] = Math.random() * 100;
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('aFlow',    new THREE.BufferAttribute(f, 3));
  g.setAttribute('aSize',    new THREE.BufferAttribute(s, 1));
  g.setAttribute('aColor',   new THREE.BufferAttribute(c, 3));
  g.setAttribute('aSeed',    new THREE.BufferAttribute(seed, 1));
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, -30), 120);

  bgStarsMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPR: { value: DPR }, uBox: { value: BOX } },
    vertexShader: `
      uniform float uTime; uniform float uPR; uniform float uBox;
      attribute vec3  aFlow;
      attribute float aSize;
      attribute vec3  aColor;
      attribute float aSeed;
      varying vec3  vC;
      varying float vA;
      void main(){
        vec3 p = position;
        vec2 dir = normalize(aFlow.xy);
        float wob = sin(uTime * 0.25 + aSeed) * 0.8;
        p.xy = mod(p.xy + dir * (aFlow.z * uTime) + vec2(wob), uBox) - uBox * 0.5;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * 1.5 * uPR * (20.0 / max(-mv.z, 1.0));
        gl_PointSize = clamp(gl_PointSize, 0.6, 8.0);
        vC = aColor;
        vA = 0.30 + 0.55 * (0.5 + 0.5 * sin(uTime * 0.7 + aSeed * 7.0));
      }`,
    fragmentShader: `
      varying vec3 vC;
      varying float vA;
      void main(){
        vec2 uv = gl_PointCoord - vec2(0.5);
        float d = length(uv) * 2.0;
        if (d > 1.0) discard;
        float core = pow(1.0 - d, 2.2);
        float halo = exp(-d * d * 2.4) * 0.30;   /* 部分星带柔和光晕 */
        float lum = core + halo;
        gl_FragColor = vec4(vC * vA * lum, lum * 0.62);
      }`,
    transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
  });
  const pts = new THREE.Points(g, bgStarsMat);
  pts.frustumCulled = false;
  pts.renderOrder = -20;
  bgGroup.add(pts);

  /* ② 明亮大星（四角星芒） */
  const BN = MOBILE ? 34 : 54;
  const bp = new Float32Array(BN * 3);
  const bs = new Float32Array(BN);
  const bc = new Float32Array(BN * 3);
  const bseed = new Float32Array(BN);
  for (let i = 0; i < BN; i++) {
    const th = Math.random() * TAU;
    const rr = 16 + Math.random() * 26;
    bp[i * 3]     = Math.cos(th) * rr;
    bp[i * 3 + 1] = Math.sin(th) * rr * 0.7;
    bp[i * 3 + 2] = -16 - Math.random() * 22;
    bs[i] = 5 + Math.random() * 10;
    const t = Math.random();
    if (t < 0.35)      { bc[i * 3] = 0.72; bc[i * 3 + 1] = 0.82; bc[i * 3 + 2] = 1.00; }
    else if (t < 0.70) { bc[i * 3] = 0.95; bc[i * 3 + 1] = 0.96; bc[i * 3 + 2] = 1.00; }
    else               { bc[i * 3] = 1.00; bc[i * 3 + 1] = 0.80; bc[i * 3 + 2] = 0.55; }
    bseed[i] = Math.random() * 40;
  }
  const bg2 = new THREE.BufferGeometry();
  bg2.setAttribute('position', new THREE.BufferAttribute(bp, 3));
  bg2.setAttribute('aSize',    new THREE.BufferAttribute(bs, 1));
  bg2.setAttribute('aColor',   new THREE.BufferAttribute(bc, 3));
  bg2.setAttribute('aSeed',    new THREE.BufferAttribute(bseed, 1));
  bg2.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, -26), 80);

  bgBrightMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPR: { value: DPR } },
    vertexShader: `
      uniform float uTime; uniform float uPR;

        gl_FragColor = vec4(vC * vA * lum, min(lum, 1.0));
      }`,
    transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
  });
  const bpts = new THREE.Points(bg2, bgBrightMat);

function updateBackground(now, dt) {

  bgGroup.position.y = damp(bgGroup.position.y, dyn.parallax.y * 1.8, 3, dt);

  for (const sp of bgClouds) {
    sp.position.x += sp.userData.drift.x * dt;
    sp.position.y += sp.userData.drift.y * dt;
    const pulse = 1 + 0.09 * Math.sin(now * 0.4 + sp.userData.phase);
    sp.scale.setScalar(sp.userData.base * pulse);
  }
  for (const sp of bgGalaxies) sp.material.rotation = sp.userData.rot + now * 0.02;
}

const meteors = [];
function spawnMeteor() {
  const g = new THREE.Group();
  const head = new THREE.Sprite(new THREE.SpriteMaterial({
    map: GLOW_TEX.core, color: 0xffffff, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
  }));
  head.scale.set(1.6, 1.6, 1);
  head.renderOrder = -15;
  const tail = new THREE.Sprite(new THREE.SpriteMaterial({
    map: GLOW_TEX.streak, color: 0xbfe4ff, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
  }));
  tail.renderOrder = -15;
  g.add(tail); g.add(head);

  const dir = Math.random() < 0.5 ? 1 : -1;
  const ang = (0.10 + Math.random() * 0.35) * (Math.random() < 0.5 ? 1 : -1);
  g.position.set(-dir * 24, 9 + Math.random() * 12, -13 - Math.random() * 14);
  bgGroup.add(g);
  meteors.push({
    g, head, tail, dir, ang,
    spd: 9 + Math.random() * 11,
    life: 0, dur: 1.7 + Math.random() * 1.5,
  });
}
function updateMeteors(now, dt) {
  if (meteors.length < 2 && Math.random() < 0.0045) spawnMeteor();
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.life += dt;
    const t = m.life / m.dur;
    if (t >= 1) {
      bgGroup.remove(m.g);
      m.head.material.dispose();
      m.tail.material.dispose();
      meteors.splice(i, 1);
      continue;
    }
    const mvx = m.dir, mvy = -Math.sin(m.ang);
    m.g.position.x += mvx * m.spd * dt;
    m.g.position.y += mvy * m.spd * dt;
    const fade = Math.sin(Math.PI * Math.min(1, t * 1.12));
    m.head.material.opacity = fade * 0.95;
    const tl = 5 + m.spd * 0.5;
    m.tail.scale.set(tl, 0.55, 1);
    m.tail.material.rotation = Math.atan2(mvy, mvx);
    m.tail.material.opacity = fade * 0.65;
    m.tail.position.set(-mvx * tl * 0.42, -mvy * tl * 0.42, 0);
  }
}

const rtScene = new THREE.WebGLRenderTarget(1, 1, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, stencilBuffer: false });
const rtA = new THREE.WebGLRenderTarget(1, 1, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false });
const rtB = new THREE.WebGLRenderTarget(1, 1, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false });

const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const QUAD_VERT = `
varying vec2 vUv;
void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

const brightMat = new THREE.ShaderMaterial({
  uniforms: { tSrc: { value: null }, uThresh: { value: 0.42 }, uTexel: { value: new THREE.Vector2() } },
  vertexShader: QUAD_VERT,
  fragmentShader: `
    uniform sampler2D tSrc; uniform float uThresh; uniform vec2 uTexel;
    varying vec2 vUv;
    void main(){
      vec3 s = vec3(0.0);
      s += texture2D(tSrc, vUv + uTexel * vec2(-1.0, -1.0)).rgb;
      s += texture2D(tSrc, vUv + uTexel * vec2( 1.0, -1.0)).rgb;
      s += texture2D(tSrc, vUv + uTexel * vec2(-1.0,  1.0)).rgb;
      s += texture2D(tSrc, vUv + uTexel * vec2( 1.0,  1.0)).rgb;
      s *= 0.25;
      float l = dot(s, vec3(0.299, 0.587, 0.114));
      float k = max(l - uThresh, 0.0) / max(l, 1e-4);
      gl_FragColor = vec4(s * k, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});

const blurMat = new THREE.ShaderMaterial({
  uniforms: { tSrc: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uTexel: { value: new THREE.Vector2() } },
  vertexShader: QUAD_VERT,
  fragmentShader: `
    uniform sampler2D tSrc; uniform vec2 uDir; uniform vec2 uTexel;
    varying vec2 vUv;
    void main(){
      vec2 o = uDir * uTexel * 1.7;
      vec3 c = texture2D(tSrc, vUv).rgb * 0.227;
      c += (texture2D(tSrc, vUv + o * 1.3846).rgb + texture2D(tSrc, vUv - o * 1.3846).rgb) * 0.3162;
      c += (texture2D(tSrc, vUv + o * 3.2308).rgb + texture2D(tSrc, vUv - o * 3.2308).rgb) * 0.0702;
      gl_FragColor = vec4(c, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});

const compMat = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: null }, tB1: { value: null },
    uBloom: { value: 1.4 }, uTime: { value: 0 }, uGrain: { value: 0.022 },
    uCA: { value: 0.0016 }, uVig: { value: 0.85 }, uRes: { value: new THREE.Vector2(1, 1) },
    uLens: { value: new THREE.Vector3(0.5, 0.5, 0) }, uLensQ: { value: TIER_HI ? 1 : 0 },
  },
  vertexShader: QUAD_VERT,
  fragmentShader: `
    uniform sampler2D tScene, tB1;
    uniform float uBloom, uTime, uGrain, uCA, uVig;
    uniform vec2 uRes;
    uniform vec3 uLens;
    uniform float uLensQ;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    /* ACES 电影级色调映射 */
    vec3 aces(vec3 x){
      const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
      return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
    }
    void main(){
      vec2 uv = vUv;
      /* 引力透镜 + 空间扭曲（黑洞附近屏幕弯折） */
      if (uLens.z > 0.001) {
        vec2 lc = uLens.xy;
        vec2 du = uv - lc;
        float dr = length(du * vec2(uRes.x / max(uRes.y, 1.0), 1.0));
        float w = min(uLens.z * 0.115 / (dr + 0.13), 0.38);
        uv = lc + du * (1.0 - w);
        if (uLensQ > 0.5) {
          float sw = uLens.z * 0.16 * exp(-dr * 3.2);
          float ca = cos(sw), sa = sin(sw);
          uv = lc + mat2(ca, sa, -sa, ca) * (uv - lc);
        }
      }
      vec2 d = uv - 0.5;
      float r = texture2D(tScene, uv + d * uCA).r;
      vec4  g4 = texture2D(tScene, uv);
      float b = texture2D(tScene, uv - d * uCA).b;
      vec3 col = vec3(r, g4.g, b);
      col += texture2D(tB1, uv).rgb * uBloom * 1.35;
      col = aces(col * 1.18);                     /* ACES 色调映射 */
      float n = hash(uv * uRes + fract(uTime) * 137.0);
      col += (n - 0.5) * uGrain;
      float vig = 1.0 - uVig * dot(d, d) * 1.25;
      col *= clamp(vig, 0.0, 1.0);
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});

let bloomEnabled = true;
let bloomStrength = 1.4;

function blit(mat, target) {
  fsMesh.material = mat;
  renderer.setRenderTarget(target);

}

function resizePost(w, h) {
  w = Math.max(2, w | 0); h = Math.max(2, h | 0);
  rtScene.setSize(w, h);
  rtA.setSize(Math.max(1, w >> 1), Math.max(1, h >> 1));
  rtB.setSize(Math.max(1, w >> 1), Math.max(1, h >> 1));
  compMat.uniforms.uRes.value.set(w, h);
}

function renderFrame() {
  compMat.uniforms.uTime.value = state.time;
  if (!bloomEnabled || compMat.uniforms.uBloom.value <= 0.001) {
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
    return;
  }
  renderer.setRenderTarget(rtScene);
  renderer.render(scene, camera);

  const hw = rtA.width, hh = rtA.height;

  /* 亮部提取 + 降采样（半分辨率） */
  brightMat.uniforms.tSrc.value = rtScene.texture;
  brightMat.uniforms.uThresh.value = 0.46;   // 阈值调高 → 仅亮星发光
  brightMat.uniforms.uTexel.value.set(1 / rtScene.width, 1 / rtScene.height);
  blit(brightMat, rtA);

  /* 半分辨率双向模糊 */
  blurMat.uniforms.uTexel.value.set(1 / hw, 1 / hh);
  blurMat.uniforms.tSrc.value = rtA.texture;
  blurMat.uniforms.uDir.value.set(1, 0);
  blit(blurMat, rtB);
  blurMat.uniforms.tSrc.value = rtB.texture;
  blurMat.uniforms.uDir.value.set(0, 1);
  blit(blurMat, rtA);

  compMat.uniforms.tScene.value = rtScene.texture;
  compMat.uniforms.tB1.value = rtA.texture;
  blit(compMat, null);
}

/* =========================================================
   7. 坐标映射（与 CSS object-fit:cover 同一套数学）
   ========================================================= */
function videoDims() {
  return { vw: videoEl.videoWidth || 1280, vh: videoEl.videoHeight || 720 };
}

function videoToScreen(nx, ny) {
  const { vw, vh } = videoDims();
  const sw = innerWidth, sh = innerHeight;
  const s = Math.max(sw / vw, sh / vh);
  const dw = vw * s, dh = vh * s;
  return { x: nx * dw + (sw - dw) / 2, y: ny * dh + (sh - dh) / 2 };
}

function screenToWorld(sx, sy, out) {
  /* 修复：屏幕右 → 世界 +x（原符号写反，导致银河与手掌水平方向镜像） */
  out.x = clamp(sx / innerWidth - 0.5, -0.45, 0.45) * 2 * halfW;
  out.y = clamp(0.5 - sy / innerHeight, -0.45, 0.45) * 2 * halfH;
  return out;
}

function videoToWorld(nx, ny, out) {
  const x = state.mirror ? (1 - nx) : nx;
  const p = videoToScreen(x, ny);
  return screenToWorld(p.x, p.y, out);
}

function undistortLandmarks(lm, k) {
  if (!k || !lm) return lm;
  const { vw, vh } = videoDims();
  const aspect = vw / vh;
  const out = new Array(lm.length);
  for (let i = 0; i < lm.length; i++) {
    const p = lm[i];
    const ux = (p.x - 0.5) * aspect;
    const uy = p.y - 0.5;
    const r2 = ux * ux + uy * uy;
    const f = 1 + k * r2;
    out[i] = { x: 0.5 + ux * f / aspect, y: 0.5 + uy * f, z: p.z };
  }
  return out;
}

/* =========================================================
   8. 手部追踪 + 四路信号开合识别
   ========================================================= */
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17],
];
const FINGERS = [[5,6,8],[9,10,12],[13,14,16],[17,18,20]];
const TIPS = [8,12,16,20];

function analyzeHand(lm) {
  const wrist = lm[0];
  const scale = Math.hypot(lm[9].x - wrist.x, lm[9].y - wrist.y) + 1e-6;

  let ext = 0;
  for (const [m, p, t] of FINGERS) {
    const ax = lm[p].x - lm[m].x, ay = lm[p].y - lm[m].y;
    const bx = lm[t].x - lm[p].x, by = lm[t].y - lm[p].y;
    const la = Math.hypot(ax, ay) + 1e-6;
    const lb = Math.hypot(bx, by) + 1e-6;
    const c = clamp((ax * bx + ay * by) / (la * lb), -1, 1);
    ext += 1 - Math.acos(c) / Math.PI;
  }
  ext /= FINGERS.length;

  let spread = 0;
  for (let i = 0; i < TIPS.length - 1; i++) {
    spread += Math.hypot(lm[TIPS[i + 1]].x - lm[TIPS[i]].x, lm[TIPS[i + 1]].y - lm[TIPS[i]].y) / scale;
  }
  spread /= (TIPS.length - 1);
  const spreadN = clamp((spread - 0.55) / 0.95);

  const thumb = Math.hypot(lm[4].x - lm[17].x, lm[4].y - lm[17].y) / scale;
  const thumbN = clamp((thumb - 0.8) / 1.1);

  const palm = {
    x: (lm[0].x + lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 5,
    y: (lm[0].y + lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 5,
  };
  let tipDist = 0;
  for (const t of TIPS) {
    tipDist += Math.hypot(lm[t].x - palm.x, lm[t].y - palm.y) / scale;
  }
  tipDist /= TIPS.length;
  const tipN = clamp((tipDist - 0.9) / 0.8);

  const raw = 0.42 * ext + 0.26 * spreadN + 0.18 * thumbN + 0.14 * tipN;
  const roll = Math.atan2(lm[9].y - wrist.y, lm[9].x - wrist.x) + Math.PI / 2;
  const pinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) / scale;   // 拇指-食指捏合距离（收缩放大用）

  return { palm, scale, raw, roll, tip: lm[8], pinch };
}
