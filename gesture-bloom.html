<script type="module">
import * as THREE from 'three';

window.__APP_BOOTED__ = true;

/* =========================================================
   0. 工具
   ========================================================= */
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const damp = (c, t, l, dt) => c + (t - c) * (1 - Math.exp(-l * dt));
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const dampAngle = (c, t, l, dt) => c + angDiff(t, c) * (1 - Math.exp(-l * dt));   // 角度阻尼（走最短路径）

let _g2 = null;
function gauss() {
  if (_g2 !== null) { const v = _g2; _g2 = null; return v; }
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  const m = Math.sqrt(-2 * Math.log(u));
  _g2 = m * Math.sin(TAU * v);
  return m * Math.cos(TAU * v);
}

const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const MOBILE = IS_TOUCH && Math.min(innerWidth, innerHeight) < 820;
const DEFAULT_COUNT = MOBILE ? 120000 : 360000;   // 移动端 120k 保帧率 / 桌面 360k
const DPR = Math.min(devicePixelRatio || 1, MOBILE ? 2 : 2.5);   // 移动端 2× 保帧率 / 桌面 2.5× 更锐利

/* mix-blend-mode:screen 是否可用（不可用时隐藏视频，仍可运行） */
const SUPPORTS_SCREEN = !!(window.CSS && CSS.supports && CSS.supports('mix-blend-mode', 'screen'));

/* =========================================================
   1. 3D 银河几何
   ---------------------------------------------------------
   种群：核球 / 旋臂（含恒星团+盘面翘曲） / 盘面尘埃 / 外围晕
   ========================================================= */
const GALAXY_R = 4.0;    // 银河规模扩大
const NARMS = 5;
const TWIST = 3.6;
const CORE_R = 0.40;

/* 对数螺旋（真实星系旋臂形态）：theta = arm*2π/N + k*ln(r/r0) */
const ARM_R0 = 0.20;     // 旋臂起始（归一化半径）
const ARM_PITCH = 2.6;   // 缠绕系数，越大越紧
function armAngle(arm, rn) {
  return arm * (TAU / NARMS) + ARM_PITCH * Math.log(Math.max(0.08, rn) / ARM_R0);
}

/* 暖金核球 → 金黄 → 粉 → 紫 → 蓝紫旋臂（年轻星族偏蓝） */
const COLOR_STOPS = [
  [0.00, 1.00, 0.93, 0.72],
  [0.16, 1.00, 0.78, 0.50],
  [0.38, 1.00, 0.62, 0.72],
  [0.66, 0.72, 0.52, 1.00],
  [1.00, 0.40, 0.58, 1.00],
];

function rampColor(t, out) {
  t = clamp(t);
  for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
    const a = COLOR_STOPS[i], b = COLOR_STOPS[i + 1];
    if (t <= b[0]) {
      const k = (t - a[0]) / Math.max(1e-6, b[0] - a[0]);
      out[0] = a[1] + (b[1] - a[1]) * k;
      out[1] = a[2] + (b[2] - a[2]) * k;
      out[2] = a[3] + (b[3] - a[3]) * k;
      return;
    }
  }
  const b = COLOR_STOPS[COLOR_STOPS.length - 1];
  out[0] = b[1]; out[1] = b[2]; out[2] = b[3];
}

function corePos(out, i3) {
  const cr = CORE_R * Math.pow(Math.random(), 0.5);
  const ph = Math.random() * TAU;
  const ct = Math.random() * 2 - 1;
  const st = Math.sqrt(Math.max(0, 1 - ct * ct));
  out[i3]     = cr * st * Math.cos(ph);
  out[i3 + 1] = cr * st * Math.sin(ph);
  out[i3 + 2] = cr * ct * 0.60;
}

/* 旋臂脊线上的恒星团（亮结） */
const CLUSTERS = [];
(function buildClusters() {
  for (let a = 0; a < NARMS; a++) {
    for (let k = 0; k < 12; k++) {
      const rn = ARM_R0 + (1 - ARM_R0) * (k + 0.5 + Math.random() * 0.5) / 12;
      CLUSTERS.push({
        rn,
        theta: armAngle(a, rn) + (Math.random() - 0.5) * 0.12,
      });
    }
  }
})();

function createGalaxyGeometry(count) {
  const N = count;
  const pos  = new Float32Array(N * 3);
  const open = new Float32Array(N * 3);
  const col  = new Float32Array(N * 3);
  const rnd  = new Float32Array(N);
  const siz  = new Float32Array(N);
  const dly  = new Float32Array(N);

  const rgb = [0, 0, 0];
  let i = 0;

  const nBulge = Math.round(N * 0.13);
  const nBar   = Math.round(N * 0.06);
  const nDust  = Math.round(N * 0.20);
  const nHalo  = Math.round(N * 0.15);
  const nArms  = N - nBulge - nBar - nDust - nHalo;

  /* ---------- 核球 ---------- */
  for (let k = 0; k < nBulge; k++, i++) {
    const rr = 0.46 * GALAXY_R * Math.pow(Math.random(), 1.9);
    const ct = Math.random() * 2 - 1;
    const st = Math.sqrt(Math.max(0, 1 - ct * ct));
    const ph = Math.random() * TAU;
    open[i * 3]     = rr * st * Math.cos(ph);
    open[i * 3 + 1] = rr * st * Math.sin(ph);
    open[i * 3 + 2] = rr * ct * 0.42;

    corePos(pos, i * 3);

    rampColor(0.02 + 0.24 * Math.random(), rgb);
    col[i * 3] = rgb[0]; col[i * 3 + 1] = rgb[1]; col[i * 3 + 2] = rgb[2];

    rnd[i] = Math.random();
    siz[i] = 0.55 + Math.random() * 0.75;
    dly[i] = Math.random() * 0.30;
  }

  /* ---------- 中心棒（银河系是棒旋星系） ---------- */
  const BAR_A = 0.62 * GALAXY_R;
  const BAR_B = 0.16 * GALAXY_R;
  const BAR_C = 0.055 * GALAXY_R;
  for (let k = 0; k < nBar; k++, i++) {
    const t = Math.pow(Math.random(), 0.7);
    const sgn = Math.random() < 0.5 ? -1 : 1;
    open[i * 3]     = sgn * t * BAR_A;
    open[i * 3 + 1] = gauss() * BAR_B * (1 - 0.35 * t);
    open[i * 3 + 2] = gauss() * BAR_C * (1 - 0.30 * t);

    corePos(pos, i * 3);

    rampColor(0.04 + 0.16 * Math.random(), rgb);
    const d = 0.65 + Math.random() * 0.45;
    col[i * 3] = rgb[0] * d; col[i * 3 + 1] = rgb[1] * d; col[i * 3 + 2] = rgb[2] * d;

    rnd[i] = Math.random();
    siz[i] = 0.45 + Math.random() * 0.55;
    dly[i] = Math.random() * 0.25;
  }

  /* ---------- 旋臂（年轻蓝巨星 + HII 区，密度波峰） ---------- */
  for (let k = 0; k < nArms; k++, i++) {
    const rn = ARM_R0 + (1 - ARM_R0) * Math.pow(Math.random(), 0.62);
    const r  = rn * GALAXY_R;

    const arm  = (Math.random() * NARMS) | 0;
    const base = armAngle(arm, rn);

    /* 60% 紧贴脊线的亮星族，其余为较宽的臂体（比例↑、臂宽↓ → 旋臂更锐利） */
    const tight = Math.random() < 0.60;
    const armW  = tight ? (0.040 + 0.028 * rn) : (0.16 + 0.14 * rn);

    let theta = base + gauss() * armW;
    let rj    = Math.max(0.06, r + gauss() * (tight ? 0.022 : 0.055) * GALAXY_R);

    /* 羽状分支（spur）：从主臂甩出的小分支 */
    if (!tight && Math.random() < 0.09) {
      const s = Math.pow(Math.random(), 1.6);
      rj += s * 0.16 * GALAXY_R;
      theta += 0.60 * s / (0.35 + rn);
    }

    /* 盘面翘曲（外围沿方位角轻微起伏，3D 感） */
    const warp = 0.075 * GALAXY_R * Math.sin(theta - rn * 2.6) * smoothstep(0.45, 1, rn);

    open[i * 3]     = Math.cos(theta) * rj;
    open[i * 3 + 1] = Math.sin(theta) * rj;
    open[i * 3 + 2] = gauss() * (tight ? 0.030 : 0.055) * GALAXY_R * Math.exp(-rn * 1.1)
                    + gauss() * 0.012 * GALAXY_R + warp;

    corePos(pos, i * 3);

    /* 恒星团增亮 */
    let boost = 1;
    for (let c = 0; c < CLUSTERS.length; c++) {
      const cl = CLUSTERS[c];
      const dA = angDiff(theta, cl.theta) / 0.13;
      const dR = (rn - cl.rn) / 0.15;
      const d2 = dA * dA + dR * dR;
      if (d2 < 1) {
        const b = 1 + 3.0 * (1 - d2) * (1 - d2);
        if (b > boost) boost = b;
      }
    }

    const roll = Math.random();
    const pHot = tight ? 0.10 : 0.020;
    const pHii = pHot + (tight ? 0.055 : 0.030);
    if (roll < pHot) {                        /* 亮蓝巨星（年轻恒星） */
      rgb[0] = 0.66; rgb[1] = 0.86; rgb[2] = 1.00;
    } else if (roll < pHii) {                 /* 粉红电离氢区 HII */
      rgb[0] = 1.00; rgb[1] = 0.36; rgb[2] = 0.68;
    } else {
      rampColor(0.14 + 0.86 * rn, rgb);
      const blue = 0.30 * rn;                 /* 旋臂整体偏蓝（年轻星族） */
      rgb[0] *= (1 - blue * 0.35);
      rgb[1] *= (1 - blue * 0.10);
      rgb[2] = Math.min(1, rgb[2] * (1 + blue * 0.30));
      const j = ((tight ? 1.14 : 0.84) + Math.random() * 0.20) * Math.min(boost, 1.7);
      rgb[0] *= j; rgb[1] *= j; rgb[2] *= j;
    }
    col[i * 3] = rgb[0]; col[i * 3 + 1] = rgb[1]; col[i * 3 + 2] = rgb[2];

    rnd[i] = Math.random();
    siz[i] = roll < pHot
      ? (2.0 + Math.random() * 2.4)
      : (roll < pHii ? (1.1 + Math.random() * 0.9)
                     : (0.55 + Math.random() * 0.85) * Math.min(boost, 1.8));
    dly[i] = clamp(rn * 0.72 + Math.random() * 0.28);
  }

  /* ---------- 盘面尘埃 ---------- */
  for (let k = 0; k < nDust; k++, i++) {
    const rn = Math.pow(Math.random(), 0.5);
    const r  = (0.06 + 0.94 * rn) * GALAXY_R;
    const th = Math.random() * TAU;
    const rj = r + gauss() * 0.09 * GALAXY_R;

    open[i * 3]     = Math.cos(th) * rj;
    open[i * 3 + 1] = Math.sin(th) * rj;
    open[i * 3 + 2] = gauss() * 0.042 * GALAXY_R * Math.exp(-rn * 1.4);

    corePos(pos, i * 3);

    /* 尘埃带：到最近旋臂内缘的角距，带内压暗 → 形成暗纹 */
    let dArm = Math.PI;
    for (let a = 0; a < NARMS; a++) {
      const d = Math.abs(angDiff(th, armAngle(a, rn) + 0.32));
      if (d < dArm) dArm = d;
    }
    let lane = 1;
    if (dArm > 0.30) lane *= 0.48;
    if (dArm > 0.45 && dArm < 0.78) lane *= 0.26;   /* 尘埃带最暗 */
    if (dArm > 1.00) lane *= 0.68;

    rampColor(0.20 + 0.80 * rn, rgb);
    const j = (0.42 + Math.random() * 0.30) * lane;
    col[i * 3]     = rgb[0] * j + 0.05 * lane;
    col[i * 3 + 1] = rgb[1] * j + 0.08 * lane;
    col[i * 3 + 2] = rgb[2] * j + 0.16 * lane;

    rnd[i] = Math.random();
    siz[i] = 0.30 + Math.random() * 0.45;
    dly[i] = 0.08 + Math.random() * 0.45;
  }

  /* ---------- 外围晕 ---------- */
  for (let k = 0; k < nHalo; k++, i++) {
    const rr = GALAXY_R * (0.30 + 1.05 * Math.pow(Math.random(), 0.6));
    const ct = Math.random() * 2 - 1;
    const st = Math.sqrt(Math.max(0, 1 - ct * ct));
    const ph = Math.random() * TAU;

    open[i * 3]     = rr * st * Math.cos(ph);
    open[i * 3 + 1] = rr * st * Math.sin(ph);
    open[i * 3 + 2] = rr * ct * 0.85;

    corePos(pos, i * 3);

    rampColor(0.10 + 0.30 * Math.random(), rgb);   /* 晕族：偏红黄的老年恒星 */
    const dim = 0.22 + Math.random() * 0.28;
    col[i * 3] = rgb[0] * dim; col[i * 3 + 1] = rgb[1] * dim; col[i * 3 + 2] = rgb[2] * dim;

    rnd[i] = Math.random();
    siz[i] = 0.40 + Math.random() * 0.55;
    dly[i] = 0.62 + Math.random() * 0.38;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aOpen',    new THREE.BufferAttribute(open, 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aRand',    new THREE.BufferAttribute(rnd, 1));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(siz, 1));
  geo.setAttribute('aDelay',   new THREE.BufferAttribute(dly, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), GALAXY_R * 3);
  return geo;
}

/* =========================================================
   2. GLSL
   ========================================================= */
const VERT = /* glsl */`
uniform float uTime;
uniform float uBloom;
uniform float uSize;
uniform float uPixelRatio;
uniform float uOpacity;
uniform float uSpin;
uniform vec3  uFocus;
uniform float uFocusStrength;
uniform float uFocusRadius;
uniform vec3  uHand;
uniform vec3  uHandVel;
uniform float uHandStr;
uniform float uHandRadius;
uniform vec3  uHand2;
uniform vec3  uHand2Vel;
uniform float uHand2Str;
uniform float uHand2Radius;
uniform vec2  uRipples;
uniform float uRippleAmp;

attribute vec3  aOpen;
attribute vec3  aColor;
attribute float aRand;
attribute float aSize;
attribute float aDelay;

varying vec3  vColor;
varying float vGlow;

/* 手的扰动（软化版）：径向喷散 + 拖拽 + 涡旋 + 涟漪，平方衰减 → 过渡柔和 */
vec3 handDisturb(vec3 p, vec3 hPos, vec3 hVel, float hStr, float hRadius, float seed) {
  vec3  toH  = p - hPos;
  float dH   = length(toH);
  float h2   = 1.0 - smoothstep(0.0, hRadius, dH);
  float hInf = h2 * h2 * hStr;
  vec3  hn   = toH / max(dH, 1e-4);
  p += hn * hInf * (0.22 + 0.30 * seed);
  p.xy += hVel.xy * hInf * (0.16 + 0.20 * seed);
  vec2 ht = vec2(-hn.y, hn.x);
  p.xy += ht * hInf * 0.38 * (0.55 + 0.45 * sin(uTime * 1.7 + seed * 37.0));
  p.z  += sin(dH * 4.2 - uTime * 2.2) * hInf * 0.11;
  return p;
}

void main() {
  float local = clamp(uBloom * 1.75 - aDelay * 0.75, 0.0, 1.0);
  float e = local * local * (3.0 - 2.0 * local);

  vec3 core = position;
  vec3 gal  = aOpen;
  float rad = length(gal.xy);

  float ang = uTime * uSpin + 0.30 * sin(uTime * 0.28 + rad * 0.85);
  float ca = cos(ang), sa = sin(ang);
  vec3 g = vec3(gal.x * ca - gal.y * sa,
                gal.x * sa + gal.y * ca,
                gal.z);

  float th   = atan(g.y, g.x);
  /* 双密度波叠加：亮结沿旋臂传播（流动感） */
  float waveA = sin(th * 3.0 - uTime * 1.7 + rad * 2.1);
  float waveB = sin(th * 5.0 - uTime * 2.6 + rad * 3.6);
  float wk = smoothstep(0.10, 1.0, waveA) * 0.55 + smoothstep(0.25, 1.0, waveB) * 0.45;

  /* 沿旋臂切向星流 */
  vec2 tangDir = vec2(-sin(th), cos(th));
  g.xy += tangDir * (wk - 0.45) * 0.085 * e;

  /* 径向迁移 + 呼吸 */
  float mig = sin(uTime * 0.09 + aRand * 6.2831) * 0.5 + sin(uTime * 0.05 + rad * 1.7) * 0.5;
  float breath = 1.0 + 0.030 * mig * e
                     + 0.018 * sin(uTime * 0.55 + rad * 1.35 + aRand * 2.0);
  g.xy *= breath;

  float t = uTime;
  vec3 turb = vec3(
    sin(g.y * 1.55 + t * 0.75 + aRand * 11.0),
    cos(g.x * 1.70 + t * 0.90 + aRand * 8.0),
    sin((g.x - g.y) * 1.30 + t * 0.60 + aRand * 13.0)
  );
  g += turb * (0.028 + 0.058 * e) * (0.35 + 0.65 * aRand);

  float cAng = uTime * 0.45;
  float cc = cos(cAng), cs = sin(cAng);
  vec3 c = vec3(core.x * cc - core.y * cs,
                core.x * cs + core.y * cc,
                core.z);

  vec3 p = mix(c, g, e);

  /* 水波纹：从中心向外扩散的环状波（双槽叠加，左手拨动触发） */
  float pr = length(p.xy);
  float rdt1 = uTime - uRipples.x, rdt2 = uTime - uRipples.y;
  float f1 = rdt1 * 3.2, f2 = rdt2 * 3.2;
  float ring1 = exp(-(pr - f1) * (pr - f1) * 3.5) * exp(-rdt1 * 1.1);
  float ring2 = exp(-(pr - f2) * (pr - f2) * 3.5) * exp(-rdt2 * 1.1);
  float rip = (ring1 + ring2) * uRippleAmp;
  p.z += (sin((pr - f1) * 5.0) * ring1 + sin((pr - f2) * 5.0) * ring2) * uRippleAmp * 0.45;
  p.xy += (p.xy / max(pr, 1e-3)) * rip * 0.08;

  vec4 wp = modelMatrix * vec4(p, 1.0);

  vec3  toF  = wp.xyz - uFocus;
  float dF   = length(toF);
  float infl = (1.0 - smoothstep(0.0, uFocusRadius, dF)) * uFocusStrength;
  vec3  nrm  = toF / max(dF, 1e-4);
  wp.xyz += nrm * infl * (0.45 + 0.55 * aRand);
  vec3 tang = normalize(cross(vec3(0.0, 0.0, 1.0), nrm + vec3(1e-4)));
  wp.xyz += tang * infl * 0.35;

  /* 双手扰动场：右手跟随（环境微扰）+ 左手拨动（搅动） */
  wp.xyz = handDisturb(wp.xyz, uHand, uHandVel, uHandStr, uHandRadius, aRand);
  wp.xyz = handDisturb(wp.xyz, uHand2, uHand2Vel, uHand2Str, uHand2Radius, aRand * 0.7 + 0.15);
  float stir = (1.0 - smoothstep(0.0, uHandRadius, length(wp.xyz - uHand))) * uHandStr
             + (1.0 - smoothstep(0.0, uHand2Radius, length(wp.xyz - uHand2))) * uHand2Str;

  vec4 mv = viewMatrix * wp;
  gl_Position = projectionMatrix * mv;

  float sizeMul = 0.50 + 0.85 * e;
  gl_PointSize = uSize * aSize * sizeMul * uPixelRatio / max(-mv.z, 0.1);
  gl_PointSize = clamp(gl_PointSize, 0.7, 56.0);

  float tw = 0.72 + 0.28 * sin(uTime * (1.2 + aRand * 3.5) + aRand * 41.0);

  vColor = aColor;
  vGlow  = ((0.55 + 0.85 * e) + wk * 0.55 * e + infl * 0.8 + stir * 0.35 + rip * 1.1) * tw;
}
`;

const FRAG = /* glsl */`
uniform float uOpacity;
varying vec3  vColor;
varying float vGlow;

void main() {
  vec2  uv = gl_PointCoord - vec2(0.5);
  float d  = length(uv) * 2.0;
  if (d > 1.0) discard;
  float a   = pow(1.0 - d, 1.45);
  float hot = exp(-d * 7.5) * 0.50;
  gl_FragColor = vec4(vColor * vGlow * (1.0 + hot), a * uOpacity * 0.42);
}
`;

/* =========================================================
   3. 星云光斑纹理
   ========================================================= */
function makeGlowTexture(size, stops) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [off, col] of stops) g.addColorStop(off, col);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const GLOW_TEX = {
  violet:  makeGlowTexture(256, [[0, 'rgba(190,140,255,0.85)'], [0.35, 'rgba(120,70,220,0.30)'], [1, 'rgba(0,0,0,0)']]),
  magenta: makeGlowTexture(256, [[0, 'rgba(255,120,190,0.80)'], [0.35, 'rgba(210,60,150,0.28)'], [1, 'rgba(0,0,0,0)']]),
  cyan:    makeGlowTexture(256, [[0, 'rgba(120,200,255,0.75)'], [0.35, 'rgba(50,110,240,0.26)'], [1, 'rgba(0,0,0,0)']]),
  gold:    makeGlowTexture(256, [[0, 'rgba(255,215,150,0.85)'], [0.35, 'rgba(255,150,70,0.30)'], [1, 'rgba(0,0,0,0)']]),
  core:    makeGlowTexture(256, [[0, 'rgba(255,244,230,0.95)'], [0.25, 'rgba(255,190,140,0.55)'], [0.6, 'rgba(200,90,160,0.18)'], [1, 'rgba(0,0,0,0)']]),
};

const NEBULA_SPECS = [
  { tex: 'violet',  color: 0x9d6bff, n: 7, minR: 0.50, maxR: 3.5, minS: 2.4, maxS: 5.8, op: 0.13 },
  { tex: 'magenta', color: 0xff63b8, n: 7, minR: 0.55, maxR: 3.3, minS: 2.0, maxS: 5.0, op: 0.12 },
  { tex: 'cyan',    color: 0x55b6ff, n: 6, minR: 0.85, maxR: 3.9, minS: 1.9, maxS: 4.4, op: 0.11 },
  { tex: 'gold',    color: 0xffc47a, n: 6, minR: 0.28, maxR: 2.2, minS: 1.2, maxS: 3.0, op: 0.14 },
];

/* =========================================================
   4. Galaxy 类（3D 倾斜盘面）
   ========================================================= */
class Galaxy {
  constructor(count) {
    this.geometry = createGalaxyGeometry(count);
    this.count = count;

    this.uniforms = {
      uTime:          { value: 0 },
      uBloom:         { value: 0 },
      uSize:          { value: 11 },
      uPixelRatio:    { value: DPR },
      uOpacity:       { value: 0 },
      uSpin:          { value: 0.26 },
      uFocus:         { value: new THREE.Vector3() },
      uFocusStrength: { value: 0 },
      uFocusRadius:   { value: 1.15 },
      uHand:          { value: new THREE.Vector3() },
      uHandVel:       { value: new THREE.Vector3() },
      uHandStr:       { value: 0 },
      uHandRadius:    { value: 1.8 },
      uHand2:         { value: new THREE.Vector3() },
      uHand2Vel:      { value: new THREE.Vector3() },
      uHand2Str:      { value: 0 },
      uHand2Radius:   { value: 1.6 },
      uRipples:       { value: new THREE.Vector2(-99, -99) },
      uRippleAmp:     { value: 0 },
    };

    this.material = new THREE.ShaderMaterial({
      uniforms: this.uniforms,
      vertexShader: VERT,
      fragmentShader: FRAG,
      transparent: true,
      depthWrite: false,
      depthTest: false,
      blending: THREE.AdditiveBlending,
    });

    this.points = new THREE.Points(this.geometry, this.material);
    this.points.frustumCulled = false;

    this.group = new THREE.Group();
    this.group.rotation.order = 'YXZ';
    this.group.add(this.points);

    this.sprites = [];
    for (const spec of NEBULA_SPECS) {
      for (let s = 0; s < spec.n; s++) {
        const mat = new THREE.SpriteMaterial({
          map: GLOW_TEX[spec.tex],
          color: spec.color,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          depthTest: false,
        });
        const sp = new THREE.Sprite(mat);
        const ang = Math.random() * TAU;
        const r = spec.minR + (spec.maxR - spec.minR) * Math.pow(Math.random(), 0.75);
        sp.position.set(Math.cos(ang) * r, Math.sin(ang) * r, gauss() * 0.24);
        const sc = spec.minS + (spec.maxS - spec.minS) * Math.random();
        sp.scale.set(sc, sc, 1);
        sp.userData = {
          base: sc,
          op: spec.op * (0.7 + Math.random() * 0.6),
          rot: (Math.random() - 0.5) * 0.5,
          phase: Math.random() * TAU,
        };
        this.group.add(sp);
        this.sprites.push(sp);
      }
    }

    const coreMat = new THREE.SpriteMaterial({
      map: GLOW_TEX.core,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: false,
    });
    this.coreGlow = new THREE.Sprite(coreMat);
    this.coreGlow.scale.set(2.0, 2.0, 1);
    this.group.add(this.coreGlow);
  }

  dispose() {
    this.geometry.dispose();
    this.material.dispose();
    for (const sp of this.sprites) sp.material.dispose();
    this.coreGlow.material.dispose();
  }
}

/* ---- 全屏流动星空背景：三层视差星尘 + 漂移星云 + 远处河外星系 ---- */
let bgFlowMat = null;
const bgClouds = [];
const bgGalaxies = [];

(function createBackground() {
  /* ① 流动星尘：xy 存入 [0,BOX) 循环箱，z 为深度层，shader 内按流向匀速流动 */
  const N = MOBILE ? 1500 : 4200;
  const BOX = 60;
  const p = new Float32Array(N * 3);
  const f = new Float32Array(N * 3);   // 流向(归一化 xy) + 速度(z)
  const s = new Float32Array(N);
  const c = new Float32Array(N * 3);
  const seed = new Float32Array(N);
  const rgb = [0, 0, 0];

  const LAYERS = [
    { z: -38, n: 0.45, size: 0.8, dim: 0.35, speed: 0.4 },
    { z: -24, n: 0.33, size: 1.1, dim: 0.50, speed: 0.9 },
    { z: -13, n: 0.22, size: 1.5, dim: 0.70, speed: 1.8 },
  ];

  let idx = 0;
  let budget = N;
  for (let li = 0; li < LAYERS.length; li++) {
    const L = LAYERS[li];
    const cnt = li === LAYERS.length - 1 ? budget : Math.round(N * L.n);
    budget -= cnt;
    for (let k = 0; k < cnt; k++, idx++) {
      const th = Math.random() * TAU;
      p[idx * 3]     = Math.random() * BOX;
      p[idx * 3 + 1] = Math.random() * BOX;
      p[idx * 3 + 2] = L.z;
      f[idx * 3]     = Math.cos(th);
      f[idx * 3 + 1] = Math.sin(th);
      f[idx * 3 + 2] = L.speed * (0.5 + Math.random());
      s[idx] = L.size * (0.5 + Math.random());

      const t = Math.random();
      if (t < 0.35)      { rgb[0] = 0.55; rgb[1] = 0.62; rgb[2] = 1.00; }
      else if (t < 0.60) { rgb[0] = 0.62; rgb[1] = 0.48; rgb[2] = 1.00; }
      else if (t < 0.85) { rgb[0] = 1.00; rgb[1] = 0.55; rgb[2] = 0.85; }
      else               { rgb[0] = 1.00; rgb[1] = 0.85; rgb[2] = 0.65; }

      const d = L.dim * (0.35 + Math.random() * 0.65);
      c[idx * 3]     = rgb[0] * d;
      c[idx * 3 + 1] = rgb[1] * d;
      c[idx * 3 + 2] = rgb[2] * d;
      seed[idx] = Math.random() * 100;
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('aFlow',    new THREE.BufferAttribute(f, 3));
  g.setAttribute('aSize',    new THREE.BufferAttribute(s, 1));
  g.setAttribute('aColor',   new THREE.BufferAttribute(c, 3));
  g.setAttribute('aSeed',    new THREE.BufferAttribute(seed, 1));
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, -25), 100);

  bgFlowMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPR: { value: DPR }, uBox: { value: BOX } },
    vertexShader: `
      uniform float uTime; uniform float uPR; uniform float uBox;
      attribute vec3  aFlow;
      attribute float aSize;
      attribute vec3  aColor;
      attribute float aSeed;
      varying vec3  vC;
      varying float vA;
      void main(){
        vec3 p = position;
        vec2 dir = normalize(aFlow.xy);
        float wob = sin(uTime * 0.25 + aSeed) * 0.8;
        p.xy = mod(p.xy + dir * (aFlow.z * uTime) + vec2(wob), uBox) - uBox * 0.5;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * 1.4 * uPR * (20.0 / max(-mv.z, 1.0));
        gl_PointSize = clamp(gl_PointSize, 0.6, 7.0);
        vC = aColor;
        vA = 0.35 + 0.5 * (0.5 + 0.5 * sin(uTime * 0.6 + aSeed * 7.0));
      }`,
    fragmentShader: `
      varying vec3 vC;
      varying float vA;
      void main(){
        vec2 uv = gl_PointCoord - vec2(0.5);
        float d = length(uv) * 2.0;
        if (d > 1.0) discard;
        gl_FragColor = vec4(vC * vA, pow(1.0 - d, 1.6) * 0.6);
      }`,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  const pts = new THREE.Points(g, bgFlowMat);
  pts.frustumCulled = false;
  scene.add(pts);

  /* ② 远处漂移星云（大光斑缓慢飘动） */
  const CLOUD_SPECS = [
    { tex: 'violet',  color: 0x6a4dcc, n: 3, op: 0.10 },
    { tex: 'magenta', color: 0xcc4d96, n: 2, op: 0.08 },
    { tex: 'cyan',    color: 0x3f6fcc, n: 3, op: 0.09 },
  ];
  for (const spec of CLOUD_SPECS) {
    for (let i = 0; i < spec.n; i++) {
      const mat = new THREE.SpriteMaterial({
        map: GLOW_TEX[spec.tex], color: spec.color,
        transparent: true, opacity: spec.op,
        blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
      });
      const sp = new THREE.Sprite(mat);
      sp.position.set((Math.random() - 0.5) * 40, (Math.random() - 0.5) * 26, -18 - Math.random() * 18);
      const sc = 6 + Math.random() * 10;
      sp.scale.set(sc, sc, 1);
      sp.userData = {
        base: sc,
        drift: { x: (Math.random() - 0.5) * 0.15, y: (Math.random() - 0.5) * 0.1 },
        phase: Math.random() * TAU,
      };
      scene.add(sp);
      bgClouds.push(sp);
    }
  }

  /* ③ 远处河外星系（拉伸光斑 = 侧向星系盘） */
  const BG_GALAXIES = [
    { color: 0x8f7bff, x: -14, y:  6, sc: 3.2, op: 0.35 },
    { color: 0x6fa8ff, x:  15, y: -5, sc: 2.6, op: 0.30 },
    { color: 0xff9ad2, x:  -9, y: -8, sc: 2.0, op: 0.28 },
    { color: 0xffd9a0, x:  11, y:  8, sc: 1.6, op: 0.32 },
  ];
  for (const spec of BG_GALAXIES) {
    const mat = new THREE.SpriteMaterial({
      map: GLOW_TEX.gold, color: spec.color,
      transparent: true, opacity: spec.op,
      blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
    });
    const sp = new THREE.Sprite(mat);
    sp.position.set(spec.x, spec.y, -26 - Math.random() * 8);
    sp.scale.set(spec.sc, spec.sc * 0.42, 1);
    sp.userData = { rot: Math.random() * TAU };
    scene.add(sp);
    bgGalaxies.push(sp);
  }
})();

let halfH = 0, halfW = 0, baseScale = 1;
function updateViewport() {
  halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
  halfW = halfH * camera.aspect;
  baseScale = clamp(halfH / 4.4, 0.4, 1.0);
}
updateViewport();

/* =========================================================
   7. 坐标映射（与 CSS object-fit:cover 同一套数学）
   ========================================================= */
function videoDims() {
  return { vw: videoEl.videoWidth || 1280, vh: videoEl.videoHeight || 720 };
}

function videoToScreen(nx, ny) {
  const { vw, vh } = videoDims();
  const sw = innerWidth, sh = innerHeight;
  const s = Math.max(sw / vw, sh / vh);
  const dw = vw * s, dh = vh * s;
  return { x: nx * dw + (sw - dw) / 2, y: ny * dh + (sh - dh) / 2 };
}

function screenToWorld(sx, sy, out) {
  /* 修复：屏幕右 → 世界 +x（原符号写反，导致银河与手掌水平方向镜像） */
  out.x = clamp(sx / innerWidth - 0.5, -0.45, 0.45) * 2 * halfW;
  out.y = clamp(0.5 - sy / innerHeight, -0.45, 0.45) * 2 * halfH;
  return out;
}

function videoToWorld(nx, ny, out) {
  const x = state.mirror ? (1 - nx) : nx;
  const p = videoToScreen(x, ny);
  return screenToWorld(p.x, p.y, out);
}

function undistortLandmarks(lm, k) {
  if (!k || !lm) return lm;
  const { vw, vh } = videoDims();
  const aspect = vw / vh;
  const out = new Array(lm.length);
  for (let i = 0; i < lm.length; i++) {
    const p = lm[i];
    const ux = (p.x - 0.5) * aspect;
    const uy = p.y - 0.5;
    const r2 = ux * ux + uy * uy;
    const f = 1 + k * r2;
    out[i] = { x: 0.5 + ux * f / aspect, y: 0.5 + uy * f, z: p.z };
  }
  return out;
}

/* =========================================================
   8. 手部追踪 + 四路信号开合识别
   ========================================================= */
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17],
];
const FINGERS = [[5,6,8],[9,10,12],[13,14,16],[17,18,20]];
const TIPS = [8,12,16,20];

function analyzeHand(lm) {
  const wrist = lm[0];
  const scale = Math.hypot(lm[9].x - wrist.x, lm[9].y - wrist.y) + 1e-6;

  let ext = 0;
  for (const [m, p, t] of FINGERS) {
    const ax = lm[p].x - lm[m].x, ay = lm[p].y - lm[m].y;
    const bx = lm[t].x - lm[p].x, by = lm[t].y - lm[p].y;
    const la = Math.hypot(ax, ay) + 1e-6;
    const lb = Math.hypot(bx, by) + 1e-6;
    const c = clamp((ax * bx + ay * by) / (la * lb), -1, 1);
    ext += 1 - Math.acos(c) / Math.PI;
  }
  ext /= FINGERS.length;

  let spread = 0;
  for (let i = 0; i < TIPS.length - 1; i++) {
    spread += Math.hypot(lm[TIPS[i + 1]].x - lm[TIPS[i]].x, lm[TIPS[i + 1]].y - lm[TIPS[i]].y) / scale;
  }
  spread /= (TIPS.length - 1);
  const spreadN = clamp((spread - 0.55) / 0.95);

  const thumb = Math.hypot(lm[4].x - lm[17].x, lm[4].y - lm[17].y) / scale;
  const thumbN = clamp((thumb - 0.8) / 1.1);

  const palm = {
    x: (lm[0].x + lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 5,
    y: (lm[0].y + lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 5,
  };
  let tipDist = 0;
  for (const t of TIPS) {
    tipDist += Math.hypot(lm[t].x - palm.x, lm[t].y - palm.y) / scale;
  }
  tipDist /= TIPS.length;
  const tipN = clamp((tipDist - 0.9) / 0.8);

  const raw = 0.42 * ext + 0.26 * spreadN + 0.18 * thumbN + 0.14 * tipN;
  const roll = Math.atan2(lm[9].y - wrist.y, lm[9].x - wrist.x) + Math.PI / 2;
  const pinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) / scale;   // 拇指-食指捏合距离（收缩放大用）

  return { palm, scale, raw, roll, tip: lm[8], pinch };
}

/* =========================================================
   9. 摄像头（多重约束降级 + 权限错误 + 重试）
   ========================================================= */
const videoEl = $('cam-video');
videoEl.playsInline = true;
videoEl.muted = true;
videoEl.autoplay = true;
videoEl.setAttribute('playsinline', '');
videoEl.setAttribute('webkit-playsinline', '');

let hands = null;
let camStream = null;
let frameBusy = false;
let loopStarted = false;
let mpGen = 0;        // MediaPipe 实例代次（切换资源源时旧结果作废）
let mpBaseIdx = 0;    // 当前使用的 CDN 源下标
let sendErrors = 0;
let sendStartedAt = 0;   // 当前 send() 的发起时刻（卡死检测用）
let sendSeq = 0;         // send 序号：换源 / 强制恢复时作废挂起的旧 send
let mpStalls = 0;        // 连续卡死次数（≥2 重建实例）
let lastSendAt = 0;      // 上次 send 发起时刻（限速 ~30Hz 用）
const MP_BASES = [
  'https://registry.npmmirror.com/@mediapipe/hands/0.4.1675469240/files',
  'https://fastly.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240',
  'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240',
  'https://unpkg.com/@mediapipe/hands@0.4.1675469240',
  'https://jsd.cdn.zzko.cn/npm/@mediapipe/hands@0.4.1675469240',
];

function setStatus(text, kind = '') {
  $('status-text').textContent = text;
  $('status-dot').className = 'dot' + (kind ? ' ' + kind : '');
}

function applyMirror() {
  videoEl.classList.toggle('mirrored', state.mirror);
  $('s-mirror').checked = state.mirror;
}

function setBrightness(v) {
  state.bright = v;
  videoEl.style.filter = `brightness(${v}) saturate(1.25) contrast(1.02)`;
}
setBrightness(state.bright);

async function acquireCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const err = new Error('当前环境不支持摄像头（请通过 localhost / HTTPS 打开）');
    err.name = 'Unsupported';
    throw err;
  }

  const want = state.targetFacing || 'environment';
  const attempts = [
    { video: { facingMode: { ideal: want }, width: { ideal: MOBILE ? 640 : 1280 }, height: { ideal: MOBILE ? 480 : 720 } } },
    { video: { facingMode: { ideal: want } } },
    { video: { width: { ideal: MOBILE ? 640 : 1280 }, height: { ideal: MOBILE ? 480 : 720 } } },
    { video: true },
    { video: { facingMode: { ideal: want === 'environment' ? 'user' : 'environment' } } },
  ];

  let lastErr = null;
  for (const a of attempts) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: a.video });
      camStream = stream;

      let fm = 'environment';
      try {
        const s = stream.getVideoTracks()[0] && stream.getVideoTracks()[0].getSettings();
        if (s && (s.facingMode === 'user' || s.facingMode === 'environment')) fm = s.facingMode;
      } catch (e) {}

      state.facingMode = fm;
      state.mirror = (fm === 'user');
      applyMirror();

      videoEl.srcObject = stream;
      try { await videoEl.play(); } catch (e) { /* 播放失败不致命 */ }
      state.cameraReady = true;
      state.lastResultTime = state.time;   // 重置检测看门狗
      $('btn-flip').classList.remove('hidden');
      return;
    } catch (err) {
      lastErr = err;
      try { camStream && camStream.getTracks().forEach(t => t.stop()); } catch (_) {}
      camStream = null;
    }
  }

  lastErr = lastErr || new Error('摄像头启动失败');
  if (lastErr.name === 'NotAllowedError' || lastErr.name === 'SecurityError') {
    lastErr.message = '摄像头权限被拒绝：请在浏览器设置中允许本站使用摄像头，然后点「重试摄像头」';
  } else if (lastErr.name === 'NotFoundError' || lastErr.name === 'DevicesNotFoundError') {
    lastErr.message = '未找到摄像头设备';
  } else if (lastErr.name === 'NotReadableError' || lastErr.name === 'TrackStartError') {
    lastErr.message = '摄像头被其他应用占用，请关闭后重试';
  }
  throw lastErr;
}

function initHands() {
  const gen = ++mpGen;
  if (hands) { try { hands.close(); } catch (e) {} }
  /* 关键修复：close() 会让在途 send() 永久挂起 → 强制解绑，防止 frameBusy 卡死 */
  sendSeq++;
  frameBusy = false;
  mpStalls = 0;
  try {
    hands = new window.Hands({
      locateFile: (file) => `${MP_BASES[mpBaseIdx]}/${file}`,
    });
  } catch (e) {
    console.warn('[mp] Hands 实例创建失败：', e);
    hands = null;
    return;
  }
  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 0,          // 轻量模型：加载更快、推理更流畅（移动端更稳）
    minDetectionConfidence: 0.5, // 降低阈值，更容易检测到
    minTrackingConfidence: 0.5,
    selfieMode: false,
  });
  hands.onResults((results) => {
    if (gen === mpGen) {
      state.lastResultTime = state.time;
      onResults(results);
    }
  });
}

function startFrameLoop() {
  if (loopStarted) return;
  loopStarted = true;
  const loop = async () => {
    requestAnimationFrame(loop);
    if (!hands) return;

    const now = state.time;
    if (frameBusy) {
      /* 卡死保护：send() 长时间不返回（实例被 close 时可能永久挂起）→ 强制恢复 */
      const limit = state.mpEverWorked ? 8 : 14;   // 模型未就绪时可能是正常下载，给足时间
      if (now - sendStartedAt > limit) {
        console.warn('[mp] send() 卡死超时，强制恢复帧循环');
        sendSeq++;               // 作废挂起的那次 send
        frameBusy = false;
        if (++mpStalls >= 2 || (!state.mpEverWorked && now - state.lastResultTime > 9)) {   // 连续两次卡死 → 重建实例
          if (!state.mpEverWorked && mpBaseIdx < MP_BASES.length - 1) mpBaseIdx++;
          initHands();
          state.lastResultTime = now;
        }
      }
      return;
    }

    if (!videoEl.videoWidth || videoEl.readyState < 2) return;
    if (now - lastSendAt < 0.033) return;   // 发送限速 ~30Hz，减轻 GPU / 主线程争用

    frameBusy = true;
    sendStartedAt = now;
    lastSendAt = now;
    const seq = ++sendSeq;
    try {
      await hands.send({ image: videoEl });
      if (seq === sendSeq) { sendErrors = 0; mpStalls = 0; }
    } catch (e) {
      if (seq === sendSeq && ++sendErrors > 60) {
        sendErrors = 0;
        console.warn('[mp] 模型推理连续失败：', e);
      }
    }
    if (seq === sendSeq) frameBusy = false;   // 换源后由新代次接管，旧 Promise 不再干扰
  };
  loop();
}

async function startTracking() {
  if (typeof window.Hands === 'undefined') {
    /* 等待多 CDN 加载器完成 */
    if (window.__MP && window.__MP.promise) {
      try { await window.__MP.promise; } catch (e) {}
    }
    if (typeof window.Hands === 'undefined') {
      throw new Error('MediaPipe 脚本加载失败（网络无法访问 CDN）');
    }
  }
  initHands();   // 每次重试都重建实例：顺带复位 frameBusy / sendSeq，等于完整重启识别管线
  await acquireCamera();
  startFrameLoop();
}

function onResults(results) {
  state.lastResults = results;
  if (!state.mpEverWorked) setStatus('识别就绪 · 把手放进画面即可交互', 'ok');
  state.mpEverWorked = true;
  const list = results.multiHandLandmarks || [];

  const handedness = results.multiHandedness || [];
  state.hands = [];
  for (let n = 0; n < list.length; n++) {
    const lm = undistortLandmarks(list[n], state.distK);
    const info = analyzeHand(lm);
    info.lm = lm;
    /* MediaPipe 假设输入为镜像画面；我们喂的是原始画面 → 左右标签互换 */
    const rawL = handedness[n] && handedness[n].label ? handedness[n].label.toLowerCase() : '';
    info.handed = rawL === 'left' ? 'right' : (rawL === 'right' ? 'left' : '');
    state.hands.push(info);
  }
}

/* =========================================================
   9.5 皮肤色块兜底识别（零依赖、纯本地，MediaPipe 全挂时保底）
   ========================================================= */
const SKIN_W = 160, SKIN_H = 120;
const skinCanvas = document.createElement('canvas');
skinCanvas.width = SKIN_W; skinCanvas.height = SKIN_H;
const sctx = skinCanvas.getContext('2d', { willReadFrequently: true });
const skinMask = new Uint8Array(SKIN_W * SKIN_H);
const skinSeen = new Uint8Array(SKIN_W * SKIN_H);
const skinQueue = new Int32Array(SKIN_W * SKIN_H);

function skinFallback() {
  if (!videoEl.videoWidth || videoEl.readyState < 2) return null;
  try { sctx.drawImage(videoEl, 0, 0, SKIN_W, SKIN_H); } catch (e) { return null; }
  const data = sctx.getImageData(0, 0, SKIN_W, SKIN_H).data;

  /* YCbCr 肤色阈值 */
  let count = 0;
  for (let i = 0; i < SKIN_W * SKIN_H; i++) {
    const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2];
    const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
    const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
    const y = 0.299 * r + 0.587 * g + 0.114 * b;
    const isSkin = y > 45 && cb >= 75 && cb <= 130 && cr >= 130 && cr <= 178;
    skinMask[i] = isSkin ? 1 : 0;
    if (isSkin) count++;
  }
  if (count < SKIN_W * SKIN_H * 0.003) return null;

  /* BFS 找最大连通域 */
  skinSeen.fill(0);
  let best = null, bestArea = 0;

  for (let i = 0; i < SKIN_W * SKIN_H; i++) {
    if (!skinMask[i] || skinSeen[i]) continue;
    let head = 0, tail = 0, area = 0, sx = 0, sy = 0;
    let minX = SKIN_W, maxX = 0, minY = SKIN_H, maxY = 0;
    skinQueue[tail++] = i; skinSeen[i] = 1;
    while (head < tail) {
      const p = skinQueue[head++];
      const px = p % SKIN_W, py = (p / SKIN_W) | 0;
      area++; sx += px; sy += py;
      if (px < minX) minX = px;
      if (px > maxX) maxX = px;
      if (py < minY) minY = py;
      if (py > maxY) maxY = py;
      if (px > 0 && skinMask[p - 1] && !skinSeen[p - 1]) { skinSeen[p - 1] = 1; skinQueue[tail++] = p - 1; }
      if (px < SKIN_W - 1 && skinMask[p + 1] && !skinSeen[p + 1]) { skinSeen[p + 1] = 1; skinQueue[tail++] = p + 1; }
      if (py > 0 && skinMask[p - SKIN_W] && !skinSeen[p - SKIN_W]) { skinSeen[p - SKIN_W] = 1; skinQueue[tail++] = p - SKIN_W; }
      if (py < SKIN_H - 1 && skinMask[p + SKIN_W] && !skinSeen[p + SKIN_W]) { skinSeen[p + SKIN_W] = 1; skinQueue[tail++] = p + SKIN_W; }
    }
    if (area > bestArea) {
      bestArea = area;
      best = {
        nx: (sx / area) / SKIN_W,
        ny: (sy / area) / SKIN_H,
        w: (maxX - minX + 1) / SKIN_W,
        h: (maxY - minY + 1) / SKIN_H,
      };
    }
  }

  if (!best || bestArea < 60) return null;

  const areaN = bestArea / (SKIN_W * SKIN_H);
  const openness = clamp((areaN - 0.015) / 0.10);
  const size = best.w + best.h;
  return {
    palm: { x: best.nx, y: best.ny },
    scale: 0.08 + size * 0.07,
    raw: openness,
    roll: 0,
    tip: { x: best.nx, y: Math.max(0, best.ny - 0.12) },
    isFallback: true,
  };
}

/* =========================================================
   10. 骨架叠加层
   ========================================================= */
const overlay = $('overlay');
const octx = overlay.getContext('2d');

function resizeOverlay() {
  overlay.width  = innerWidth * DPR;
  overlay.height = innerHeight * DPR;
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resizeOverlay();

function drawSkeleton() {
  octx.clearRect(0, 0, innerWidth, innerHeight);
  if (!state.showSkeleton) return;

  const list = state.lastResults && state.lastResults.multiHandLandmarks;
  if (!list || !list.length) return;

  for (let n = 0; n < list.length; n++) {
    const lm = undistortLandmarks(list[n], state.distK);
    const fx = (x) => videoToScreen(state.mirror ? (1 - x) : x, 0).x;
    const fy = (y) => videoToScreen(0, y).y;

    octx.lineWidth = 1.4;
    octx.strokeStyle = 'rgba(255,150,220,0.55)';
    octx.beginPath();
    for (const [a, b] of HAND_CONNECTIONS) {
      octx.moveTo(fx(lm[a].x), fy(lm[a].y));
      octx.lineTo(fx(lm[b].x), fy(lm[b].y));
    }
    octx.stroke();

    for (let i = 0; i < lm.length; i++) {
      const isTip = i === 4 || i === 8 || i === 12 || i === 16 || i === 20;
      octx.fillStyle = isTip ? 'rgba(255,224,138,0.85)' : 'rgba(143,246,255,0.7)';
      octx.beginPath();
      octx.arc(fx(lm[i].x), fy(lm[i].y), isTip ? 3.2 : 1.9, 0, TAU);
      octx.fill();
    }
  }
}

/* =========================================================
   手心焦点标记（与银河系中心严格对齐）
   ========================================================= */
const _proj = new THREE.Vector3();

function drawFocusMarker() {
  if (dyn.opacity < 0.05) return;

  /* 用银河实际的（阻尼后）世界坐标反投影到屏幕 —— 保证与星系核心零误差对齐 */
  _proj.copy(dyn.pos);
  _proj.project(camera);
  if (_proj.z > 1) return;

  const sx = (_proj.x * 0.5 + 0.5) * innerWidth;
  const sy = (-_proj.y * 0.5 + 0.5) * innerHeight;

  const t = state.time;
  const bloom = dyn.bloom;
  const r = (22 + 3 * Math.sin(t * 2.0)) * (0.85 + 0.25 * bloom);

  octx.save();
  octx.translate(sx, sy);

  /* 外圈旋转弧 */
  octx.rotate(t * 0.9);
  octx.lineWidth = 1.8;
  octx.strokeStyle = `rgba(255,196,240,${0.35 + 0.45 * bloom})`;
  octx.shadowColor = 'rgba(255,140,220,0.9)';
  octx.shadowBlur = 10;
  for (let k = 0; k < 3; k++) {
    octx.beginPath();
    octx.arc(0, 0, r, k * (TAU / 3), k * (TAU / 3) + 0.95);
    octx.stroke();
  }

  /* 内圈反向弧 */
  octx.rotate(-t * 2.3);
  octx.lineWidth = 1.3;
  octx.strokeStyle = `rgba(150,220,255,${0.30 + 0.40 * bloom})`;
  octx.shadowColor = 'rgba(120,200,255,0.9)';
  for (let k = 0; k < 2; k++) {
    octx.beginPath();
    octx.arc(0, 0, r * 0.6, k * Math.PI + 0.35, k * Math.PI + 1.55);
    octx.stroke();
  }

  /* 四向刻度 */
  octx.shadowBlur = 0;
  octx.strokeStyle = 'rgba(255,255,255,0.55)';
  octx.lineWidth = 1;
  for (let k = 0; k < 4; k++) {
    const a = k * Math.PI / 2;
    octx.beginPath();
    octx.moveTo(Math.cos(a) * (r + 5), Math.sin(a) * (r + 5));
    octx.lineTo(Math.cos(a) * (r + 12), Math.sin(a) * (r + 12));
    octx.stroke();
  }

  /* 中心点 */
  octx.fillStyle = 'rgba(255,255,255,0.95)';
  octx.shadowColor = 'rgba(255,180,240,1)';
  octx.shadowBlur = 12;
  octx.beginPath();
  octx.arc(0, 0, 2.4, 0, TAU);
  octx.fill();

  octx.restore();
}

/* =========================================================
   11. 银河实例 / 动态状态
   ========================================================= */
let galaxy = null;

function buildGalaxy(count) {
  if (galaxy) {
    scene.remove(galaxy.group);
    galaxy.dispose();
    galaxy = null;
  }
  galaxy = new Galaxy(count);
  galaxy.group.visible = false;
  scene.add(galaxy.group);
}

const dyn = {
  bloom: 0, targetBloom: 0,
  rawOpen: 0,
  opacity: 0, seen: false, lastSeen: -99,
  pos: new THREE.Vector3(), target: new THREE.Vector3(),
  focus: new THREE.Vector3(), focusStrength: 0, targetFocusStrength: 0,
  scale: 1, targetScale: 1, roll: 0,
  handVel: new THREE.Vector3(), handStr: 0, targetHandStr: 0,   // 右手扰动：速度 + 强度
  leftPos: new THREE.Vector3(), leftVel: new THREE.Vector3(), leftStr: 0, targetLeftStr: 0, leftSeen: false,   // 左手拨动场
  pinch: 0.5, spinVel: 0, spinAngle: 0, spinOffset: 0, ripT: new THREE.Vector2(-99, -99), ripSlot: 0, ripAmp: 0, ripCool: -99, ripLast: -99,   // 捏合缩放 / 拨动角动量 / 旋转朝向
  justAppeared: true,
};

/* =========================================================
   12. 每帧更新
   ========================================================= */
const BASE_SIZE = 10;
const _tmp = new THREE.Vector3();
const _prevPos = new THREE.Vector3();   // 上一帧银河中心（扰动速度计算）
const _velRaw = new THREE.Vector3();
const _prevLeft = new THREE.Vector3();  // 上一帧左手掌心（拨动速度计算）

function update(dt, now) {
  let hs = state.hands;
  if (hs.length > 0 && state.skinMode) state.skinMode = false;   // MediaPipe 恢复 → 关闭兜底标记

  /* MediaPipe 无结果时 → 皮肤色块兜底（纯本地；节流 100ms 省 GPU 回读开销） */
  if (hs.length === 0 && state.cameraReady) {
    if (now - state.lastSkinT > 0.1) {
      state.lastSkinT = now;
      state.skinFb = skinFallback();
    }
    const fb = state.skinFb;
    if (fb) {
      hs = [fb];
      if (!state.skinMode) {
        state.skinMode = true;
        setStatus('未检测到手 · 已启用皮肤识别兜底', 'err');
      }
    } else if (state.skinMode) {
      state.skinMode = false;
    }
  }

  /* ---- 双手角色：右手 = 定位 + 捏合缩放；左手 = 旋转 + 拨动（单手时作主控） ---- */
  let ctrl = null, rot = null;
  if (hs.length === 1) {
    ctrl = hs[0];
  } else if (hs.length > 1) {
    ctrl = hs.find(h => h.handed === 'right') || hs[0];
    rot = hs.find(h => h.handed === 'left' && h !== ctrl) || hs.find(h => h !== ctrl) || null;
  }

  /* ---- 左手：旋转（手掌转角）+ 拨动（甩动 → 角动量 + 搅动场） ---- */
  if (rot) {
    videoToWorld(rot.palm.x, rot.palm.y, _tmp);
    _tmp.z = 0.35;
    if (!dyn.leftSeen) { dyn.leftPos.copy(_tmp); _prevLeft.copy(_tmp); }   // 首帧吸附，防速度尖峰
    dyn.leftPos.lerp(_tmp, 1 - Math.exp(-14 * dt));
    _velRaw.set(
      (dyn.leftPos.x - _prevLeft.x) / Math.max(dt, 1e-3),
      (dyn.leftPos.y - _prevLeft.y) / Math.max(dt, 1e-3),
      0
    );
    _prevLeft.copy(dyn.leftPos);
    dyn.leftVel.lerp(_velRaw, 1 - Math.exp(-8 * dt));
    if (dyn.leftVel.length() > 1.8) dyn.leftVel.setLength(1.8);

    dyn.spinVel += dyn.leftVel.x * 3.6 * dt;   // 拨动：横向甩动注入角动量
    dyn.spinOffset = dampAngle(dyn.spinOffset, clamp(-rot.roll, -1.25, 1.25), 3.5, dt);   // 旋转：跟随手掌转角
    dyn.targetLeftStr = 0.22 + 0.80 * clamp(dyn.leftVel.length() / 1.8);
    dyn.leftSeen = true;

    /* 左手拨动 → 触发水波纹（双槽交替） */
    const lspd2 = dyn.leftVel.length();
    if (lspd2 > 0.7 && now - dyn.ripCool > 0.45) {
      dyn.ripCool = now;
      dyn.ripT.setComponent(dyn.ripSlot, now);
      dyn.ripSlot ^= 1;
      dyn.ripAmp = clamp(0.55 + lspd2 * 0.45, 0.55, 1.3);
    }
  } else {
    dyn.leftSeen = false;
    dyn.targetLeftStr = 0;
    dyn.leftVel.multiplyScalar(Math.exp(-5 * dt));
  }
  dyn.leftStr = damp(dyn.leftStr, dyn.targetLeftStr, 4, dt);
  dyn.spinVel = damp(dyn.spinVel, 0, 1.05, dt);   // 角动量自然衰减
  dyn.spinVel = clamp(dyn.spinVel, -7, 7);
  dyn.spinAngle += dyn.spinVel * dt;
  if (Math.abs(dyn.spinAngle) > 628) dyn.spinAngle %= TAU;

  /* 环境波纹：定期泛出柔和波纹 */
  if (now - dyn.ripLast > 5.0 && now - dyn.ripT.x > 1.5 && now - dyn.ripT.y > 1.5) {
    dyn.ripLast = now;
    dyn.ripT.setComponent(dyn.ripSlot, now);
    dyn.ripSlot ^= 1;
    dyn.ripAmp = 0.35;
  }

  if (ctrl) {
    videoToWorld(ctrl.palm.x, ctrl.palm.y, dyn.target);
    dyn.target.z = clamp((ctrl.scale - 0.09) * 5, -1, 1);

    dyn.rawOpen += (ctrl.raw - dyn.rawOpen) * (ctrl.raw > dyn.rawOpen ? 0.4 : 0.2);

    const sens = state.sensitivity;
    const lo = clamp(0.30 - 0.10 * (sens - 1), 0.08, 0.5);
    const hi = clamp(0.70 - 0.08 * (sens - 1), 0.45, 0.9);
    dyn.targetBloom = smoothstep(lo, hi, dyn.rawOpen);

    /* 收缩放大：拇指-食指捏合距离 → 银河尺寸 */
    if (ctrl.pinch != null) {
      dyn.pinch = damp(dyn.pinch, clamp((ctrl.pinch - 0.55) / 0.85), 9, dt);
      dyn.targetScale = baseScale * (0.60 + 1.20 * dyn.pinch);
    } else {
      dyn.targetScale = baseScale;
    }
    dyn.roll = clamp(ctrl.roll * 0.22, -0.5, 0.5);

    videoToWorld(ctrl.tip.x, ctrl.tip.y, _tmp);
    dyn.focus.set(_tmp.x, _tmp.y, 0.5);
    dyn.targetFocusStrength = 0.6;

    if (!dyn.seen) dyn.justAppeared = true;
    dyn.seen = true;
    dyn.lastSeen = now;

  } else {
    if (dyn.seen && now - dyn.lastSeen > 0.3) {
      dyn.seen = false;
      dyn.targetBloom = 0;
      dyn.targetFocusStrength = 0;
    }

    const idle = now - state.pointer.lastMove;

    if (state.pointer.active) {
      dyn.target.set(
        clamp(state.pointer.x - 0.5, -0.45, 0.45) * 2 * halfW,
        clamp(0.5 - state.pointer.y, -0.45, 0.45) * 2 * halfH,
        0
      );
      dyn.targetBloom = state.pointer.down ? 1 : 0.12;
      dyn.targetScale = baseScale;
      dyn.roll = 0;
      dyn.focus.set(dyn.target.x, dyn.target.y + 0.1, 0.5);
      dyn.targetFocusStrength = 0.45;
      dyn.seen = true;
      dyn.lastSeen = now;

    } else if (state.autoDemo && idle > 1.0) {
      dyn.targetBloom = 0.5 + 0.5 * Math.sin(now * 0.36);
      dyn.target.set(Math.sin(now * 0.29) * 0.9, Math.cos(now * 0.23) * 0.42, 0);
      dyn.targetScale = baseScale;
      dyn.roll = 0;
      dyn.targetFocusStrength = 0;
      dyn.seen = true;
      dyn.lastSeen = now;

    } else {
      dyn.targetBloom = 0;
      dyn.targetFocusStrength = 0;
      dyn.seen = false;
    }
  }

  /* ---- 阻尼 ---- */
  dyn.bloom = damp(dyn.bloom, dyn.targetBloom, 8, dt);
  dyn.scale = damp(dyn.scale, dyn.targetScale, 6, dt);
  dyn.focusStrength = damp(dyn.focusStrength, dyn.targetFocusStrength, 6, dt);
  dyn.opacity = damp(dyn.opacity, dyn.seen ? 1 : 0, dyn.seen ? 8 : 3, dt);

  if (dyn.justAppeared) {
    dyn.pos.copy(dyn.target);
    dyn.justAppeared = false;
    _prevPos.copy(dyn.pos);   // 防止瞬移产生速度尖峰
  } else {
    dyn.pos.lerp(dyn.target, 1 - Math.exp(-11 * dt));
  }

  /* ---- 手的扰动：掌心（银河中心）移动速度 → 搅动强度 ---- */
  _velRaw.set(
    (dyn.pos.x - _prevPos.x) / Math.max(dt, 1e-3),
    (dyn.pos.y - _prevPos.y) / Math.max(dt, 1e-3),
    0
  );
  _prevPos.copy(dyn.pos);
  const spd = Math.min(_velRaw.length(), 1.8);
  dyn.handVel.lerp(_velRaw, 1 - Math.exp(-7 * dt));
  if (dyn.handVel.length() > 1.8) dyn.handVel.setLength(1.8);
  dyn.targetHandStr = (dyn.seen ? 1 : 0) * (0.22 + 0.75 * clamp(spd / 1.8));
  dyn.handStr = damp(dyn.handStr, dyn.targetHandStr, 3.5, dt);

  /* ---- 数值安全网：任何一项异常都不至于让银河消失 ---- */
  if (!isFinite(dyn.bloom)) dyn.bloom = 0;
  if (!isFinite(dyn.opacity)) dyn.opacity = 0;
  if (!isFinite(dyn.rawOpen)) dyn.rawOpen = 0;
  if (!isFinite(dyn.scale) || dyn.scale <= 0.01) dyn.scale = baseScale;
  if (!isFinite(dyn.pinch)) dyn.pinch = 0.5;
  if (!isFinite(dyn.spinOffset)) dyn.spinOffset = 0;
  if (!isFinite(dyn.spinAngle)) dyn.spinAngle = 0;
  if (!isFinite(dyn.handStr)) dyn.handStr = 0;
  if (!isFinite(dyn.leftStr)) dyn.leftStr = 0;
  if (!isFinite(dyn.focusStrength)) dyn.focusStrength = 0;
  if (!isFinite(dyn.focus.x + dyn.focus.y)) dyn.focus.set(0, 0, 0.5);
  if (!isFinite(dyn.pos.x + dyn.pos.y + dyn.pos.z)) dyn.pos.set(0, 0, 0);
  if (!isFinite(dyn.target.x + dyn.target.y + dyn.target.z)) dyn.target.set(0, 0, 0);
  if (!isFinite(dyn.handVel.x + dyn.handVel.y)) dyn.handVel.set(0, 0, 0);
  if (!isFinite(dyn.leftVel.x + dyn.leftVel.y)) dyn.leftVel.set(0, 0, 0);

  if (galaxy) {
    const g = galaxy.group;
    g.position.copy(dyn.pos);
    g.scale.setScalar(dyn.scale);

    /* 3D 倾角 + 缓慢摆动 */
    const tiltRad = (Number($('s-tilt').value) * Math.PI) / 180;
    g.rotation.x = damp(g.rotation.x, tiltRad + 0.05 * Math.sin(now * 0.16), 1.6, dt);
    g.rotation.z = dyn.spinOffset + dyn.spinAngle;   // 左手旋转 / 拨动
    g.visible = dyn.opacity > 0.008;

    const u = galaxy.uniforms;
    u.uTime.value = now;
    u.uBloom.value = dyn.bloom;
    u.uOpacity.value = dyn.opacity;
    u.uFocus.value.copy(dyn.focus);
    u.uFocusStrength.value = dyn.focusStrength * (0.35 + 0.65 * dyn.bloom);
    u.uFocusRadius.value = 1.5;
    u.uHand.value.copy(dyn.pos);
    u.uHandVel.value.copy(dyn.handVel);
    u.uHandStr.value = dyn.handStr * (0.4 + 0.6 * dyn.bloom);
    u.uHand2.value.copy(dyn.leftPos);
    u.uHand2Vel.value.copy(dyn.leftVel);
    u.uHand2Str.value = dyn.leftStr;
    u.uRipples.value.copy(dyn.ripT);
    u.uRippleAmp.value = dyn.ripAmp;
    u.uSize.value = BASE_SIZE * Number($('s-size').value);
    u.uPixelRatio.value = DPR;
    u.uSpin.value = Number($('s-spin').value);

    for (const sp of galaxy.sprites) {
      const ud = sp.userData;
      sp.material.rotation = ud.rot + now * (0.02 + ud.phase * 0.012);
      const pulse = 1 + 0.07 * Math.sin(now * 0.6 + ud.phase * 3);
      sp.scale.set(ud.base * pulse, ud.base * pulse, 1);
      sp.material.opacity = ud.op * (0.15 + 0.85 * dyn.bloom);
    }

    const corePulse = 0.9 + 0.1 * Math.sin(now * 1.4);
    galaxy.coreGlow.material.opacity = (0.30 + 0.70 * dyn.bloom) * corePulse;
    galaxy.coreGlow.scale.setScalar((1.8 + 0.3 * dyn.bloom) * corePulse);
  }

  state.bloomValue = dyn.bloom;
}

/* =========================================================
   13. 主循环
   ========================================================= */
const clock = new THREE.Clock();
let fpsAcc = 0, fpsFrames = 0, hudTimer = 0;

function animate() {
  requestAnimationFrame(animate);

  const rawDt = clock.getDelta();          // 真实帧间隔（用于 FPS 统计）
  const dt = Math.min(rawDt, 0.05);        // 仿真步长（限幅防跳变）
  state.time += dt;
  const now = state.time;

  update(dt, now);

  if (bgFlowMat) bgFlowMat.uniforms.uTime.value = now;

  /* 背景星云漂移 + 远星系自转 */
  for (const sp of bgClouds) {
    sp.position.x += sp.userData.drift.x * dt;
    sp.position.y += sp.userData.drift.y * dt;
    const pulse = 1 + 0.08 * Math.sin(now * 0.4 + sp.userData.phase);
    sp.scale.setScalar(sp.userData.base * pulse);
  }
  for (const sp of bgGalaxies) {
    sp.material.rotation = sp.userData.rot + now * 0.02;
  }

  renderer.render(scene, camera);

  drawSkeleton();
  drawFocusMarker();

  fpsAcc += rawDt; fpsFrames++; hudTimer += rawDt;
  if (hudTimer > 0.3) {
    hudTimer = 0;
    const fps = fpsFrames / Math.max(fpsAcc, 1e-4);
    fpsAcc = 0; fpsFrames = 0;

    const n = galaxy ? galaxy.count : 0;
    $('stats').textContent =
      `${fps.toFixed(0)} fps · ${state.hands.length} hand · ${(n / 1000).toFixed(0)}k pts`;

    const pct = Math.round(state.bloomValue * 100);
    $('bloom-bar').style.width = pct + '%';
    $('bloom-val').textContent = pct + '%';

    /* ---- 手部检测看门狗：无结果 → 切换模型源 / 给出指引 ---- */
    if (state.cameraReady) {
      const noHandFor = now - state.lastResultTime;
      if (state.hands.length > 0) {
        if ($('hint').textContent.indexOf('握拳') < 0) {
          $('hint').textContent = '右手移动/捏合缩放 · 左手旋转/拨动 · 握拳坍缩 · 张掌绽放';
        }
      } else if (noHandFor > 10 && !frameBusy) {
        /* 不打断正在加载/推理中的实例（避免 MediaPipe 内部竞态崩溃） */
        if (!state.mpEverWorked && mpBaseIdx < MP_BASES.length - 1) {
          /* 只有「模型从未产出过任何结果」才视为资源源问题 → 切换下一个源 */
          mpBaseIdx++;
          console.warn('[mp] 当前 CDN 源无结果，切换 →', MP_BASES[mpBaseIdx]);
          initHands();
          state.lastResultTime = now;
          setStatus('正在切换模型资源源重试…');
        } else {
          /* 模型正常、只是画面里暂时没手（或所有源都试过）→ 只提示，绝不切换，避免打断识别 */
          const tip = state.facingMode === 'environment'
            ? '未检测到手：请把手放到手机背面镜头前，或点「切换摄像头」'
            : '未检测到手：请把手放进画面';
          if ($('hint').textContent !== tip) $('hint').textContent = tip;
          if (!state.mpEverWorked) setStatus('模型资源均不可达 · 可尝试皮肤兜底或鼠标操作', 'err');
        }
      }

      /* ---- 管线诊断 ---- */
      const mpState = typeof window.Hands === 'undefined' ? '未载入' : (state.mpEverWorked ? 'OK' : '无结果');
      const handTag = state.hands.length
        ? '(' + state.hands.map(h => h.handed === 'left' ? '左' : h.handed === 'right' ? '右' : '?').join('') + ')'
        : '';
      $('diag').textContent =
        `MP:${mpState} · CAM:${state.cameraReady ? (state.facingMode === 'environment' ? '后置' : '前置') : '未开'} · 手:${state.hands.length}${handTag} · 源:${mpBaseIdx + 1}/${MP_BASES.length}${state.skinMode ? ' · 皮肤兜底' : ''}`;
    }
  }
}

/* =========================================================
   14. 鼠标 / 触摸兜底
   ========================================================= */
function ptr(e) {
  const t = e.touches ? e.touches[0] : e;
  return { x: clamp(t.clientX / innerWidth), y: clamp(t.clientY / innerHeight) };
}

addEventListener('pointermove', (e) => {
  if (state.hands.length > 0) return;
  const p = ptr(e);
  state.pointer.x = p.x;
  state.pointer.y = p.y;
  state.pointer.active = true;
  state.pointer.lastMove = state.time;
}, { passive: true });

addEventListener('pointerdown', (e) => {
  if (e.target.closest('.fab, .panel, .cam-retry')) return;
  const p = ptr(e);
  state.pointer.x = p.x;
  state.pointer.y = p.y;
  state.pointer.active = true;
  state.pointer.down = true;
  state.pointer.lastMove = state.time;
}, { passive: true });

addEventListener('pointerup', () => {
  state.pointer.down = false;
  state.pointer.lastMove = state.time;
}, { passive: true });

addEventListener('pointercancel', () => { state.pointer.down = false; }, { passive: true });

/* =========================================================
   15. 控制面板
   ========================================================= */
const panel = $('panel');
$('btn-panel').addEventListener('click', () => panel.classList.toggle('hidden'));
$('btn-close').addEventListener('click', () => panel.classList.add('hidden'));

$('s-count').value = String(DEFAULT_COUNT);
$('v-count').textContent = (DEFAULT_COUNT / 1000).toFixed(0) + 'k';

$('s-count').addEventListener('input', (e) => {
  $('v-count').textContent = (Number(e.target.value) / 1000).toFixed(0) + 'k';
});
$('s-count').addEventListener('change', (e) => {
  const n = Number(e.target.value);
  $('loading').style.display = '';
  $('loading').classList.remove('done');
  setTimeout(() => {
    buildGalaxy(n);
    $('loading').classList.add('done');
    setTimeout(() => { $('loading').style.display = 'none'; }, 500);
  }, 30);
});

$('s-size').addEventListener('input', (e) => {
  $('v-size').textContent = Number(e.target.value).toFixed(2);
});

$('s-sens').addEventListener('input', (e) => {
  state.sensitivity = Number(e.target.value);
  $('v-sens').textContent = state.sensitivity.toFixed(2);
});

$('s-spin').addEventListener('input', (e) => {
  $('v-spin').textContent = Number(e.target.value).toFixed(2);
});

$('s-tilt').addEventListener('input', (e) => {
  $('v-tilt').textContent = Number(e.target.value).toFixed(0) + '°';
});

$('s-dist').addEventListener('input', (e) => {
  state.distK = Number(e.target.value);
  $('v-dist').textContent = state.distK.toFixed(2);
});

$('s-bright').addEventListener('input', (e) => {
  $('v-bright').textContent = Number(e.target.value).toFixed(2);
  setBrightness(Number(e.target.value));
});

$('s-auto').addEventListener('change', (e) => { state.autoDemo = e.target.checked; });

$('s-skel').addEventListener('change', (e) => { state.showSkeleton = e.target.checked; });

$('s-mirror').addEventListener('change', (e) => {
  state.mirror = e.target.checked;
  applyMirror();
});

/* ---- 重试摄像头 ---- */
$('btn-cam').addEventListener('click', async () => {
  $('btn-cam').classList.add('hidden');
  setStatus('正在重试摄像头…');
  try {
    await startTracking();
    const name = state.facingMode === 'environment' ? '后置摄像头' : '前置摄像头';
    setStatus(`已就绪 · ${name} · 银河跟随手掌`, 'ok');
    $('hint').textContent = '右手移动/捏合缩放 · 左手旋转/拨动 · 握拳坍缩 · 张掌绽放';
  } catch (err) {
    console.warn('[tracking]', err);
    setStatus(err && err.message ? err.message : '摄像头启动失败', 'err');
    $('btn-cam').classList.remove('hidden');
  }
});

/* ---- 切换前后摄像头 ---- */
$('btn-flip').addEventListener('click', async () => {
  $('btn-flip').classList.add('hidden');
  state.targetFacing = state.facingMode === 'environment' ? 'user' : 'environment';
  setStatus('正在切换摄像头…');
  try {
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    camStream = null;
    state.cameraReady = false;
    await acquireCamera();
    const name = state.facingMode === 'environment' ? '后置摄像头' : '前置摄像头';
    setStatus(`已就绪 · ${name} · 银河跟随手掌`, 'ok');
  } catch (err) {
    setStatus(err && err.message ? err.message : '摄像头切换失败', 'err');
  }
  $('btn-flip').classList.remove('hidden');
});

/* =========================================================
   16. 自适应
   ========================================================= */
function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  updateViewport();
  renderer.setSize(w, h, false);
  resizeOverlay();
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 150));

/* =========================================================
   17. 启动
   ========================================================= */
/* ---- GPU 上下文丢失自动恢复（移动端高负载保护） ---- */
canvas.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  setStatus('GPU 上下文丢失 · 等待自动恢复…', 'err');
}, false);
canvas.addEventListener('webglcontextrestored', () => {
  setStatus('GPU 已恢复', 'ok');
  buildGalaxy(galaxy ? galaxy.count : DEFAULT_COUNT);
}, false);

/* ---- 着色器编译错误上屏（排查「粒子消失」用） ---- */
renderer.debug.onShaderError = (gl, program, vs, fs) => {
  const vlog = (gl.getShaderInfoLog(vs) || '').trim();
  const flog = (gl.getShaderInfoLog(fs) || '').trim();
  const log = (vlog || flog || gl.getProgramInfoLog(program) || '未知错误').slice(0, 90);
  window.__SHADER_ERR = log;
  setStatus('着色器编译失败：' + log, 'err');
  console.error('[shader] VS:', vlog, '| FS:', flog);
};

/* ---- 调试探针：供自动化检查粒子系统状态 ---- */
window.__DBG = () => {
  const info = renderer.info && renderer.info.render ? renderer.info.render : {};
  return {
    points: info.points || 0, calls: info.calls || 0,
    galaxyCount: galaxy ? galaxy.count : null,
    gVisible: galaxy ? galaxy.group.visible : null,
    opacity: +dyn.opacity.toFixed(3), scale: +dyn.scale.toFixed(3), bloom: +dyn.bloom.toFixed(3),
    seen: dyn.seen,
    pos: [+dyn.pos.x.toFixed(2), +dyn.pos.y.toFixed(2), +dyn.pos.z.toFixed(2)],
    rotZ: +(dyn.spinOffset + dyn.spinAngle).toFixed(2), rip: [+dyn.ripT.x.toFixed(1), +dyn.ripT.y.toFixed(1), +dyn.ripAmp.toFixed(2)],
    handStr: +dyn.handStr.toFixed(2), leftStr: +dyn.leftStr.toFixed(2),
    shaderErr: window.__SHADER_ERR || null,
    mp: { everWorked: state.mpEverWorked, base: mpBaseIdx + 1, busy: frameBusy, hands: state.hands.length, skin: state.skinMode },
  };
};

(function boot() {
  $('loading').classList.remove('done');
  /* 启动时覆盖提示文案（兜底 HTML 初始文本） */
  $('hint').textContent = '右手移动/捏合缩放 · 左手旋转/拨动 · 握拳坍缩 · 张掌绽放';

  if (!SUPPORTS_SCREEN) {
    videoEl.style.display = 'none';
  }

  setTimeout(() => {
    buildGalaxy(DEFAULT_COUNT);
    $('loading').classList.add('done');
    setTimeout(() => { $('loading').style.display = 'none'; }, 600);

    animate();

    setStatus('正在请求后置摄像头…');
    startTracking()
      .then(() => {
        const name = state.facingMode === 'environment' ? '后置摄像头' : '前置摄像头';
        setStatus(`已就绪 · ${name} · 银河跟随手掌`, 'ok');
        $('hint').textContent = '右手移动/捏合缩放 · 左手旋转/拨动 · 握拳坍缩 · 张掌绽放';
      })
      .catch((err) => {
        console.warn('[tracking] 初始化失败：', err);
        setStatus(err && err.message ? err.message : '摄像头不可用 · 已切换到鼠标模式', 'err');
        $('hint').textContent = '移动鼠标控制银河 · 按住左键让它绽放';
        $('btn-cam').classList.remove('hidden');
      });

    setTimeout(() => {
      if (!state.lastResults) {
        setStatus('未检测到手 · 可点「切换摄像头」或鼠标操作', 'err');
        $('hint').textContent = '后置摄像头在手机背面：把手放到镜头前 · 或点「切换摄像头」';
      }
    }, 10000);
  }, 40);
})();
</script>
</body>
