  videoEl.style.filter = `brightness(${v}) saturate(1.25) contrast(1.02)`;
}
setBrightness(state.bright);

async function acquireCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const err = new Error('当前环境不支持摄像头（请通过 localhost / HTTPS 打开）');
    err.name = 'Unsupported';
    throw err;
  }

  const want = state.targetFacing || 'environment';
  const attempts = [
    { video: { facingMode: { ideal: want }, width: { ideal: MOBILE ? 640 : 1280 }, height: { ideal: MOBILE ? 480 : 720 } } },
    { video: { facingMode: { ideal: want } } },
    { video: { width: { ideal: MOBILE ? 640 : 1280 }, height: { ideal: MOBILE ? 480 : 720 } } },
    { video: true },
    { video: { facingMode: { ideal: want === 'environment' ? 'user' : 'environment' } } },
  ];

  let lastErr = null;
  for (const a of attempts) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: a.video });
      camStream = stream;

      let fm = 'environment';
      try {
        const s = stream.getVideoTracks()[0] && stream.getVideoTracks()[0].getSettings();
        if (s && (s.facingMode === 'user' || s.facingMode === 'environment')) fm = s.facingMode;
      } catch (e) {}

      state.facingMode = fm;
      state.mirror = (fm === 'user');
      applyMirror();

      videoEl.srcObject = stream;
      try { await videoEl.play(); } catch (e) { /* 播放失败不致命 */ }
      state.cameraReady = true;
      state.lastResultTime = state.time;   // 重置检测看门狗
      $('btn-flip').classList.remove('hidden');
      return;
    } catch (err) {
      lastErr = err;
      try { camStream && camStream.getTracks().forEach(t => t.stop()); } catch (_) {}
      camStream = null;
    }
  }

  lastErr = lastErr || new Error('摄像头启动失败');
  if (lastErr.name === 'NotAllowedError' || lastErr.name === 'SecurityError') {
    lastErr.message = '摄像头权限被拒绝：请在浏览器设置中允许本站使用摄像头，然后点「重试摄像头」';
  } else if (lastErr.name === 'NotFoundError' || lastErr.name === 'DevicesNotFoundError') {
    lastErr.message = '未找到摄像头设备';
  } else if (lastErr.name === 'NotReadableError' || lastErr.name === 'TrackStartError') {
    lastErr.message = '摄像头被其他应用占用，请关闭后重试';
  }
  throw lastErr;
}

function initHands() {
  const gen = ++mpGen;
  if (hands) { try { hands.close(); } catch (e) {} }
  /* 关键修复：close() 会让在途 send() 永久挂起 → 强制解绑，防止 frameBusy 卡死 */
  sendSeq++;
  frameBusy = false;
  mpStalls = 0;
  try {
    hands = new window.Hands({
      locateFile: (file) => `${MP_BASES[mpBaseIdx]}/${file}`,
    });
  } catch (e) {
    console.warn('[mp] Hands 实例创建失败：', e);
    hands = null;
    return;
  }
  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 0,          // 轻量模型：加载更快、推理更流畅（移动端更稳）
    minDetectionConfidence: 0.5, // 降低阈值，更容易检测到
    minTrackingConfidence: 0.5,
    selfieMode: false,
  });
  hands.onResults((results) => {
    if (gen === mpGen) {
      state.lastResultTime = state.time;
      onResults(results);
    }
  });
}

function startFrameLoop() {
  if (loopStarted) return;
  loopStarted = true;
  const loop = async () => {
    requestAnimationFrame(loop);
    if (!hands) return;

    const now = state.time;
    if (frameBusy) {
      /* 卡死保护：send() 长时间不返回（实例被 close 时可能永久挂起）→ 强制恢复 */
      const limit = state.mpEverWorked ? 8 : 14;   // 模型未就绪时可能是正常下载，给足时间
      if (now - sendStartedAt > limit) {
        console.warn('[mp] send() 卡死超时，强制恢复帧循环');
        sendSeq++;               // 作废挂起的那次 send
        frameBusy = false;
        if (++mpStalls >= 2 || (!state.mpEverWorked && now - state.lastResultTime > 9)) {   // 连续两次卡死 → 重建实例
          if (!state.mpEverWorked && mpBaseIdx < MP_BASES.length - 1) mpBaseIdx++;
          initHands();
          state.lastResultTime = now;
        }
      }
      return;
    }

    if (!videoEl.videoWidth || videoEl.readyState < 2) return;
    /* CPU/GPU 并行：渲染帧率低时自动降低推理频率，避免 CPU 推理与 GPU 渲染互相饿死 */
    const mpGap = (state.fpsNow || 60) < 22 ? 0.05 : 0.033;
    if (now - lastSendAt < mpGap) return;

    frameBusy = true;
    sendStartedAt = now;
    lastSendAt = now;
    const seq = ++sendSeq;
    try {
      await hands.send({ image: videoEl });
      if (seq === sendSeq) { sendErrors = 0; mpStalls = 0; }
    } catch (e) {
      if (seq === sendSeq && ++sendErrors > 60) {
        sendErrors = 0;
        console.warn('[mp] 模型推理连续失败：', e);
      }
    }
    if (seq === sendSeq) frameBusy = false;   // 换源后由新代次接管，旧 Promise 不再干扰
  };
  loop();
}

async function startTracking() {
  if (typeof window.Hands === 'undefined') {
    /* 等待多 CDN 加载器完成 */
    if (window.__MP && window.__MP.promise) {
      try { await window.__MP.promise; } catch (e) {}
    }
    if (typeof window.Hands === 'undefined') {
      throw new Error('MediaPipe 脚本加载失败（网络无法访问 CDN）');
    }
  }
  initHands();   // 每次重试都重建实例：顺带复位 frameBusy / sendSeq，等于完整重启识别管线
  await acquireCamera();
  startFrameLoop();
}

function onResults(results) {
  state.lastResults = results;
  if (!state.mpEverWorked) setStatus('识别就绪 · 把手放进画面即可交互', 'ok');
  state.mpEverWorked = true;
  const list = results.multiHandLandmarks || [];

  const handedness = results.multiHandedness || [];
  state.hands = [];
  for (let n = 0; n < list.length; n++) {
    const lm = undistortLandmarks(list[n], state.distK);
    const info = analyzeHand(lm);
    info.lm = lm;
    /* MediaPipe 假设输入为镜像画面；我们喂的是原始画面 → 左右标签互换 */
    const rawL = handedness[n] && handedness[n].label ? handedness[n].label.toLowerCase() : '';
    info.handed = rawL === 'left' ? 'right' : (rawL === 'right' ? 'left' : '');

    /* 手部坐标平滑（指数滤波）+ 深度估计（手掌尺寸近似深度） */
    state.handSm = state.handSm || {};
    const key = info.handed || ('i' + n);
    let sm = state.handSm[key];
    if (!sm) {
      sm = state.handSm[key] = { px: info.palm.x, py: info.palm.y, tx: info.tip.x, ty: info.tip.y, sc: info.scale, rw: info.raw, pn: info.pinch == null ? 0.8 : info.pinch, rl: info.roll };
    }
    const sk = 0.38;
    sm.px += (info.palm.x - sm.px) * sk; sm.py += (info.palm.y - sm.py) * sk;
    sm.tx += (info.tip.x - sm.tx) * sk;   sm.ty += (info.tip.y - sm.ty) * sk;
    sm.sc += (info.scale - sm.sc) * sk;
    sm.rw += (info.raw - sm.rw) * sk;
    sm.rl += (info.roll - sm.rl) * sk;
    if (info.pinch != null) sm.pn += (info.pinch - sm.pn) * sk;
    info.palm.x = sm.px; info.palm.y = sm.py;
    info.tip = { x: sm.tx, y: sm.ty };
    info.scale = sm.sc; info.raw = sm.rw; info.roll = sm.rl;
    if (info.pinch != null) info.pinch = sm.pn;
    info.depth = clamp((sm.sc - 0.09) * 5, -1, 1);   /* 手掌越大 → 越近 */
    state.hands.push(info);
  }
}

/* =========================================================
   9.5 皮肤色块兜底识别（零依赖、纯本地，MediaPipe 全挂时保底）
   ========================================================= */
const SKIN_W = 160, SKIN_H = 120;
const skinCanvas = document.createElement('canvas');
skinCanvas.width = SKIN_W; skinCanvas.height = SKIN_H;
const sctx = skinCanvas.getContext('2d', { willReadFrequently: true });
const skinMask = new Uint8Array(SKIN_W * SKIN_H);
const skinSeen = new Uint8Array(SKIN_W * SKIN_H);
const skinQueue = new Int32Array(SKIN_W * SKIN_H);

function skinFallback() {
  if (!videoEl.videoWidth || videoEl.readyState < 2) return null;
  try { sctx.drawImage(videoEl, 0, 0, SKIN_W, SKIN_H); } catch (e) { return null; }
  const data = sctx.getImageData(0, 0, SKIN_W, SKIN_H).data;

  /* YCbCr 肤色阈值 */
  let count = 0;
  for (let i = 0; i < SKIN_W * SKIN_H; i++) {
    const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2];
    const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
    const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
    const y = 0.299 * r + 0.587 * g + 0.114 * b;
    const isSkin = y > 45 && cb >= 75 && cb <= 130 && cr >= 130 && cr <= 178;
    skinMask[i] = isSkin ? 1 : 0;
    if (isSkin) count++;
  }
  if (count < SKIN_W * SKIN_H * 0.003) return null;

  /* BFS 找最大连通域 */
  skinSeen.fill(0);
  let best = null, bestArea = 0;

  for (let i = 0; i < SKIN_W * SKIN_H; i++) {
    if (!skinMask[i] || skinSeen[i]) continue;
    let head = 0, tail = 0, area = 0, sx = 0, sy = 0;
    let minX = SKIN_W, maxX = 0, minY = SKIN_H, maxY = 0;
    skinQueue[tail++] = i; skinSeen[i] = 1;
    while (head < tail) {
      const p = skinQueue[head++];
      const px = p % SKIN_W, py = (p / SKIN_W) | 0;
      area++; sx += px; sy += py;
      if (px < minX) minX = px;
      if (px > maxX) maxX = px;
      if (py < minY) minY = py;
      if (py > maxY) maxY = py;
      if (px > 0 && skinMask[p - 1] && !skinSeen[p - 1]) { skinSeen[p - 1] = 1; skinQueue[tail++] = p - 1; }
      if (px < SKIN_W - 1 && skinMask[p + 1] && !skinSeen[p + 1]) { skinSeen[p + 1] = 1; skinQueue[tail++] = p + 1; }
      if (py > 0 && skinMask[p - SKIN_W] && !skinSeen[p - SKIN_W]) { skinSeen[p - SKIN_W] = 1; skinQueue[tail++] = p - SKIN_W; }
      if (py < SKIN_H - 1 && skinMask[p + SKIN_W] && !skinSeen[p + SKIN_W]) { skinSeen[p + SKIN_W] = 1; skinQueue[tail++] = p + SKIN_W; }
    }
    if (area > bestArea) {
      bestArea = area;
      best = {
        nx: (sx / area) / SKIN_W,
        ny: (sy / area) / SKIN_H,
        w: (maxX - minX + 1) / SKIN_W,
        h: (maxY - minY + 1) / SKIN_H,
      };
    }
  }

  if (!best || bestArea < 60) return null;

  const areaN = bestArea / (SKIN_W * SKIN_H);
  const openness = clamp((areaN - 0.015) / 0.10);
  const size = best.w + best.h;
  return {
    palm: { x: best.nx, y: best.ny },
    scale: 0.08 + size * 0.07,
    raw: openness,
    roll: 0,
    tip: { x: best.nx, y: Math.max(0, best.ny - 0.12) },
    isFallback: true,
  };
}

/* =========================================================
   10. 骨架叠加层
   ========================================================= */
const overlay = $('overlay');
const octx = overlay.getContext('2d');

function resizeOverlay() {
  overlay.width  = innerWidth * DPR;
  overlay.height = innerHeight * DPR;
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resizeOverlay();

function drawSkeleton() {
  octx.clearRect(0, 0, innerWidth, innerHeight);
  if (!state.showSkeleton) return;

  const list = state.lastResults && state.lastResults.multiHandLandmarks;
  if (!list || !list.length) return;

  for (let n = 0; n < list.length; n++) {
    const lm = undistortLandmarks(list[n], state.distK);
    const fx = (x) => videoToScreen(state.mirror ? (1 - x) : x, 0).x;
    const fy = (y) => videoToScreen(0, y).y;

    octx.lineWidth = 1.4;
    octx.strokeStyle = 'rgba(255,150,220,0.55)';
    octx.beginPath();
    for (const [a, b] of HAND_CONNECTIONS) {
      octx.moveTo(fx(lm[a].x), fy(lm[a].y));
      octx.lineTo(fx(lm[b].x), fy(lm[b].y));
    }
    octx.stroke();

    for (let i = 0; i < lm.length; i++) {
      const isTip = i === 4 || i === 8 || i === 12 || i === 16 || i === 20;
      octx.fillStyle = isTip ? 'rgba(255,224,138,0.85)' : 'rgba(143,246,255,0.7)';
      octx.beginPath();
      octx.arc(fx(lm[i].x), fy(lm[i].y), isTip ? 3.2 : 1.9, 0, TAU);
      octx.fill();
    }
  }
}

/* =========================================================
   手心焦点标记（与银河系中心严格对齐）
   ========================================================= */
const _proj = new THREE.Vector3();

function drawFocusMarker() {
  if (dyn.opacity < 0.05) return;

  /* 用银河实际的（阻尼后）世界坐标反投影到屏幕 —— 保证与星系核心零误差对齐 */
  _proj.copy(dyn.pos);
  _proj.project(camera);
  if (_proj.z > 1) return;

  const sx = (_proj.x * 0.5 + 0.5) * innerWidth;
  const sy = (-_proj.y * 0.5 + 0.5) * innerHeight;

  const t = state.time;
  const bloom = dyn.bloom;
  const r = (22 + 3 * Math.sin(t * 2.0)) * (0.85 + 0.25 * bloom);

  octx.save();
  octx.translate(sx, sy);

  /* 外圈旋转弧 */
  octx.rotate(t * 0.9);
  octx.lineWidth = 1.8;
  octx.strokeStyle = `rgba(255,196,240,${0.35 + 0.45 * bloom})`;
  octx.shadowColor = 'rgba(255,140,220,0.9)';
  octx.shadowBlur = 10;
  for (let k = 0; k < 3; k++) {
    octx.beginPath();
    octx.arc(0, 0, r, k * (TAU / 3), k * (TAU / 3) + 0.95);
    octx.stroke();
  }

  /* 内圈反向弧 */
  octx.rotate(-t * 2.3);
  octx.lineWidth = 1.3;
  octx.strokeStyle = `rgba(150,220,255,${0.30 + 0.40 * bloom})`;
  octx.shadowColor = 'rgba(120,200,255,0.9)';
  for (let k = 0; k < 2; k++) {
    octx.beginPath();
    octx.arc(0, 0, r * 0.6, k * Math.PI + 0.35, k * Math.PI + 1.55);
    octx.stroke();
  }

  /* 四向刻度 */
  octx.shadowBlur = 0;
  octx.strokeStyle = 'rgba(255,255,255,0.55)';
  octx.lineWidth = 1;
  for (let k = 0; k < 4; k++) {
    const a = k * Math.PI / 2;
    octx.beginPath();
    octx.moveTo(Math.cos(a) * (r + 5), Math.sin(a) * (r + 5));
    octx.lineTo(Math.cos(a) * (r + 12), Math.sin(a) * (r + 12));
    octx.stroke();
  }

  /* 中心点 */
  octx.fillStyle = 'rgba(255,255,255,0.95)';
  octx.shadowColor = 'rgba(255,180,240,1)';
  octx.shadowBlur = 12;
  octx.beginPath();
  octx.arc(0, 0, 2.4, 0, TAU);
  octx.fill();

  octx.restore();
}

/* =========================================================
   11. 银河实例 / 动态状态
   ========================================================= */
let galaxy = null;

function buildGalaxy(count) {
  if (galaxy) {
    scene.remove(galaxy.group);
    galaxy.dispose();
    galaxy = null;
  }
  galaxy = new Galaxy(count);
  setHue(Number($('s-hue').value));
  galaxy.group.visible = false;
  scene.add(galaxy.group);
}

const dyn = {
  bloom: 0, targetBloom: 0,
  rawOpen: 0,
  opacity: 0, seen: false, lastSeen: -99,
  pos: new THREE.Vector3(), target: new THREE.Vector3(),
  focus: new THREE.Vector3(), focusStrength: 0, targetFocusStrength: 0,
  scale: 1, targetScale: 1, roll: 0,
  handVel: new THREE.Vector3(), handStr: 0, targetHandStr: 0,   // 右手扰动：速度 + 强度
  leftPos: new THREE.Vector3(), leftVel: new THREE.Vector3(), leftStr: 0, targetLeftStr: 0, leftSeen: false,   // 左手拨动场
  pinch: 0.5, spinVel: 0, spinAngle: 0, spinOffset: 0,   // 捏合缩放 / 拨动角动量 / 旋转朝向
  shockPos: new THREE.Vector3(), shockT: -99, shockStr: 0,     // 点击冲击波
  viewZoom: 1, targetViewZoom: 1, dragSpin: 0,                // 滚轮缩放 / 拖拽旋转
  parallax: { x: 0, y: 0 },                                   // 鼠标视差
  introT: 0,                                                  // 开场镜头推进进度
  justAppeared: true,
  bh: { state: 'galaxy', t: 0, k: 0, cool: 0, fistT: 0, openT: 0 },   // 黑洞形态状态机
  leftOpen: 0.5, flip: 0, targetFlip: 0,                             // 左手张握 → 三维翻转
};

/* =========================================================
   12. 每帧更新
   ========================================================= */
const BASE_SIZE = 5.5;
const _tmp = new THREE.Vector3();
const _prevPos = new THREE.Vector3();   // 上一帧银河中心（扰动速度计算）
const _velRaw = new THREE.Vector3();
const _prevLeft = new THREE.Vector3();  // 上一帧左手掌心（拨动速度计算）
const _lensProj = new THREE.Vector3();  // 黑洞屏幕投影（引力透镜用）

function update(dt, now) {
  let hs = state.hands;
  if (hs.length > 0 && state.skinMode) state.skinMode = false;   // MediaPipe 恢复 → 关闭兜底标记

  /* MediaPipe 无结果时 → 皮肤色块兜底（纯本地；节流 100ms 省 GPU 回读开销） */
  if (hs.length === 0 && state.cameraReady) {
    if (now - state.lastSkinT > 0.1) {
      state.lastSkinT = now;
      state.skinFb = skinFallback();
    }
    const fb = state.skinFb;
    if (fb) {
      hs = [fb];
      if (!state.skinMode) {
        state.skinMode = true;
        setStatus('未检测到手 · 已启用皮肤识别兜底', 'err');
      }
    } else if (state.skinMode) {
      state.skinMode = false;
    }
  }

  /* ---- 双手角色：右手 = 定位 + 捏合缩放；左手 = 旋转 + 拨动（单手时作主控） ---- */
  let ctrl = null, rot = null;
  if (hs.length === 1) {
    ctrl = hs[0];
  } else if (hs.length > 1) {
    ctrl = hs.find(h => h.handed === 'right') || hs[0];
    rot = hs.find(h => h.handed === 'left' && h !== ctrl) || hs.find(h => h !== ctrl) || null;
  }


  /* ---- 左手：旋转（手掌转角）+ 拨动（甩动 → 角动量 + 搅动场） ---- */
  if (rot) {
    videoToWorld(rot.palm.x, rot.palm.y, _tmp);
    _tmp.z = 0.35 + clamp((rot.scale - 0.09) * 5, -1, 1) * 0.6;   /* 深度估计：手掌尺寸近似深度 */
    if (!dyn.leftSeen) { dyn.leftPos.copy(_tmp); _prevLeft.copy(_tmp); }   // 首帧吸附，防速度尖峰
    dyn.leftPos.lerp(_tmp, 1 - Math.exp(-14 * dt));
    _velRaw.set(
      (dyn.leftPos.x - _prevLeft.x) / Math.max(dt, 1e-3),
      (dyn.leftPos.y - _prevLeft.y) / Math.max(dt, 1e-3),
      0
    );
    _prevLeft.copy(dyn.leftPos);
    dyn.leftVel.lerp(_velRaw, 1 - Math.exp(-8 * dt));
    if (dyn.leftVel.length() > 1.8) dyn.leftVel.setLength(1.8);

    /* ---- 左手张握 → 银河三维翻转（张开 +，握拳 −，幅度面板可调） ---- */
    const amp = ((Number($('s-flip').value) || 90) * Math.PI) / 180;
    const lo = smoothstep(0.18, 0.85, rot.raw);
    dyn.leftOpen += (lo - dyn.leftOpen) * (1 - Math.exp(-9 * dt));
    dyn.targetFlip = (dyn.leftOpen - 0.5) * 2 * amp;
    dyn.targetLeftStr = 0;
    dyn.leftSeen = true;
  } else {
    dyn.leftSeen = false;
    dyn.targetFlip = 0;   /* 手离开 → 缓缓回正 */
    dyn.targetLeftStr = 0;
    dyn.leftVel.multiplyScalar(Math.exp(-5 * dt));
  }
  dyn.leftStr = damp(dyn.leftStr, dyn.targetLeftStr, 4, dt);
  dyn.spinOffset = dampAngle(dyn.spinOffset, 0, 1.8, dt);   /* 旧旋转手势已移除 → 缓缓回正 */
  dyn.spinVel = damp(dyn.spinVel, 0, 1.05, dt);   // 角动量自然衰减
  dyn.spinVel = clamp(dyn.spinVel, -7, 7);
  dyn.spinAngle += dyn.spinVel * dt;
  if (Math.abs(dyn.spinAngle) > 628) dyn.spinAngle %= TAU;

  if (ctrl) {
    videoToWorld(ctrl.palm.x, ctrl.palm.y, dyn.target);
    dyn.target.z = clamp((ctrl.scale - 0.09) * 5, -1, 1);

    dyn.rawOpen += (ctrl.raw - dyn.rawOpen) * (ctrl.raw > dyn.rawOpen ? 0.4 : 0.2);

    const sens = state.sensitivity;
    const lo = clamp(0.30 - 0.10 * (sens - 1), 0.08, 0.5);
    const hi = clamp(0.70 - 0.08 * (sens - 1), 0.45, 0.9);
    dyn.targetBloom = smoothstep(lo, hi, dyn.rawOpen);

    /* 收缩放大：拇指-食指捏合距离 → 银河尺寸 */
    if (ctrl.pinch != null) {
      dyn.pinch = damp(dyn.pinch, clamp((ctrl.pinch - 0.55) / 0.85), 9, dt);
      dyn.targetScale = baseScale * (0.60 + 1.20 * dyn.pinch);
    } else {
      dyn.targetScale = baseScale;
    }
    dyn.roll = clamp(ctrl.roll * 0.22, -0.5, 0.5);

    videoToWorld(ctrl.tip.x, ctrl.tip.y, _tmp);
    dyn.focus.set(_tmp.x, _tmp.y, 0.5);
    dyn.targetFocusStrength = 0.6;

    if (!dyn.seen) dyn.justAppeared = true;
    dyn.seen = true;
    dyn.lastSeen = now;

  } else {
    if (dyn.seen && now - dyn.lastSeen > 0.3) {
      dyn.seen = false;
      dyn.targetBloom = 0;
      dyn.targetFocusStrength = 0;
    }

    const idle = now - state.pointer.lastMove;

    if (state.pointer.active) {
      dyn.target.set(
        clamp(state.pointer.x - 0.5, -0.45, 0.45) * 2 * halfW,
        clamp(0.5 - state.pointer.y, -0.45, 0.45) * 2 * halfH,
        0
      );
      dyn.targetBloom = state.pointer.down ? 1 : 0.12;
      dyn.targetScale = baseScale;
      dyn.roll = 0;
      dyn.focus.set(dyn.target.x, dyn.target.y + 0.1, 0.5);
      dyn.targetFocusStrength = 0.45;
      dyn.seen = true;
      dyn.lastSeen = now;

    } else if (state.autoDemo && idle > 1.0) {
      dyn.targetBloom = 0.5 + 0.5 * Math.sin(now * 0.36);
      dyn.target.set(Math.sin(now * 0.29) * 0.9, Math.cos(now * 0.23) * 0.42, 0);
      dyn.targetScale = baseScale;
      dyn.roll = 0;
      dyn.targetFocusStrength = 0;
      dyn.seen = true;
      dyn.lastSeen = now;

    } else {
      dyn.targetBloom = 0;
      dyn.targetFocusStrength = 0;
      dyn.seen = false;
    }
  }

  /* ---- 黑洞形态状态机：握拳 0.4s → 2s 坍缩 → 黑洞；张掌 0.4s → 2s 绽放回归 ---- */
  {
    const bh = dyn.bh;
    bh.cool = Math.max(0, bh.cool - dt);
    const bhOn = $('s-bh') ? $('s-bh').checked : true;
    if (!bhOn) {
      if (bh.state !== 'galaxy') { bh.state = 'galaxy'; bh.t = 0; bh.k = 0; bh.fistT = 0; bh.openT = 0; }
    } else if (dyn.seen) {
      const ctrlReal = !!ctrl && !state.skinMode;   /* 仅真实 MediaPipe 手可触发黑洞（皮肤兜底不触发） */
      const fistNow = ctrlReal && dyn.rawOpen < 0.22;
      const openNow = ctrlReal && dyn.rawOpen > 0.72;
      if (bh.state === 'galaxy') {
        bh.fistT = fistNow ? bh.fistT + dt : 0;
        if (bh.fistT >= 0.4 && bh.cool <= 0) {
          bh.state = 'collapsing'; bh.t = 0; bh.fistT = 0;   /* 持续握拳 0.4s → 进入坍缩 */
        }
      } else if (bh.state === 'collapsing') {
        bh.t = Math.min(1, bh.t + dt / 2.0);                 /* 2s 坍缩为黑洞 */
        bh.k = smoothstep(0, 1, bh.t);
        if (bh.t >= 1) { bh.state = 'blackhole'; bh.cool = 0.9; }
      } else if (bh.state === 'blackhole') {
        bh.openT = openNow ? bh.openT + dt : 0;
        if (bh.openT >= 0.4 && bh.cool <= 0) { bh.state = 'blooming'; bh.t = 0; bh.openT = 0; }
      } else if (bh.state === 'blooming') {
        bh.t = Math.min(1, bh.t + dt / 2.0);                 /* 2s 绽放回归银河 */
        bh.k = 1 - smoothstep(0, 1, bh.t);
        if (bh.t >= 1) { bh.state = 'galaxy'; bh.k = 0; bh.cool = 0.9; }
      }
    }
    if (!isFinite(bh.k)) { bh.k = 0; bh.state = 'galaxy'; }
  }

  /* ---- 阻尼 ---- */
  dyn.bloom = damp(dyn.bloom, dyn.targetBloom, 8, dt);
  dyn.scale = damp(dyn.scale, dyn.targetScale, 6, dt);
  dyn.focusStrength = damp(dyn.focusStrength, dyn.targetFocusStrength, 6, dt);
  dyn.opacity = damp(dyn.opacity, dyn.seen ? 1 : 0, dyn.seen ? 8 : 3, dt);
  dyn.flip = damp(dyn.flip, dyn.targetFlip, 3.2, dt);

  if (dyn.justAppeared) {
    dyn.pos.copy(dyn.target);
    dyn.justAppeared = false;
    _prevPos.copy(dyn.pos);   // 防止瞬移产生速度尖峰
  } else {
    dyn.pos.lerp(dyn.target, 1 - Math.exp(-11 * dt));
  }

  /* ---- 手的扰动：掌心（银河中心）移动速度 → 搅动强度 ---- */
  _velRaw.set(
    (dyn.pos.x - _prevPos.x) / Math.max(dt, 1e-3),
    (dyn.pos.y - _prevPos.y) / Math.max(dt, 1e-3),
    0
  );
  _prevPos.copy(dyn.pos);
  const spd = Math.min(_velRaw.length(), 1.8);
  dyn.handVel.lerp(_velRaw, 1 - Math.exp(-7 * dt));
  if (dyn.handVel.length() > 1.8) dyn.handVel.setLength(1.8);
  dyn.targetHandStr = (dyn.seen ? 1 : 0) * (0.22 + 0.75 * clamp(spd / 1.8));
  dyn.handStr = damp(dyn.handStr, dyn.targetHandStr, 3.5, dt);

  /* ---- 数值安全网：任何一项异常都不至于让银河消失 ---- */
  if (!isFinite(dyn.bloom)) dyn.bloom = 0;
  if (!isFinite(dyn.opacity)) dyn.opacity = 0;
  if (!isFinite(dyn.rawOpen)) dyn.rawOpen = 0;
  if (!isFinite(dyn.scale) || dyn.scale <= 0.01) dyn.scale = baseScale;
  if (!isFinite(dyn.pinch)) dyn.pinch = 0.5;
  if (!isFinite(dyn.spinOffset)) dyn.spinOffset = 0;
  if (!isFinite(dyn.spinAngle)) dyn.spinAngle = 0;
  if (!isFinite(dyn.handStr)) dyn.handStr = 0;
  if (!isFinite(dyn.leftStr)) dyn.leftStr = 0;
  if (!isFinite(dyn.focusStrength)) dyn.focusStrength = 0;
  if (!isFinite(dyn.focus.x + dyn.focus.y)) dyn.focus.set(0, 0, 0.5);
  if (!isFinite(dyn.pos.x + dyn.pos.y + dyn.pos.z)) dyn.pos.set(0, 0, 0);
  if (!isFinite(dyn.target.x + dyn.target.y + dyn.target.z)) dyn.target.set(0, 0, 0);
  if (!isFinite(dyn.handVel.x + dyn.handVel.y)) dyn.handVel.set(0, 0, 0);
  if (!isFinite(dyn.leftVel.x + dyn.leftVel.y)) dyn.leftVel.set(0, 0, 0);

  /* ---- 冲击波衰减 / 鼠标视差 / 滚轮视距 ---- */
  dyn.shockStr = damp(dyn.shockStr, 0, 2.2, dt);
  dyn.parallax.x = (state.pointer.x - 0.5) * 2;
  dyn.parallax.y = (0.5 - state.pointer.y) * 2;
  dyn.viewZoom = damp(dyn.viewZoom, dyn.targetViewZoom, 5, dt);

  if (galaxy) {
    const g = galaxy.group;
    g.position.copy(dyn.pos);
    g.scale.setScalar(dyn.scale * dyn.viewZoom);

    /* 3D 倾角 + 缓慢摆动 */
    const tiltRad = (Number($('s-tilt').value) * Math.PI) / 180;
    g.rotation.x = damp(g.rotation.x, tiltRad + 0.05 * Math.sin(now * 0.16) + dyn.flip, 1.6, dt);
    g.rotation.z = dyn.spinOffset + dyn.spinAngle;   // 左手旋转 / 拨动
    g.visible = dyn.opacity > 0.008;

    const u = galaxy.shared;
    u.uTime.value = now;
    u.uBloom.value = dyn.bloom;
    u.uBH.value = dyn.bh.k;                                   /* 黑洞坍缩因子 */
    u.uOpacity.value = dyn.opacity * (1 - 0.88 * smoothstep(0.30, 1.0, dyn.bh.k));   /* 银河淡出（后段加速） */
    u.uFocus.value.copy(dyn.focus);
    u.uFocusStrength.value = dyn.focusStrength * (0.35 + 0.65 * dyn.bloom);
    u.uFocusRadius.value = 1.5;
    u.uHand.value.copy(dyn.pos);
    u.uHandVel.value.copy(dyn.handVel);
    u.uHandStr.value = dyn.handStr * (0.4 + 0.6 * dyn.bloom);
    u.uHand2.value.copy(dyn.leftPos);
    u.uHand2Vel.value.copy(dyn.leftVel);
    u.uHand2Str.value = dyn.leftStr;
    u.uShock.value.copy(dyn.shockPos);
    u.uShockT.value = dyn.shockT;
    u.uShockStr.value = dyn.shockStr;
    u.uSize.value = BASE_SIZE * Number($('s-size').value);
    u.uPixelRatio.value = DPR;
    u.uSpin.value = Number($('s-spin').value);
    u.uArms.value = NARMS;
    u.uGalR.value = GALAXY_R;

    /* ---- 黑洞视觉：吸积盘（近/远半）/ 环绕光带 / 喷流 / 事件视界 ---- */
    const fx = galaxy.bhFx;
    if (fx) {
      const bk = dyn.bh.k;
      const vis = bk > 0.015 && dyn.opacity > 0.01;
      fx.diskFar.visible = fx.diskNear.visible = fx.band.visible = fx.jet.visible = fx.shadow.visible = vis;
      if (vis) {
        const kD = smoothstep(0.28, 0.92, bk);   /* 吸积盘 + 光带（中段浮现） */
        const kS = smoothstep(0.10, 0.82, bk);   /* 视界阴影（早段生长） */
        const kJ = smoothstep(0.55, 1.00, bk);   /* 喷流（最后出现） */
        const op = dyn.opacity;
        const spinZ = dyn.spinOffset + dyn.spinAngle;
        fx.diskFarMat.uniforms.uOpacity.value = op * kD;
        fx.diskNearMat.uniforms.uOpacity.value = op * kD;
        fx.bandMat.uniforms.uOpacity.value = op * kD;
        fx.jetMat.uniforms.uOpacity.value = op * kJ * 0.9;
        fx.shadowMat.uniforms.uOpacity.value = op * kS * 0.97;
        fx.diskFarMat.uniforms.uTime.value = now;
        fx.diskNearMat.uniforms.uTime.value = now;
        fx.bandMat.uniforms.uTime.value = now;
        fx.jetMat.uniforms.uTime.value = now;
        fx.diskFarMat.uniforms.uPixelRatio.value = DPR;
        fx.diskNearMat.uniforms.uPixelRatio.value = DPR;
        fx.bandMat.uniforms.uPixelRatio.value = DPR;
        fx.jetMat.uniforms.uPixelRatio.value = DPR;
        fx.diskFarMat.uniforms.uSpinZ.value = spinZ;
        fx.diskNearMat.uniforms.uSpinZ.value = spinZ;
        const rsD = 0.18 + 0.82 * kD;
        fx.diskFar.scale.setScalar(rsD);
        fx.diskNear.scale.setScalar(rsD);
        fx.band.scale.setScalar(rsD);
        fx.jet.scale.setScalar(0.15 + 0.85 * kJ);
        fx.shadow.scale.setScalar((0.10 + 0.90 * kS) * 1.78);
        fx.band.rotation.z = -spinZ;               /* 抵消银河自旋 → 光带始终环绕黑洞 */
        fx.shadow.lookAt(camera.position);
      }
    }

    /* ---- 引力透镜：黑洞屏幕投影 → 后处理空间扭曲 ---- */
    _lensProj.copy(dyn.pos).project(camera);
    compMat.uniforms.uLens.value.set(_lensProj.x * 0.5 + 0.5, _lensProj.y * 0.5 + 0.5, dyn.bh.k * 0.9);

    /* 星云雾气：缓慢流动 + 呼吸（黑洞态淡出） */
    const bhFade = 1 - 0.82 * smoothstep(0.30, 1.0, dyn.bh.k);
    for (const sp of galaxy.sprites) {
      const ud = sp.userData;
      sp.material.rotation = ud.rot + now * (0.02 + ud.phase * 0.012);
      const pulse = 1 + 0.09 * Math.sin(now * 0.5 + ud.phase * 3);
      sp.scale.set(ud.base * pulse, ud.base * pulse, 1);
      sp.material.opacity = ud.op * (0.10 + 0.90 * dyn.bloom) * dyn.opacity * bhFade;
    }

    /* 银核三层辉光脉动（黑洞态收缩淡出） */
    const corePulse = 0.9 + 0.1 * Math.sin(now * 1.4);
    galaxy.coreGlow.material.opacity = (0.42 + 0.58 * dyn.bloom) * corePulse * dyn.opacity * bhFade;
    galaxy.coreGlow.scale.setScalar((2.4 + 0.5 * dyn.bloom) * corePulse * (1 - 0.5 * dyn.bh.k));
    galaxy.coreGlow2.material.opacity = (0.26 + 0.44 * dyn.bloom) * corePulse * dyn.opacity * bhFade;
    galaxy.coreGlow2.scale.setScalar((5.0 + 1.0 * dyn.bloom) * (1 - 0.5 * dyn.bh.k));
    galaxy.coreHalo.material.opacity = (0.13 + 0.20 * dyn.bloom) * dyn.opacity * bhFade;
    galaxy.coreHalo.scale.setScalar((8.6 + 2.0 * dyn.bloom) * (1 - 0.55 * dyn.bh.k));
  }

}

/* =========================================================
   13. 主循环
   ========================================================= */
const clock = new THREE.Clock();
let fpsAcc = 0, fpsFrames = 0, hudTimer = 0;
let lowStreak = 0, autoDegrade = 0;   // 性能自适应状态

function animate() {
  requestAnimationFrame(animate);

  const rawDt = clock.getDelta();          // 真实帧间隔（用于 FPS 统计）
  const dt = Math.min(rawDt, 0.05);        // 仿真步长（限幅防跳变）
  state.time += dt;
  const now = state.time;

  updateIntro(dt);
  update(dt, now);

  updateBackground(now, dt);
  updateMeteors(now, dt);

  renderFrame();

  drawSkeleton();
  drawFocusMarker();

  fpsAcc += rawDt; fpsFrames++; hudTimer += rawDt;
  if (hudTimer > 0.3) {
    hudTimer = 0;
    const fps = fpsFrames / Math.max(fpsAcc, 1e-4);
    state.fpsNow = fps;
    fpsAcc = 0; fpsFrames = 0;

    /* ---- 性能自适应：帧率过低 → 先关辉光，再降粒子 ---- */
    if (now < 10) lowStreak = 0;   /* 启动宽限：初始化抖动不计入降级 */
    else if (fps < 15) lowStreak++; else lowStreak = 0;
    if (lowStreak >= 8 && autoDegrade < 3) {
      lowStreak = 0;
      /* 只降粒子量：辉光与分辨率保持不变 → 雾状光带亮度始终保留 */
      if (galaxy && galaxy.count > 60000) {
        autoDegrade++;
        buildGalaxy(Math.max(60000, Math.round(galaxy.count * 0.75)));
      }
    }

    const n = galaxy ? galaxy.count : 0;
    $('stats').textContent =
      `${fps.toFixed(0)} fps · ${(n / 1000).toFixed(0)}k pts · 辉光${bloomEnabled ? '开' : '关'}${autoDegrade ? ' · 自适应降级' : ''}`;


    /* ---- 手部检测看门狗：无结果 → 切换模型源 / 给出指引 ---- */
    if (state.cameraReady) {
      const noHandFor = now - state.lastResultTime;
      if (state.hands.length > 0) {
        if ($('hint').textContent.indexOf('握拳') < 0) {
          $('hint').textContent = '右手移动/捏合缩放 · 左手张握翻转 · 握拳成黑洞 · 张掌回银河';
        }
      } else if (noHandFor > 10 && !frameBusy) {
        /* 不打断正在加载/推理中的实例（避免 MediaPipe 内部竞态崩溃） */
        if (!state.mpEverWorked && mpBaseIdx < MP_BASES.length - 1) {
          /* 只有「模型从未产出过任何结果」才视为资源源问题 → 切换下一个源 */
          mpBaseIdx++;
          console.warn('[mp] 当前 CDN 源无结果，切换 →', MP_BASES[mpBaseIdx]);
          initHands();
          state.lastResultTime = now;
          setStatus('正在切换模型资源源重试…');
        } else {
          /* 模型正常、只是画面里暂时没手（或所有源都试过）→ 只提示，绝不切换，避免打断识别 */
          const tip = state.facingMode === 'environment'
            ? '未检测到手：请把手放到手机背面镜头前，或点「切换摄像头」'
            : '未检测到手：请把手放进画面';
          if ($('hint').textContent !== tip) $('hint').textContent = tip;
          if (!state.mpEverWorked) setStatus('模型资源均不可达 · 可尝试皮肤兜底或鼠标操作', 'err');
        }
      }

      /* ---- 管线诊断 ---- */
      const mpState = typeof window.Hands === 'undefined' ? '未载入' : (state.mpEverWorked ? 'OK' : '无结果');
      const handTag = state.hands.length
        ? '(' + state.hands.map(h => h.handed === 'left' ? '左' : h.handed === 'right' ? '右' : '?').join('') + ')'
        : '';
      $('diag').textContent =
        `MP:${mpState} · CAM:${state.cameraReady ? (state.facingMode === 'environment' ? '后置' : '前置') : '未开'} · 手:${state.hands.length}${handTag} · 源:${mpBaseIdx + 1}/${MP_BASES.length}${state.skinMode ? ' · 皮肤兜底' : ''} · 臂:${NARMS}`;
    }
  }
}

/* =========================================================
   14. 鼠标 / 触摸兜底
   ========================================================= */
function ptr(e) {
  const t = e.touches ? e.touches[0] : e;
  return { x: clamp(t.clientX / innerWidth), y: clamp(t.clientY / innerHeight) };
}

addEventListener('pointermove', (e) => {
  if (state.hands.length > 0) return;
  const p = ptr(e);
  state.pointer.x = p.x;
  state.pointer.y = p.y;
  state.pointer.active = true;
  state.pointer.lastMove = state.time;
}, { passive: true });

addEventListener('pointerdown', (e) => {
  if (e.target.closest('.fab, .panel, .cam-retry')) return;
  const p = ptr(e);
  state.pointer.x = p.x;
  state.pointer.y = p.y;
  state.pointer.active = true;
  state.pointer.down = true;
  state.pointer.lastMove = state.time;
}, { passive: true });

addEventListener('pointerup', () => {
  state.pointer.down = false;
  state.pointer.lastMove = state.time;
}, { passive: true });

addEventListener('pointercancel', () => { state.pointer.down = false; }, { passive: true });

/* ---- 点击 → 冲击波（粒子被推开后弹性回归） ---- */
addEventListener('pointerdown', (e) => {
  if (e.target.closest('.fab, .panel, .cam-retry, .cam-flip')) return;
  const p = ptr(e);
  screenToWorld(p.x * innerWidth, p.y * innerHeight, dyn.shockPos);
  dyn.shockPos.z = 0.2;
  dyn.shockT = state.time;
  dyn.shockStr = 1.0;
}, { passive: true });

/* ---- 滚轮缩放 ---- */
addEventListener('wheel', (e) => {
  dyn.targetViewZoom = clamp(dyn.targetViewZoom * (1 - e.deltaY * 0.0012), 0.45, 2.4);
}, { passive: true });

/* ---- 拖拽旋转 ---- */
let _dragX = null;
addEventListener('pointerdown', (e) => {
  if (e.target.closest('.fab, .panel, .cam-retry, .cam-flip')) return;
  _dragX = e.clientX;
}, { passive: true });
addEventListener('pointermove', (e) => {
  if (_dragX === null) return;
  const dx = e.clientX - _dragX;
  _dragX = e.clientX;
  dyn.spinVel = clamp(dyn.spinVel + dx * 0.010, -7, 7);
}, { passive: true });
addEventListener('pointerup', () => { _dragX = null; }, { passive: true });

  $('v-spin').textContent = Number(e.target.value).toFixed(2);
});

$('s-tilt').addEventListener('input', (e) => {
  $('v-tilt').textContent = Number(e.target.value).toFixed(0) + '°';
});

$('s-dist').addEventListener('input', (e) => {
  state.distK = Number(e.target.value);
  $('v-dist').textContent = state.distK.toFixed(2);
});

$('s-bright').addEventListener('input', (e) => {
  $('v-bright').textContent = Number(e.target.value).toFixed(2);
  setBrightness(Number(e.target.value));
});

$('s-auto').addEventListener('change', (e) => { state.autoDemo = e.target.checked; });

$('s-skel').addEventListener('change', (e) => { state.showSkeleton = e.target.checked; });

$('s-mirror').addEventListener('change', (e) => {
  state.mirror = e.target.checked;
  applyMirror();
});

/* ---- 重试摄像头 ---- */
$('btn-cam').addEventListener('click', async () => {
  $('btn-cam').classList.add('hidden');
  setStatus('正在重试摄像头…');
  try {
    await startTracking();
    const name = state.facingMode === 'environment' ? '后置摄像头' : '前置摄像头';
    setStatus(`已就绪 · ${name} · 银河跟随手掌`, 'ok');
    $('hint').textContent = '右手移动/捏合缩放 · 左手张握翻转 · 握拳成黑洞 · 张掌回银河';
  } catch (err) {
    console.warn('[tracking]', err);
    setStatus(err && err.message ? err.message : '摄像头启动失败', 'err');
    $('btn-cam').classList.remove('hidden');
  }
});

/* ---- 切换前后摄像头 ---- */
$('btn-flip').addEventListener('click', async () => {
  $('btn-flip').classList.add('hidden');
  state.targetFacing = state.facingMode === 'environment' ? 'user' : 'environment';
  setStatus('正在切换摄像头…');
  try {
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    camStream = null;
    state.cameraReady = false;
    await acquireCamera();
    const name = state.facingMode === 'environment' ? '后置摄像头' : '前置摄像头';
    setStatus(`已就绪 · ${name} · 银河跟随手掌`, 'ok');
  } catch (err) {
    setStatus(err && err.message ? err.message : '摄像头切换失败', 'err');
  }
  $('btn-flip').classList.remove('hidden');
});

/* =========================================================
   16. 自适应
   ========================================================= */
function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  updateViewport();
  renderer.setSize(w, h, false);
  const dbs = renderer.getDrawingBufferSize(new THREE.Vector2());
  resizePost(dbs.x, dbs.y);
  resizeOverlay();
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 150));

/* =========================================================
   17. 启动
   ========================================================= */
/* ---- GPU 上下文丢失自动恢复（移动端高负载保护） ---- */
canvas.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  setStatus('GPU 上下文丢失 · 等待自动恢复…', 'err');
}, false);
canvas.addEventListener('webglcontextrestored', () => {
  setStatus('GPU 已恢复', 'ok');
  buildGalaxy(galaxy ? galaxy.count : DEFAULT_COUNT);
}, false);

/* ---- 着色器编译错误上屏（排查「粒子消失」用） ---- */
renderer.debug.onShaderError = (gl, program, vs, fs) => {
  const vlog = (gl.getShaderInfoLog(vs) || '').trim();
  const flog = (gl.getShaderInfoLog(fs) || '').trim();
  const log = (vlog || flog || gl.getProgramInfoLog(program) || '未知错误').slice(0, 90);
  window.__SHADER_ERR = log;
  setStatus('着色器编译失败：' + log, 'err');
  console.error('[shader] VS:', vlog, '| FS:', flog);
};

/* ---- 调试探针：供自动化检查粒子系统状态 ---- */
window.__DBG = () => {
  const info = renderer.info && renderer.info.render ? renderer.info.render : {};
  return {
    points: info.points || 0, calls: info.calls || 0,
    galaxyCount: galaxy ? galaxy.count : null,
    gVisible: galaxy ? galaxy.group.visible : null,
    opacity: +dyn.opacity.toFixed(3), scale: +dyn.scale.toFixed(3), bloom: +dyn.bloom.toFixed(3),
    seen: dyn.seen,
    pos: [+dyn.pos.x.toFixed(2), +dyn.pos.y.toFixed(2), +dyn.pos.z.toFixed(2)],
    rotZ: +(dyn.spinOffset + dyn.spinAngle).toFixed(2),
    handStr: +dyn.handStr.toFixed(2), leftStr: +dyn.leftStr.toFixed(2),
    shaderErr: window.__SHADER_ERR || null,
    bloom: bloomEnabled, bloomStr: +compMat.uniforms.uBloom.value.toFixed(2),
    arms: NARMS, layers: galaxy ? galaxy.layers.map(L => L.count) : null,
    autoDegrade,
    bh: dyn.bh.state, bhK: +dyn.bh.k.toFixed(3), flip: +dyn.flip.toFixed(2), leftOpen: +dyn.leftOpen.toFixed(2),
    mp: { everWorked: state.mpEverWorked, base: mpBaseIdx + 1, busy: frameBusy, hands: state.hands.length, skin: state.skinMode },
  };
};

/* ---- 调试：强制黑洞坍缩系数（自动化验证用） ---- */
window.__BHSET = (k) => {
  dyn.bh.k = clamp(Number(k) || 0);
  dyn.bh.state = dyn.bh.k > 0.5 ? 'blackhole' : 'galaxy';
  dyn.bh.t = 0;
};

(function boot() {
  $('loading').classList.remove('done');
  /* 启动时覆盖提示文案（兜底 HTML 初始文本） */
  $('hint').textContent = '右手移动/捏合缩放 · 左手张握翻转 · 握拳成黑洞 · 张掌回银河';

  if (!SUPPORTS_SCREEN) {
    videoEl.style.display = 'none';
  }

  setTimeout(() => {
    const _dbs = renderer.getDrawingBufferSize(new THREE.Vector2());
    resizePost(_dbs.x, _dbs.y);
    buildGalaxy(DEFAULT_COUNT);
    $('loading').classList.add('done');
    setTimeout(() => { $('loading').style.display = 'none'; }, 600);

    animate();

    setStatus('正在请求后置摄像头…');
    startTracking()
      .then(() => {
        const name = state.facingMode === 'environment' ? '后置摄像头' : '前置摄像头';
        setStatus(`已就绪 · ${name} · 银河跟随手掌`, 'ok');
        $('hint').textContent = '右手移动/捏合缩放 · 左手张握翻转 · 握拳成黑洞 · 张掌回银河';
      })
      .catch((err) => {
        console.warn('[tracking] 初始化失败：', err);
        setStatus(err && err.message ? err.message : '摄像头不可用 · 已切换到鼠标模式', 'err');
        $('hint').textContent = '移动鼠标控制银河 · 按住左键让它绽放';
        $('btn-cam').classList.remove('hidden');
      });

    setTimeout(() => {
      if (!state.lastResults) {
        setStatus('未检测到手 · 可点「切换摄像头」或鼠标操作', 'err');
        $('hint').textContent = '后置摄像头在手机背面：把手放到镜头前 · 或点「切换摄像头」';
      }
    }, 10000);
  }, 40);
})();
</script>
</body>
</html>
